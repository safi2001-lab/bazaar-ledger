  - id: M2-WIRE-01
    milestone: M2
    title: A printer is reachable from the app at all
    status: done
    # The row this milestone lived or died on. AppServices now carries
    # PrintingServices, the barrel exports what a screen needs, and main.dart
    # registers the LAN transport plus the Bluetooth one on Android.
    #
    # The proof drives the real widget tree by taps and typing and asserts on
    # bytes that arrived at a transport. A test that called print() on the
    # services directly would have passed throughout the period when nothing
    # under lib/ imported a printer at all.
    proof:
      - a shopkeeper sets up a printer and a bill reaches it
      - the printer a shop chose is remembered by the database

  - id: M2-SETUP-01
    milestone: M2
    title: A printer setup screen with a test print you can look at
    status: done
    # The test print is the point of the screen. ESC/POS has no query for
    # column width and 80 mm printers ship as both 42 and 48, so the only
    # reliable detector is a ruler on paper and a shopkeeper looking at it.
    #
    # The width assertion in the proof was vacuous on its first draft — it
    # matched any 48-character line, and the sample money rows are padded to
    # exactly that. Shortening the ruler by three characters did not fail it.
    # It now matches the ruler specifically.
    proof:
      - a shopkeeper sets up a printer and a bill reaches it
      - a printer that cannot work here is offered, and says why

