  - id: M1-HIST-01
    milestone: M1
    title: An item shows where its stock went
    status: done
    # "There should be forty and there are thirty-one" is a question the shelf
    # cannot answer. `stock_ledger` is append-only and the write path refuses
    # to rewrite or tombstone a row in it, so this is a reading of history
    # rather than a reconstruction of one -- which is the whole reason the
    # answer can be trusted.
    #
    # Writing the paging test for it found a real shipping bug two layers
    # away: `entry_no` is TEXT (it holds `JV-2627-0001`), and the stock
    # adjustment writer computed the next one with `MAX(entry_no) + 1`. MAX
    # over TEXT compares lexicographically, so after the ninth entry the
    # maximum stayed '9' forever and the tenth correction of a fiscal year
    # died on a UNIQUE constraint. Ten corrections a year is an ordinary
    # Tuesday. See M1-STOCK-06.
    proof:
      - an opening balance is the first thing the history shows
      - a correction names the reason, because no bill explains it
      - newest first, because that is the end a shopkeeper starts from
      - the running balance is carried on each row
      - another item history is not mixed in
      - paging every movement appears exactly once across pages
      - paging paged order matches unpaged order exactly
      - paging the last page ends, rather than repeating forever
      - an item shows where its stock went
      - an item nothing has happened to says so
      - a sale appears in the history with its bill number

  - id: M1-STOCK-06
    milestone: M1
    title: Voucher numbers survive a shop that corrects stock more than nine times
    status: done
    # Found by accident, and it would have hit every real shop.
    #
    # `journal_entries.entry_no` is TEXT because it holds a document number a
    # person reads and quotes. The stock adjustment writer numbered its
    # vouchers with `SELECT MAX(entry_no) + 1`, which is arithmetic on text:
    # '10' sorts below '9', so the maximum stopped moving at the ninth entry
    # and the tenth correction failed with a raw SQLite constraint error.
    #
    # In a shop that had also posted a sale it was worse. MAX returned
    # 'JV-2627-0001', SQLite coerced that to 0 for the addition, and the very
    # first correction tried to write 1 -- a number in a different format from
    # every other voucher in the book.
    #
    # Nothing caught it because no test had ever made more than two
    # corrections. It now draws from the same SequenceAllocator every other
    # document uses.
    proof:
      - the tenth correction of the year is as ordinary as the first
      - a correction and a sale draw voucher numbers from one series

  - id: M1-STOCK-05
    milestone: M1
    title: A stock summary a shopkeeper can read at a glance
    status: done
    # Five numbers and no table -- the table IS the item list underneath it.
    #
    # Valued at COST. Valuing the shelf at what it would sell for counts profit
    # the shop has not made, and is the commonest way a small business talks
    # itself into believing it is richer than it is.
    #
    # The arithmetic is the other way to get this wrong. Quantity is
    # thousandths and cost is milli-paisa, so the product needs scaling twice:
    # dividing per row truncates up to a paisa per item, which is two hundred
    # rupees across a 20,000-SKU catalogue, and multiplying without scaling
    # down first reaches 1e18 on a wholesaler -- close enough to the int64
    # ceiling to be a real risk. Scaled once in SQL, rounded once in Dart
    # through the project's own half-up policy. Two tests pin both bounds.
    #
    # `below zero` is surfaced rather than clamped: a negative ledger balance
    # means the shop sold something it never recorded receiving. Impossible on
    # a shelf, and a bookkeeping error a person has to fix -- hiding it makes
    # the valuation above quietly wrong.
    proof:
      - an empty shop is empty, not an error
      - stock is valued at cost, never at what it would sell for
      - several items add up
      - a service is not stock and does not count as out of stock
      - low, out and negative are counted apart
      - an item at exactly its floor is low, not fine
      - an item with no floor is never low, however little is left
      - a fractional quantity is valued exactly
      - two thousand items are valued to the paisa
      - a very large shop does not overflow
      - another firm is not counted
      - the item list shows what the stock is worth, at cost
      - a shop with nothing wrong shows no warnings
      - what is low and what is gone are counted apart
      - a brand new shop is not shown an empty valuation

