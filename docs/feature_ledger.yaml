  - id: M1-ITEM-03
    milestone: M1
    title: An item can carry a photograph
    status: done
    # Worth more here than in most catalogues. National literacy is around 60%
    # and rural literacy near 50%, so a cashier who cannot read a name fluently
    # can still recognise a packet -- the same reasoning behind the icons, the
    # big numerals and the colour-coded direction everywhere else in this app.
    #
    # Stored INLINE, which the schema chose deliberately: "small images live
    # inline so a backup is one file and a restore cannot come back with
    # missing pictures". A path would be faster and would mean a shopkeeper
    # restoring onto a new phone gets their books back with every photograph
    # gone, which reads as the restore having half worked.
    #
    # That trade only holds while the pictures stay small, so the shrinker is
    # load-bearing rather than a nicety: 512px longest edge, 96 KB ceiling,
    # quality stepped down and then size stepped down. It NEVER refuses -- "try
    # a plainer photograph" is not advice anybody can follow while standing in
    # front of a shelf.
    #
    # The write path had to learn about blobs. `_checked` allowed only int,
    # String, bool and null; the rule was never "scalars only", it is that a
    # double must never reach a money column, and a blob is not a number that
    # can round.
    #
    # Gallery only, through Android's system Photo Picker: no READ_MEDIA_IMAGES
    # (Play restricts it to apps the picker cannot serve, and a billing app
    # asking for it goes through a declaration review to let a shopkeeper
    # photograph a tin of oil) and no CAMERA. That permission arrives with
    # barcode scanning or not at all.
    proof:
