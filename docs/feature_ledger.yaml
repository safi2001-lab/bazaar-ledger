  # ---------------------------------------------------------------------------
  # M2 — a receipt reaches paper, once, on hardware a shop already owns
  #
  # Two commits said this milestone had landed. Both described packages, not the
  # app: nothing under lib/ imports a printer, pk_bootstrap deliberately does
  # not export one, and the receipt screen renders `print_disabled` under a
  # string that reads "Printing arrives in M2." The library rows below are
  # genuinely done and genuinely good. M2-WIRE-01 is the row that decides
  # whether any of it is a feature.
  # ---------------------------------------------------------------------------

  - id: M2-LAN-01
    milestone: M2
    title: A printer on the shop wi-fi takes every byte, in order
    status: done
    proof:
      - a printer on the shop wi-fi takes every byte of the receipt, in order

  - id: M2-LAN-02
    milestone: M2
    title: An unreachable printer is safe to try again
    status: done
    proof:
      - a printer on the shop wi-fi an unreachable printer is safe to try again

  - id: M2-QUEUE-01
    milestone: M2
    title: One job, printed once, however many times it is asked for
    status: done
    proof:
      - the queue, and the rule it exists for one job, printed once, however many times it is asked for
      - the queue, and the rule it exists for jobs go out one at a time

  - id: M2-QUEUE-02
    milestone: M2
    title: A print that failed part way is never retried on its own
    status: done
    proof:
      - the queue, and the rule it exists for a print that failed part way is never retried on its own
      - the queue, and the rule it exists for a print that never started is retried, and then gives up
      - the queue, and the rule it exists for a transport that throws something unexpected is treated as partial

  - id: M2-QUEUE-03
    milestone: M2
    title: A reprint is a deliberate act and goes through a different door
    status: done
    proof:
      - the queue, and the rule it exists for a reprint is a deliberate act and goes through a different door

  - id: M2-QUEUE-04
    milestone: M2
    title: Idempotency survives the process being killed mid-print
    status: done
    # print_jobs, schema v2. The row is committed BEFORE the first byte, so a
    # row still saying `sending` at next launch means the app died holding the
    # job — which is NOT the same as un-printed, because on a Transsion ROM the
    # kill lands after the printer has already taken part of the receipt.
    proof:
      - what has already been printed a job interrupted by a process kill is UNKNOWN, not un-printed
      - what has already been printed a job that finished is remembered as printed
      - what has already been printed a job that never started is safe to try again
      - what has already been printed a job that failed part way is never safe to try again
      - what has already been printed the same job key cannot be begun twice
      - what has already been printed finishing a job nobody started is refused, and says why
      - the record that outlives the process a job the log says already printed never reaches the printer
      - the record that outlives the process a job left mid-flight by a process death reports unknown, not lost
      - the record that outlives the process a half-printed job is not sent again when it is asked for twice
      - the record that outlives the process the job is recorded before a byte is sent, and settled after

  - id: M2-PERM-01
    milestone: M2
    title: The permission list is a promise a shopkeeper can check
    status: done
    proof:
      - every manifest that ships is present
      - nothing asks for location, ever
      - the app asks for exactly what its features need, and nothing else
      - Bluetooth is asked for by the plugin that uses it
      - scanning is declared as never being about location
      - the legacy Bluetooth pair stop at Android 11
      - the books are kept out of every backup Android performs

