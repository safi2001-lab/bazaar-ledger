  # ---------------------------------------------------------------------------

  - id: M17-BOM-01
    milestone: M17
    title: A recipe is written and a production run moves stock and cost
    status: done
    proof:
      - assembly a run costs its components plus the work
      - assembly the finished goods average with what is already on the shelf
      - assembly a run the shelf cannot cover is refused, naming what is short
      - assembly a recipe that cannot be made is refused before it is kept
      - making goods a run moves the stock, costs the goods and keeps the books
      - making goods a run the shelf cannot cover changes nothing
      - making goods a recipe is kept, listed and changed
      - ten packs of masala are made from bulk spice

