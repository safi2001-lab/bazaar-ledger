  # ---------------------------------------------------------------------------
  # M19 — FBR Digital Invoicing
  # ---------------------------------------------------------------------------

  - id: M19-FBR-01
    milestone: M19
    title: A registered shop's bills are reported to FBR and printed with FBR's number
    status: done
    proof:
      - fbr invoice a registered sale is written as the gateway reads it
      - fbr invoice amounts go out as exact decimals, never through a float
      - fbr invoice what FBR would refuse is said before anything is sent
      - fbr invoice the gateway's answers are read for a number, a refusal or a retry
      - fbr client a bill is posted with the token and comes back numbered
      - fbr client a refusal is a refusal, and a gateway down is a retry
      - fbr client no connection is a retry, not a crash
      - fbr reporting a bill made while reporting is sent and comes back numbered
      - fbr reporting FBR out of reach leaves the bill waiting, to be sent later
      - fbr reporting a bill FBR would refuse is held back and says why
      - fbr reporting a shop that does not report sends nothing, and an unregistered one cannot
      - fbr receipt FBR's number is printed with a QR of it
      - fbr receipt a bill FBR has not answered yet says so, with no QR
      - a registered shop turns FBR on and a bill comes back numbered
  - id: M20-DRIVE-01
    milestone: M20
    title: The books go to the shop's own Google Drive once a day, and come back from it
    status: done
    proof:
      - drive backup store uploads, lists newest first, downloads and deletes
      - drive backup store with no sign-in, nothing is sent and it says so
      - drive backup store a refused token asks the shopkeeper to connect again
      - drive backup store no connection is a failure in words, not a crash
      - drive backup a backup is due after a day, and not before
      - drive backup the newest seven are kept
      - drive backup off until turned on, and a short passphrase is refused
      - drive backup once a day it goes to Drive, the newest seven stay, and one comes back
      - drive backup a failure is kept in words and tried again next time
      - drive backup turned off, nothing is sent
      - turning Drive backup on sends the first one straight away
      - a backup that is due goes when the app comes back to the front
      - a new phone brings the books back from Drive
  - id: M21-PLANS-01
    milestone: M21
    title: Paid features follow the plan bought through Google Play, checked on the phone
    status: done
    proof:
      - play signature openssl's signature of a purchase checks out
      - play signature a purchase edited after signing is refused
      - play signature a signature made with another key is refused
      - play signature anything malformed is false, never a crash
      - plans a phone with no purchase is on free, and its bills say what made them
      - plans every paid feature is refused on free, naming the plan that has it
      - plans a plan includes every plan below it
      - plans a purchase Play signed unlocks its plan; edited, it unlocks nothing
      - plans the plan is kept on the phone, checked again when the app opens, and lapses when Play stops confirming it
      - plans with no key in the build, nothing verifies: it never falls open
      - plans losing a plan locks nothing already made
      - plans staff need Gold, and Gold has five people
      - plans a plan can be picked by hand on a test build, never on a release
      - a free shop reaching for a paid feature meets the plans, and a test build can try one without paying
      - a plan bought through Play unlocks it, and only a signed purchase does
