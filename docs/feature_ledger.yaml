      - lib/features/khata/payment_sheet.dart
      - lib/features/khata/opening_balance_sheet.dart
      - lib/features/expenses/expense_entry_sheet.dart

  - id: M32
    title: A new customer or a new item is added from the bill, without leaving it
    # Opened and sealed 2 Oct 2026 at 1/1. Shopkeepers trying the app said
    # it plainly: in Vyapar a new product or person on a bill is simply
    # added. Here the cashier had to leave the bill. Now a name the customer
    # picker cannot find is offered as a new customer (a supplier, on a
    # delivery): a short sheet with the name filled in, a mobile kept as
    # 0300 4471203, which price they pay and a credit limit, and they are on
    # the bill at once, its lines moved to their prices. A search, a
    # scanned barcode (wedge or camera) or a scale label that finds nothing
    # is offered as a new item: name, or barcode, or the label's PLU as its
    # code, filled in; a price, the shop's usual unit (kilos off a scale),
    # and the cost and stock on hand; saved through the full editor's own
    # path, so opening stock reaches the stock ledger and the books at its
    # cost, and it goes on the bill (one, or what the label weighed). On a
    # delivery the cost asked is the buying price, there is no opening
    # stock, and the line's cost now follows its quantity until typed. A
    # name or mobile already in the khata, or an item already in the shop,
    # is shown to be used instead; a second one is made only on purpose.
    # Quotations and challans are made from the same counter, so they have
    # it too.
    #
    # Roles, decided: no role is barred from adding a customer or an item,
    # because none is today (Items and Customers are open to every role and
    # the catalogue writer checks no permission). What a role cannot see it
    # is not asked: a cashier (no seeCosts) gets no cost, so no opening
    # stock, and cannot put a new customer on wholesale or VIP prices. No
    # plan limits apply to parties or items. Not built: a permission of its
    # own for the catalogue (it would change who may use the full forms
    # too, which is the owner's call), giving a scanned barcode to an item
    # chosen as already existing, and landline numbers on the short form
    # (the full form takes them).
    state: sealed
    owns:
      - lib/features/parties/quick_party_sheet.dart
      - lib/features/items/quick_item_sheet.dart
      - lib/design/add_offer.dart

  - id: M33
    title: The reports hub, and every transaction and party report the market's apps have
    # Opened and sealed 2 Oct 2026 at 4/4. The Report tile opens a hub laid
    # out the way the shop apps this market knows lay theirs out: groups for
    # transactions, parties, items and stock, business status, taxes,
    # expenses, orders and loans, each shown once it has a report in it; a
    # search in the bar that finds a report by name; a star on every report
    # that puts it under Favourites at the top, kept on the phone beside the
    # language and theme, never in the books; the last few opened as chips;
    # and the plan's lock on the paid ones. The hub is a registry, one entry
    # per report with its group, name, hint, icon, plan and the filters it
    # takes, and a test fails until every report has exactly one.
    #
    # A report opens on the period it was last read for: today, yesterday,
    # this week, this month, last month, this quarter, this fiscal year
    # (1 July to 30 June), last fiscal year, or two dates picked. It is
    # narrowed by party, item, item category, party group, transaction
    # type, payment mode, payment status, who entered it, or only parties
    # with a balance, as each report declares; every filter is a WHERE in
    # the SQL with its value bound, never a filter over rows read into the
    # phone, and an export of a narrowed report says what it was narrowed
    # by. Headline tiles sit over the table with how each compares with the
    # period before; any column of a list sorts either way with the total
    # kept at the foot; a sale bill opens its receipt and a party opens its
    # statement; a long list draws two hundred rows at a time. It goes out
    # as a PDF, an Excel workbook (written here, a zip of six XML files, on
    # the archive package the app already carries), a CSV, or on the
    # counter's receipt printer through the receipt queue.
    #
    # New reports: the sale and purchase reports; all transactions, voids
    # listed and counted nowhere, a tender taken with its bill not listed
    # twice; bill-wise profit at the cost each bill recorded; cash flow by
    # what moved the money, drawer and bank apart; the party statement,
    # both sides of a party who buys and sells kept apart; party-wise
    # profit and loss; all parties with the khata's balance each way; a
    # party's items; sale and purchase by party and by party group. The day
    # book now shows each transaction's party, number, total and the money
    # in and out with it; the profit and loss lays its cost of sales out as
    # opening stock, purchases, purchase returns and closing stock, landing
    # on the books' cost of goods sold to the paisa. A role that may not see
    # costs is refused the reports about cost and gets Sales by item without
    # its cost columns. Each ties to the books in a test, and on a
    # development machine a year of twenty thousand bills reads the sale
    # report in about half a second and one customer's year in a few
    # milliseconds; the handset's number is still to be measured.
    #
    # Found on the way: the khata's own ledger leaves out goods a customer
    # brought back, so its running balance runs ahead of the khata by the
    # return; the party statement here reads a ledger that includes them
    # and lands on the khata's balance. The khata screen is not this
    # milestone's to change. A receipt's journal entry names no payment, so
    # the day book finds a receipt's party on its receivable line.
    #
    # Not built, and why: printing an A4 page straight to a printer (the
    # app has no print plugin and adding one is a native dependency; the
    # PDF goes to any viewer that prints), charts and a column chooser.
    # Item, stock, tax, expense, bank, discount, order and loan reports are
    # M34's and M35's, on this registry.
    state: sealed
    owns:
      - packages/pk_reports/lib/src/filters.dart
      - packages/pk_reports/lib/src/transaction_builders.dart
      - packages/pk_reports/lib/src/transaction_source.dart
      - packages/pk_reports/lib/src/party_builders.dart
      - packages/pk_reports/lib/src/party_source.dart
      - packages/pk_export/lib/src/xlsx.dart
      - packages/pk_export/lib/src/slip.dart
      - packages/pk_data/lib/src/read/reports/**
      - lib/features/reports/report_registry.dart
      - lib/features/reports/report_screen.dart
      - lib/features/reports/report_shelf.dart
      - lib/features/reports/report_filters_bar.dart
      - lib/features/reports/report_table_view.dart
      - lib/features/reports/report_export.dart

  - id: M48
    title: Loans the shop has taken, their repayments, and a statement for each
    # Opened 2 Oct and sealed 3 Oct 2026 at 1/1. Accounts has Loans, for the
    # owner and the accountant. A loan from a bank, a committee, a relative or a
    # supplier is written down with who lent it, how much, the cash or bank
    # it came into and the day; the rate, the months, the instalment and a
    # processing fee only if there are any. It becomes an account of the
    # chart, a liability under a Loans group numbered after the last
    # liability as the shop's own accounts are (M26), so the balance sheet
    # shows what is owed on it with nothing taught to read it. The fee is
    # taken out of what came in, in the same entry: the loan is owed in
    # full, the cash or bank is up by the amount less the fee, and the fee
    # is an expense; cancelling the loan cancels its fee. A repayment is
    # what was paid, from where, and how much of it was interest and
    # charges; the rest comes off the loan, and more off the loan than is
    # owed is refused in words. The instalment and the interest are filled
    # in from the terms, the interest as simple interest on what is owed
    # for the days since the loan was last paid, for the shopkeeper to
    # correct from the bank's slip. Loan Interest, Loan Processing Fee and
    # Loan Charges are indirect expenses made when first needed, so the
    # profit and loss carries them below gross profit as Vyapar does. Each
    # loan has a statement: what was owed when the period began, every
    # receipt and repayment with principal and interest apart and what was
    # owed after each, and what is owed at the end (the account's balance,
    # by construction), on screen and as a PDF or a CSV through the share
    # sheet. A loan or a repayment entered wrong is cancelled from its line
    # with a reason, by the opposite entry dated that day; a loan with
    # repayments standing against it is not.
    #
    # Nothing new in the schema. The terms the chart cannot hold sit in one
    # settings row per loan (loan.<account id>, JSON), written once and
    # read only to suggest interest. Every line of a loan's entries carries
    # loan:<account id> in journal_lines.cost_centre, which nothing used
    # before, so a month of interest only (it never touches the loan's own
    # account) still lands on the statement. Taking a new loan is part of
    # the paid accounting set (PlanFeature.accountingReports); paying one
    # back and reading its statement are not, because a shop whose plan
    # lapsed still owes the bank. For the reports pack's Loan Statement:
    # buildLoanStatement (pk_domain) over loanPostingsSql (pk_data), and
    # loanStatementTable (pk_bootstrap), which pk_reports can take over.
    #
    # Not built: editing a loan's terms after it is taken (the rate only
    # suggests, and the interest is typed on every repayment), a fee paid
    # from an account other than the one the loan came into (an expense of
    # its own), loans the shop has given (a receivable, not this), and a
    # reminder when an instalment falls due.
    state: sealed
    owns:
      - lib/features/loans/**
      - packages/pk_domain/lib/src/accounting/loans.dart
      - packages/pk_data/lib/src/read/drift_loan_reads.dart
      - packages/pk_data/lib/src/write/drift_loan_writer.dart
      - packages/pk_bootstrap/lib/src/loan_services.dart

  - id: M37
    title: The last price this customer paid is on the counter, and a loose sale needs no item
    # Opened and sealed 2 Oct 2026 at 1/1. A wholesaler's customer says
    # "same as last time", and the counter could not say what last time
    # was. Now, once a customer is named (from the counter's own button,
    # before any goods, or at the payment sheet as before), every line on
    # their bill shows what they paid for it last time and when; tapped,
    # the line lists their last five deals for that item, newest first,
    # with the bill number, how many, the price and what came off it, and
    # one tap makes that price the line's, carried exactly into the unit
    # the line is in (five thousand a bori is a hundred a kilo) or refused
    # in words when it does not convert. It is shown, never applied: a
    # wholesale customer is charged wholesale until the cashier picks an
    # old price. Bills cancelled, free lines and other customers' prices
    # are left out. On a delivery, the supplier's last five prices for the
    # item sit under it, a tap from the cost. What the goods last came in
    # at is shown at the counter to whoever may see costs and to nobody
    # else: the read is refused for a cashier before it is made. The read
    # goes through the party's own index, named with INDEXED BY so the
    # planner cannot wander onto the item index and read every line of a
    # best seller; no index was added and the schema stays at v8.
    #
    # "Khula maal": a line sold by what the cashier calls it and what it
    # comes to, with no item made, from the counter's bar or from a search
    # that found nothing. The schema always allowed a line with no item;
    # this is the first thing to write one. Its money is Sales; it moves
    # no stock and carries no cost, so profit counts all of it, which the
    # sheet says to whoever reads the margins, and item_id IS NULL is how a
    # report tells it from a line that really cost nothing. It prints, it
    # survives the app being killed (the cart draft is v4 for it; v2 and v3
    # are still read), it is named in the activity log, and it comes back
    # on a return as money only, known by its name, price and unit, and
    # never more of it than was sold. The same thing at the same price
    # rung twice is one line of two.
    #
    # Decided: a shop reporting to FBR cannot sell one. FBR wants every
    # line's HS code, and a default code stamped on loose goods would tell
    # FBR that onions and a bicycle repair are the same goods at the same
    # rate, with the shop's NTN on it. The counter says why instead of
    # offering the form, the payment sheet says it for a bill half-rung
    # before reporting began, and the sale path refuses it again. Not on a
    # quotation or a challan either: a quotation is billed item by item and
    # a challan sends goods somebody counts; a bill from a challan with a
    # loose line on it is refused as having something the challan did not
    # send. A loose line takes no standing discount (its price was just
    # typed); a typed discount on it meets the role's ceiling like any.
    #
    # Found on the way and fixed: the line editor wrote a customer's
    # standing discount back as the rupees it came to at the old price, so
    # a lower old price picked from the list kept the old rupees — more
    # than the standing percentage of the new price — and a cashier's own
    # ceiling refused the bill. Only a discount the cashier touched is now
    # written back. Found on the way, not changed (each is another
    # milestone's ground):
    # a return gives back the full price of what comes back, line discount
    # and all, and reads a line sold in another unit as priced per base
    # unit; the item sales report joins items, so loose lines are in the
    # profit and loss but not in it. Not built: a permission of its own for
    # loose lines (a cashier can ring one, as he can type any price today;
    # the owner's call), and loose lines on quotations and challans.
    state: sealed
    owns:
      - lib/features/pos/loose_line_sheet.dart
      - lib/features/pos/past_deals.dart
      - packages/pk_domain/lib/src/sales/past_deal.dart

  - id: M40
    title: Customers in groups by area, route or kind, and a note about each that the counter sees
    # Opened and sealed 3 Oct 2026 at 1/1. A wholesaler keeps his khata by
    # route, and the schema had kept a `parties.party_group` column since v1
    # that nothing wrote and nothing read. Now a customer or supplier is
    # filed in a group from their details or from the short form on the
    # bill: typed, or picked from the groups the shop already uses, shown as
    # chips under the field. "route 3" typed in a hurry joins "Route 3"
    # rather than starting a second route. The Customers list narrows to a
    # group (or to nobody's) with the group's members, what they owe and
    # what the shop owes them at the top, summed in SQL over every member
    # and never over the rows loaded; it sorts by name, by who owes most and
    # by who has owed longest; and several names are ticked and filed at
    # once. A Groups page lists each group with its totals and members; a
    # group is renamed (every member moves, hidden ones too) or merged into
    # another, the screen saying before Save when a new name is another
    # group's. A rename is one transaction with every member its own update
    # in the outbox, so the counters on the shop's Wi-Fi receive each move
    # and a rename that fails half-way moves nobody. The picker at the
    # counter narrows by group and labels each name with theirs; a new
    # customer met while it is narrowed is filed on that group. The list no
    # longer stops silently at forty names: it reads 300 and says so.
    #
    # The note for the counter ("Sirf cash — cheque bounce ho chuka",
    # "Delivery after 5pm") is written on the party's details and shown,
    # read-only, under their name on the payment sheet the moment they are
    # chosen. Parties have no column for it and the schema stays at v8, so
    # it is a settings row keyed `party.remarks.<party id>` whose id is
    # derived from the party's: two counters writing a first note for one
    # customer while apart write the same row and the LAN merge keeps the
    # later, where two fresh ids would have collided on the key.
    #
    # For the reports: partyGroups, partyList and partyGroupTotals (sale,
    # returns, purchase, receivable and payable by group for a period, with
    # one row for the ungrouped, adding up to the shop's own totals).
    # Balances are as they stand today, as every other balance read is.
    #
    # Not built, and why: a table of groups of their own (a group is a name
    # on its members and exists while somebody is in it; no schema change);
    # a "new empty group" button for the same reason; a permission for
    # renaming groups (no role is barred from editing parties today, which
    # is the owner's call); the note on the khata screen, which is another
    # milestone's file; balances as of a past date by group.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/ports/party_groups.dart
      - lib/features/parties/party_groups.dart
      - lib/features/parties/party_groups_screen.dart

  - id: M52
    title: A shop leaving Vyapar or Khatabook brings its items, customers and balances in one go
    # Opened and sealed 3 Oct 2026 at 1/1. Vyapar's licences have not been
    # renewable in Pakistan since about May 2025, and Khatabook wants an
    # Indian number's OTP, so both apps' Pakistani shops are stranded with
    # their lists in a file. The import screen now asks where the file came
    # from (this app's own list, Vyapar's items, Vyapar's parties, Khatabook,
    # or anything else), with a few steps for getting it out of each, and
    # recognises an app's file from its headings whatever was chosen.
    # Balances come in on the side they are owed. Receivable, To Receive,
    # You will get and Dr are udhaar the customer owes; Payable, To Pay, You
    # will give and Cr are the shop's: an advance on a customer's khata, or
    # for a supplier said and left for a purchase bill, as M14 left it. Who
    # a party the shop owes is, when the row does not say, is the shop's to
    # choose on the preview (suppliers for Vyapar, customers for Khatabook).
    # No Indian GST rate or HSN code is carried: every item takes the tax an
    # item added by hand takes, and the preview names the rates it saw. A ₹
    # sign is read as the rupees the shop kept. Before anything is written
    # the preview names the rows left out and why, the rows that come in
    # with something left out (an oversold shelf, a supplier's balance, a
    # barcode Excel saved as 8.96E+12), units the shop has no unit for, and
    # whatever the shop already has by barcode, code, mobile or name, which
    # is left alone or brought up to date by choice and never doubled. Any
    # field can be pointed at another column by hand. Old binary .xls
    # workbooks are read by a compound-file and BIFF8 reader of our own, with
    # no dependency, and so are the HTML tables and Excel 2003 XML that web
    # apps save as .xls. A file over 256 KB or 2,000 rows is read and checked
    # on an isolate while the screen says it is reading.
    #
    # Found on the way: a row's problem was an English sentence, shown as it
    # was to a shop reading Roman Urdu; M14 read a column headed HSN into
    # the HS code FBR invoices carry, so an Indian tariff code would have
    # reached FBR; a row Excel leaves out of an .xlsx moved every row number
    # after it on the preview; and a unit the shop did not have became
    # pieces without a word.
    #
    # What was verified, and what was not. Vyapar's menus are from its own
    # pages on vyaparapp.in: Utilities, then Export Items, Import Items and
    # Import Parties; Reports, Party Reports, All Parties, exported to Excel.
    # Its column headings are on no public page, so the presets use its
    # import template's headings as commonly reproduced, compared without
    # case, spaces, brackets or the asterisk, with the choice by hand as the
    # backstop. Khatabook's help documents only PDF reports from the phone
    # app; "You will get" and "You will give" are its own words, its
    # export's columns are not verified. The .xls fixtures were written by
    # Excel itself and by xlwt, not by this reader's own code.
    #
    # Not built: a supplier's opening balance (the books keep what the shop
    # owes as purchase bills and the khata reads it from them, so posting
    # one needs a document of its own, which is data-layer work); Vyapar's
    # second unit for an item (the catalogue writer has no per-item
    # conversion, so the preview says the item comes in by its first unit);
    # Khatabook's PDF and Vyapar's .vyb backup; Excel 95 workbooks and ones
    # with a password, which are refused in words.
    state: sealed
    owns:
      - packages/pk_import/lib/src/sources.dart
      - packages/pk_import/lib/src/xls.dart

  - id: M34
    title: Every item and stock report Vyapar has, and the two it does not
    # Opened and sealed 3 Oct 2026 at 5/5. The Items and stock group of the
    # hub now holds Vyapar's list in Vyapar's order: the stock summary (sale
    # price, cost, stock with less than nothing in red, value), narrowed by
    # category, by place (the shop floor, a godown, a van) and to what is in
    # stock, and read for any day gone by; the item report by party; item-
    # and category-wise profit and loss; the low stock summary with who last
    # supplied each item and how much to order; the item detail, one item
    # day by day; the stock detail, every item's opening, purchases,
    # returns, moves, production, sales, use, wastage and adjustments to its
    # closing; sale and purchase, and stock, by item category; the batch
    # report; the serial and IMEI report, searched by number; the item-wise
    # discount; the stock transfer report; and the production register.
    # Then the two Marg and Tally have and Vyapar does not: fast, slow and
    # dead stock, banded by how many bills an item was on over the last
    # ninety days (the shop sets the bands), with when it last sold and the
    # money tied up in each band; and stock ageing, the shelf's value by
    # how long ago it came in, 0-45, 46-90, 91-180 and over 180 days, first
    # in, first out: what is on the shelf is matched to the latest
    # receipts, newest first, and what the records do not reach is the
    # oldest. A row that is an item opens its stock history.
    #
    # Every quantity is a sum of the stock ledger and every value at cost a
    # sum of the value each movement put through Inventory, so the stock
    # detail's closing value is Inventory in the books to the paisa on any
    # day, and the stock summary's on any day it is read for; a test says
    # so. Item-wise profit is the bill-wise profit; the item-wise discount
    # is the Discount Given account, a line's own discount and its share of
    # the bill's as the bill split it; every category total is its items'.
    # Cost columns and cost tiles never reach a role that may not see costs
    # (a headline figure can now be marked as cost, as a column could), and
    # item and category profit and stock ageing are refused it outright.
    # Batches, serials, transfers and production ride the tracking, godowns
    # and manufacturing features the plans already sell; profit rides the
    # books. On a development machine the stock detail of twenty thousand
    # items and a year of 120,000 movements reads in about two seconds, and
    # one item's year in a few milliseconds; the handset's number is still
    # to be measured.
    #
    # Decided: Stock value stays beside the stock summary rather than being
    # folded into it. It is the owner's check of the shelf at today's
    # average cost against the books, closed to the counter; the summary is
    # the shop's list, open to the counter without its costs. Khula maal
    # (M37), lines with no item, are one row in the reports that sum sales,
    # with no cost of their own and under No category, so their totals stay
    # the sale report's. A cancelled bill's goods going out and coming back
    # are adjustments, so Sold is what bills that stand sold. Low stock is
    # the counter's own alert query (M1), so the two cannot disagree; what
    # to order is the average day's selling over thirty days times fifteen,
    # less the shelf, never less than what brings it back to its floor, in
    # whole units rounded up, and both numbers are the shop's to change.
    #
    # Found on the way: a batch's recorded cost is the item's average when
    # it arrived, not that delivery's rate, so batches valued at it did not
    # add up to the item; they are valued off their own ledger rows. The
    # Sales by item report of M8 joins items, so khula maal is missing from
    # it; it is M8's to change.
    #
    # Not built, and why: Vyapar's per-item trading account (opening and
    # closing stock and tax per item) where the brief asked for sales
    # against the cost the bills recorded; turning the reorder list into a
    # purchase order (a milestone of its own); ageing by expiry date and an
    # ABC class; a place filter on ageing and on fast and slow stock, which
    # count the whole shop; discount by cashier and by party, which is the
    # business status group's; a "show quiet days" switch on the item
    # detail, which shows only the days an item moved; charts.
    state: sealed
    owns:
      - packages/pk_reports/lib/src/item_stock_source.dart
      - packages/pk_reports/lib/src/item_stock_builders.dart
      - packages/pk_reports/lib/src/item_stock_reports.dart
      - packages/pk_data/lib/src/read/reports/item_stock_queries.dart
      - lib/features/reports/stock_filters.dart

  - id: M51
    title: A bill that looks like the shop's own, in the sheet it is, with the khata as it stood and the shop's own QR
    # Opened and sealed 3 Oct 2026 at 1/1. A wholesaler sends goods up-country
    # through a transport adda with a carbon book of three sheets and a
    # fourth for the driver; Vyapar and myBillBook print Original, Duplicate
    # and Triplicate, a transporter's copy with no prices, the customer's
    # previous balance, and the shop's own logo, colour and payment QR. Now,
    # from the bill or from its row, the sheet is chosen: the original (only
    # until it has been printed — a second original is the sheet a buyer
    # claims input tax on twice), a duplicate or a triplicate, each printed
    # as a copy of its own, or the transporter's copy, which carries the
    # goods, quantities, the buyer, the address, the truck and the bilty and
    # not one figure that is money, on 58 and 80 mm and in every PDF layout,
    # and goes on WhatsApp with the bilty and no amount beside it. The bilty,
    # truck, transporter and destination are written onto the bill's own
    # non-fiscal fields, audited, from a line under the chooser. Left alone,
    # a bill prints and is sent exactly as before, and asking twice still
    # prints once.
    #
    # Settings -> Bill design: four PDF layouts (classic, a coloured band,
    # compact for long wholesale bills, and a sales tax invoice carrying
    # every s.23 particular — both parties' names, addresses, NTN and STRN,
    # and per line the value before tax, the rate, the tax and the value
    # with it), six colours that read white-on and print as grey, A5 or A4,
    # the shop's logo, and a footer of up to four lines in Urdu, Roman Urdu
    # or English with one-tap presets, shown on a sketch of the page, on the
    # till slip exactly as the printer will get it, and as a real sample PDF.
    # A credit customer's bill carries "pichhla baqaya / is bill / kul
    # baqaya" (on by default, off in one switch). The shop's own Raast,
    # JazzCash or Easypaisa QR picture, added where Payment details always
    # said to add it, goes on the foot of the PDF and, if the owner asks, on
    # the till roll as dots; with none, nothing is drawn. No QR is made
    # anywhere, and a test reads the renderers to prove it.
    #
    # Decided: the khata block on any copy, printed any day, is the khata as
    # it stood when the bill was made, read from the journal in the order
    # things were recorded — the figures the first sheet carried — and a
    # later sheet says so on the paper. What is owed today is the khata's
    # answer. Kept in the firm's settings row and two attachments of kinds
    # the schema already had, so it travels with backups and sync; no schema
    # change.
    #
    # Found on the way: the Payment details screen told shops to add their
    # bank's QR and had nowhere to add it; a logo with a clear background
    # would have stored black through the item shrinker's JPEG; the
    # printer's receipt bytes were cached per bill and would have printed a
    # changed footer only after a restart; the counter never snapshots a
    # buyer's address or tax numbers, so a tax invoice falls back to the
    # party's own record where the bill holds none.
    #
    # Not built, and why: a logo on the till roll (a photographed logo
    # thresholded to one bit is a smudge); a live picture of the PDF itself
    # (it needs a native PDF renderer this build does not carry, so the
    # sketch is drawn in Flutter and the real page is one tap away); copy
    # marks on a challan opened from its own list, which has no chooser
    # there yet; a share record per copy, so only printing moves the
    # original to duplicate.
    state: sealed
    owns:
      - packages/pk_platform/lib/src/receipt/bill_pdf.dart
      - packages/pk_platform/lib/src/receipt/bill_pictures.dart
      - packages/pk_bootstrap/lib/src/bill_design_services.dart
      - lib/features/printing/bill_copy.dart
      - lib/features/printing/bill_design_preview.dart
      - lib/features/settings/bill_design_screen.dart
      - lib/features/settings/shop_pictures.dart

  - id: M56
    title: Found however it is spelt, weighed the way the bazaar weighs, and readable at any size
    # Opened and sealed 3 Oct 2026 at 1/1. Nobody in a Pakistani shop spells
    # an item the same way twice, and the search only matched letters for
    # letters. Every item's and party's name is now kept with a spelling key
    # and that key's consonants, so the counter, the item list and the khata
    # find aata, atta and آٹا alike, cheeni and chini, zeera and jeera, doodh
    # and dudh, t.v. and tv, 7 up and 7up, Rehman and Rahman; a word typed in
    # Urdu script finds the Roman name, and a name kept in Urdu is found by
    # its Roman spelling. What was typed comes first: the whole name, then
    # its start, then a word's start, then what only sounds like it. Kept
    # apart on purpose, because the shop sells both: chini and chana, tel
    # and til, dal and dil. Schema v9 changes no table; it re-keys every
    # name, and a row merged from another counter is keyed on arrival
    # whatever key it carried. A ranked search reads the whole catalogue,
    # so a search that finds something now costs what one that finds
    # nothing did: 20-45ms on twenty thousand items, measured.
    #
    # Units, checked: a mann is 40 kg and a sale in mann moves kilos and
    # money exactly (proved at Rs 4,833.33 a mann, rounded once). The books'
    # seer is 80 tola, 933.10 g, and belongs to the 37.324 kg maund Pakistan
    # left in 1967; forty seer to the bazaar's 40 kg mann is a kilo, so the
    # seer stays the kilo. No pao ships: retail sells 250 g in most places
    # and 200 g in some. Carton, dabba, packet, strip and tablet ship as
    # counts, and a shop set up before is given them on the phone that keeps
    # the books. Kilos with grams read "1 kg 500 g" on the bill being rung
    # up and in the stock lists; the printed bill keeps "1.5 kg x rate". Text
    # size (Normal, Large, Larger) is in Settings, on top of the phone's own
    # and held with it at 200%, and kept on the phone; paper and PDFs are
    # not touched by it.
    #
    # Not built: a pack's size per item (1 carton = 24 pcs). The per-item
    # conversion's unique index keeps tombstoned rows, so a pack taken off
    # an item could never be put back without a schema change, and packs
    # with two-unit quantities are M45's. The receipt preview on screen
    # follows the text size; it lives in sales/, which was being edited
    # elsewhere, and scrolls sideways when large.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/catalogue/spelling.dart
      - packages/pk_domain/lib/src/catalogue/quantity_words.dart
      - packages/pk_data/lib/src/read/spelling_search.dart
      - packages/pk_data/lib/src/write/unit_top_up.dart
      - lib/design/text_size.dart

  - id: M57
    title: A return gives back exactly what was charged, in the unit it was sold in
    # Opened and sealed 3 Oct 2026 at 1/1. Two bugs M37 found in taking
    # goods back, both reproduced first against a real database. A return
    # multiplied the line's rate by the quantity coming back, which was
    # wrong twice. A line sold with something off came back at its list
    # price: ten soaps at Rs 100 less 10% were paid Rs 900 for and the
    # return gave back Rs 1,000, a soap Rs 100 not Rs 90, a line's share of
    # a bill discount was never given back off, and Discount Given kept the
    # riayat on goods no longer sold. And the rate is per the unit the line
    # was sold in while the quantity was the shelf's: a maund of atta (forty
    # kilos) was offered back as "40 maund", plus took back one kilo for
    # Rs 5,000, and taking all of it gave Rs 2,00,000 for a Rs 4,500 sale;
    # half a maund put half a kilo back on the shelf. Three part returns of
    # a Rs 299.99 line gave back Rs 300.00 between them.
    #
    # Now a return takes a share of what the bill STORED for the line: its
    # total after its discount and its part of the bill's, its taxes, its
    # discount and its cost, in proportion to the base quantity coming
    # back. Each share is the difference of two cumulative figures, what has
    # come back so far rounded once the way the bill rounded, so a line
    # returned whole gives back exactly what it was charged, part returns
    # never add up to more, and the last takes what is left to the paisa
    # (a property test runs two thousand taxed and discounted bills in four
    # units through random part returns). The value of the goods is the
    # refund less its taxes, so the entry always balances. The quantity is
    # shown, typed and recorded in the unit sold, converted to the shelf's
    # by the bill's own ratio (the maund it was on the day, as the cost is
    # the cost on the day), exactly or refused in words; all that is left
    # always converts to all that is left. The limit across visits holds in
    # either unit, and a return off one line of a bill no longer counts off
    # another line of the same item in another unit or at another price.
    # The entry mirrors the sale: Sales Returns is debited gross and the
    # discount comes back off Discount Given, the taxes off Output and
    # Further Tax at the rate they were charged at. Cost of goods still
    # comes back at what it left at. A loose line still comes back as money.
    # The return prints as a Sale Return in the unit sold, with its
    # discount; a credit note to FBR now carries the quantity in the unit
    # sold, the discount, the 18% (it said 0%) and what came back, and the
    # HS code as billed.
    #
    # Sent back to a supplier: a delivery's lines carry no discount, so the
    # money was right, but quantities were counted in kilos under the
    # maund's name in the same way; now in the unit billed, credited by the
    # same cumulative share. Not changed, and why: a return off a bill
    # rounded to the rupee leaves the round-off with the bill (it was the
    # bill's, not a line's); a line's discount and its share of the bill's
    # come back together, as the bill stored them per line; and two lines
    # alike in item, unit and price are still counted together, which can
    # only offer less back, never more. No schema change; the schema stays
    # at v8.
    state: sealed
    owns: []

  - id: M47
    title: The shop's money and the home's money kept apart, other income in the books, and the monthly bills remembered
    # Opened and sealed 3 Oct 2026 at 1/1. A shopkeeper pays the shop's
    # bijli and his children's school fees from the same drawer and writes
    # both in the same book. The expense screen now asks first whose it was,
    # Dukaan ka kharcha or Ghar ka kharcha. The home's is the owner's
    # drawings: the drawer goes down, Owner's Drawings (3200, equity) goes up,
    # and the profit and loss never sees it, so the month's profit is what
    # the shop made and the balance sheet shows the owner's share smaller by
    # what he took. It is paid now, never left owed to a supplier, and it
    # sits in the same expense list with a Ghar mark and the month's shop
    # and home totals side by side above it. Goods taken home off the shelf
    # ("ghar le gaye") leave at their average cost on an expense document of
    # the home's, Dr Drawings and Cr Inventory, with the stock row tied to
    # the same document, so M31's cancel puts the goods and the cost back in
    # one act. The stock adjustment was not used for it: it posts every
    # movement against Stock Wastage and ties its row to no document, so it
    # could neither post to drawings nor be cancelled cleanly.
    #
    # Who: the owner and the accountant, who hold the journal permission and
    # could already post exactly this by hand as a voucher. A manager keeps
    # the shop's expense book as before and is neither offered the home's
    # side nor allowed it below the screen: the expense writer, the
    # correction path (edit into, cancel of) and the monthly bills all
    # refuse. A cashier keeps no expense book at all.
    #
    # Other income: rent from a sub-let, commission, bank profit, scrap,
    # a refund. Dr Cash or Bank, Cr Other Income (4900), which the profit and
    # loss already files under Other income below gross profit; the head is
    # the line's `income:<key>` tag, not an account, because the profit and
    # loss puts every income account but 4900 under Sales. It is an
    # `other_income` document with NO party — the line between it and M25's
    # charges, which carry the party whose khata owes them. Every khata
    # query reads `other_income` by party, so shop income never reaches one;
    # who paid it is a name on the document's snapshot, nothing more. Its
    # number is the INC series the charges share. Cancel and edit are M31's
    # path extended to it (the void builder's mirror through the same void
    # handle, an edit as one transaction tied in the activity log); a charge
    # handed to it is refused and pointed at its khata, and M31's charge
    # cancel is untouched.
    #
    # Heads: a spending head is an account (the P&L split reads is_direct),
    # added after the last expense account by M26's rule under Direct or
    # Indirect Expenses, renamed, filed as direct or indirect, or hidden from
    # the expense screen (a settings note, not is_active, which would take
    # its history off the chart). Income heads are names kept in settings.
    # Monthly bills: one settings row each (expense.recurring.<id>, JSON);
    # on or after its day an unpaid bill is a card on the Expenses screen
    # with Pay now, which opens the expense filled in and tagged
    # `expense:recurring:<id>` on its lines. Paid means a standing expense
    # with that tag this month; one cancelled is due again. Nothing is ever
    # posted by itself. `journal_lines.cost_centre` prefixes now in use:
    # loan:<account id> (M48), expense:recurring:<id> and income:<head key>
    # (M47), listed in shop_money/tags.dart. No schema change.
    #
    # For the reports pack (pk_reports was not this milestone's to edit):
    # the Day Book labels source `other_income` "Charge" and All
    # Transactions labels the doc type "Charge", so the shop's income reads
    # as a charge there; a document with no party is the shop's income. An
    # expense report read from `documents` must leave out, or show apart,
    # the home's (debit line on owner_drawings). Goods taken home show in
    # the trading account's "Stock in or out otherwise".
    #
    # Not built, and why: a line on the Home screen (another milestone is
    # adding a due card there now, and the Expenses screen carries the
    # reminders); heads for the home's spending (the note says what it was);
    # goods kept by batch or serial taken home (a stock adjustment asks
    # which); editing goods taken home (cancel and enter again); income
    # heads as accounts of their own (the profit and loss would file them
    # under Sales until it reads 4900's children).
    state: sealed
    owns:
      - lib/features/income/**
      - lib/features/expenses/shop_money_providers.dart
      - lib/features/expenses/home_goods_screen.dart
      - lib/features/expenses/monthly_bills_screen.dart
      - lib/features/expenses/heads_screen.dart
      - packages/pk_domain/lib/src/shop_money/**
      - packages/pk_domain/lib/src/ports/other_income_writer.dart
      - packages/pk_application/lib/src/other_income_use_case.dart
      - packages/pk_data/lib/src/read/drift_shop_money_reads.dart
      - packages/pk_data/lib/src/write/drift_shop_money_writer.dart
      - packages/pk_bootstrap/lib/src/shop_money_services.dart

  - id: M35
    title: Bank, discount, tax, expense, staff and order reports, and the night's Z report
    # Opened and sealed 3 Oct 2026 at 5/5. Twenty-two reports on the M33
    # registry, each a builder in pk_reports over its own source interface
    # (business, staff, tax, expense, order) and a mixin of SQL in pk_data,
    # every filter a bound WHERE, every total the builder's.
    #
    # Business status: the bank statement, per cash-equivalent account in
    # the chart (Bank Accounts and Mobile Wallets as the first run sets them
    # up; JazzCash and EasyPaisa share one unless the shop splits them),
    # opening, every deposit and withdrawal with its party and the balance
    # after it, closing on the account in the books; narrowed to one
    # account, the drawer included, by a new filter. Discount given and
    # taken per party, and discount by cashier, the highest share first.
    # How customers pay: of the period's bills that went on udhaar, the
    # settled ones and their average days from bill to the payment or
    # return that cleared it, the ones paid late against the khata's credit
    # days (30 where it sets none), and the ones overdue today; and the
    # defaulter list, as of today.
    #
    # Staff and time, which the market's apps do not have: sales by cashier
    # and by counter (the M13 letter), with discounts, returns and voids;
    # the payment-mode summary, each tender of a split bill its own line, so
    # the sales paid by each mode and the udhaar add up to the sales, and
    # the money collected is the cash flow's money in; hourly sales on
    # Pakistan time from each bill's own instant, a bill at half past one at
    # night in the 01:00 hour of the next business day; and changed and
    # cancelled bills from the audit log, with who, when, why and the bill's
    # own total. The night's Z report: sales and returns, discount, items
    # sold, money in by mode, udhaar given and recovered, expenses, gross
    # profit only to a role that sees costs, and the drawer as counted at
    # the day close; two columns wide, so it prints a line at a time on a
    # 58mm roll through the M33 receipt path, and one tap from the day close.
    #
    # Taxes, behind the accounting plan: output against input tax per party
    # with NTN and STRN, landing on the Sales tax report's total; tax by
    # rate and regime (18%, reduced, Third Schedule, zero, exempt, none,
    # 4% further), a return on the footing of the sale it returns; sales by
    # HS code; and the Annex-C and Annex-A registers in the columns of FBR's
    # own IRIS templates (DSI v1.0.44, DPI v1.0.29, downloaded 3 Oct 2026
    # and checked against their validation code), hidden columns kept blank
    # so the rows paste into the template at B7, written as Excel or CSV for
    # the accountant to validate there and import on IRIS. Nothing is sent.
    # Expenses: every voucher, by head direct and indirect, and by what it
    # was for (the books keep no expense items, so the item is the voucher's
    # line within its head, capitals, spacing and a full stop ignored).
    # Orders: open quotations with their age and expiry, challans not yet
    # billed (M25 links), and the items on both.
    #
    # Found on the way: a return values the goods at the bill line's list
    # rate and ignores its discount, so a tin sold at 10% off comes back at
    # full price (and its tax is pro-rated from the discounted line); the
    # corrections code is not this milestone's to change. Purchase lines
    # keep their value in line_total_paisa only, and purchases carry no
    # input tax yet, so Annex-A and the tax report show the value paid and
    # no input tax, and say so.
    #
    # Not built, and why: the loan statement (M48), item and stock reports
    # (M34), ageing by due date and bad debts (another milestone's queries),
    # expected collections this week (it needs due dates per bill), and an
    # Annex file IRIS imports directly (IRIS imports its own macro template;
    # the register is pasted into it).
    state: sealed
    owns:
      - packages/pk_reports/lib/src/business_builders.dart
      - packages/pk_reports/lib/src/business_reports.dart
