  - id: M2-SCAN-01
    milestone: M2
    title: A hardware scanner puts the right item on the bill
    status: done
    # A wedge scanner is a keyboard that types fast and presses Enter, so the
    # search field stays focused and Enter arrives as a submit. Built in M1 and
    # never tested until now.
    #
    # The ambiguity case is the one that matters and the one the first draft of
    # these tests missed: it checked an UNKNOWN code, which matches nothing by
    # barcode and nothing by name, so a scanner that fell back to "the first
    # search result" passed it. Two items sharing a word is where that
    # fallback actually fires and silently bills the wrong thing.
    proof:
      - a scanned barcode puts that exact item on the bill
      - scanning the same packet twice makes it two
      - an unknown code leaves the bill exactly as it was
      - an AMBIGUOUS term adds nothing, rather than guessing

  - id: M2-SCAN-02
    milestone: M2
    title: The phone camera reads a barcode
    status: done
    # Most shops in this bracket do not own a USB gun -- it is four thousand
    # rupees on top of a printer -- and the phone is already in hand.
    #
    # The camera and the gun end in the SAME lookup on purpose. Two paths would
    # be two places for the UPC-A widening below to be got right and one place
    # for it to be forgotten.
    #
    # ML Kit BUNDLED, not downloaded. The unbundled variant is ~3 MB smaller
    # and fetches its model through Play Services on first use -- and Google's
    # own documentation says requests made before that download completes
    # "produce no results", silently. First use is a shopkeeper at a counter
    # with a customer waiting, in a country that lost 9,735 hours of internet
    # in 2024. A test asserts the flag that would undo this stays unset.
    #
    # It builds under AGP 9 only because android/gradle.properties still
    # carries `android.builtInKotlin=false`: mobile_scanner still applies the
    # Kotlin Gradle Plugin and the build says so out loud. Written down in the
    # pubspec, because when it stops building the cause will not be obvious.
    #
    # What this cost, honestly: ML Kit brings Google's Firelog transport, which
    # sends diagnostics -- device model, package name, version, latency, error
    # codes, a per-installation id. Never a camera frame, never a barcode,
    # never a line of anybody's ledger. There is no documented opt-out for
    # standalone ML Kit. docs/what_leaves_the_phone.md is the full account and
    # the Data Safety answers it obliges.
    proof:
      - the counter offers the camera when nothing is typed
      - and gives the slot back to clear once something is typed
      - a scanned code reaches the bill through the wedge path
      - the item editor can read a barcode instead of typing it
      - the camera costs one ordinary runtime permission, and no more
      - ML Kit is bundled, not downloaded on first use

  - id: M2-SCAN-03
    milestone: M2
    title: One packet is found however its barcode was read
    status: done
    # A latent defect the camera would have made routine.
    #
    # A UPC-A packet reaches a hardware wedge as twelve digits and a phone
    # camera as thirteen, because ML Kit reports UPC-A as the EAN-13 it
    # formally is. `itemByBarcode` was an exact match, so the same tin would be
    # found by the gun and not by the phone.
    #
    # Nothing about that failure suggests a normalisation problem. It looks
    # like the item is missing -- so the cashier adds it again by hand, and the
    # catalogue ends up carrying one packet twice, at two prices, with the
    # stock split between them and neither figure right.
    #
    # Widened at LOOKUP, never at storage: normalising on the way in would
    # rewrite what a shopkeeper can read printed on the packet. And what was
    # actually scanned always outranks anything inferred from it, because a
    # shop really can carry both forms as separate items.
    proof:
      - a twelve-digit UPC also matches the EAN-13 a camera reports
      - a thirteen-digit EAN beginning with zero also matches its UPC
      - what was actually scanned always comes first
      - an EAN-13 that does not begin with zero is left alone
      - an EAN-8 is left alone
      - a shop code is never given a leading zero
      - leading zeros are not stripped in general
      - surrounding space is trimmed, because a wedge sends it
      - nothing scanned is nothing to look up
      - the variants never repeat
      - a packet entered as UPC is found when a camera reads EAN-13
      - a packet entered as EAN-13 is found when a wedge reads UPC
      - the exact code wins when both forms exist as separate items
      - a Pakistani EAN-13 is matched exactly, never widened
      - a shop code is matched exactly
      - a code nobody has is not found, and is not an error
      - nothing scanned finds nothing
      - an archived packet does not come back onto a bill
      - another shop barcode is not this shop item

  - id: M2-LABEL-01
    milestone: M2
    title: Shelf labels print at the declared width
    status: done
    # The half of a barcode workflow that competitors put behind a higher
    # tier, and the half that makes the other half work: a shopkeeper who has
    # entered manufacturer barcodes for three thousand packets still cannot
    # scan the loose rice or the repacked masala, because nothing printed a
    # code for those.
    #
    # The first renderer produced a completely convincing symbol that no
    # scanner could read. The `barcode` package stretches to whatever width it
    # is handed, so 576 dots over 79 modules made each module 7.29 dots, and
    # rounding every bar independently left some 7 wide and some 8. A scanner
    # measures bars in modules. It also had no quiet zones.
    #
    # Bars now land on module boundaries by construction, with ten modules of
    # white either side. Three of the proofs below fail if that is undone.
    proof:
      - the symbol itself bars quantise to a whole module, or no scanner can read them
      - the symbol itself the symbol has quiet zones at both ends
      - the symbol itself the module count matches how Code 128 is built
      - the symbol itself every scan line is identical
      - the symbol itself different codes make different symbols
      - the symbol itself an empty code is refused rather than printed blank
      - the printed label carries the name, the code and the price
      - the printed label the symbol goes out as a raster, not as GS k
      - the printed label a name too long for the label is cut, never wrapped
      - the printed label ten labels are ten labels
      - the printed label a 58mm roll gets a narrower symbol, not a clipped one
      - a shopkeeper prints stickers for an item
      - an item with no code says so rather than printing blanks
      - with no printer set up, nothing is printed and it says why

  - id: M2-DRAWER-01
    milestone: M2
    title: The cash drawer opens on a cash sale, and only then
    status: done
    # Off by default: most shops in this bracket have no drawer, and a printer
    # that clicks on every sale is a printer somebody unplugs.
    #
    # The cash test is `ReceiptTender.isCash`, not the printed label. The label
    # is display text that changes with the language, so deciding on it would
    # have stopped a shop switched to English from opening its drawer.
    proof:
      - a cash sale kicks the drawer, and only when asked to
      - with the drawer switched on, a cash sale opens it

  - id: M2-URDU-01
    milestone: M2
    title: Urdu on a receipt is rasterised, never sent as code page bytes
    status: done
    # A thermal printer draws text from a ROM font chosen by a code page: 256
    # glyphs, no shaping engine, no bidirectional algorithm, no fallback. The
    # community ESC/POS capability database catalogues seventy encodings
    # across every printer family in common use and not one of them is Urdu.
    #
    # CP1256 is the near miss, and reaching for it is the obvious mistake. It
    # fails three ways at once: no shaping, so a cursive script prints as
    # disconnected isolated forms; no bidi, so the line comes out reversed;
    # and it is Arabic, not Urdu, so the letters this market actually writes
    # with are simply absent. Any of the three alone makes it unreadable, and
    # the result looks like a printer fault rather than a bug here.
    #
    # So there is no byte sequence this app could send that would put Urdu on
    # paper. The only route is a picture, and the shaping and bidi have to be
    # done on the phone by a text engine that has both.
    #
    # The split follows that: pk_platform stays pure Dart and names the lines
    # it cannot spell, and dart:ui draws them. The survey lives on the
    # renderer rather than beside the predicate, because only the renderer
    # knows what it emits — it prints its own larger copy of the shop name and
    # skips the layout's, so a survey done anywhere else names a line nobody
    # prints and the caller rasterises an image that is thrown away, once per
    # receipt, on the path with a customer waiting. That was a real defect,
    # caught by a count assertion rather than by reading.
    #
    # Whole lines, never fragments. `Customer            <urdu name>` is one
    # string with an LTR run and an RTL one in it, and deciding the order of
    # those is the bidirectional algorithm's job. Splitting it here and
    # reassembling after would be this code making that judgement itself.
    #
    # Undrawn Urdu still degrades to question marks and never to code page
    # bytes: legibly wrong beats illegibly wrong. A shopkeeper who sees ?????
    # where their shop name should be has a complaint somebody can act on; one
    # who sees random glyphs concludes the printer is broken and returns it.
    #
    # The font is the system's. Android has shipped Noto Naskh Arabic since
    # Android 5, so Urdu renders on every handset this targets with nothing
    # bundled. Nastaliq is what Urdu is properly set in and what a shopkeeper
    # would prefer, but it is a 300 KB to 2 MB face and Flutter cannot
    # tree-shake a font used for text composed at runtime, so all of it would
    # ship — against release APKs already at 27 MB under a 30 MB ceiling.
    # That is a preference, and it goes behind a setting if it goes anywhere.
    proof:
      - what the printer font can say Urdu cannot
      - what the printer font can say Urdu-only letters count, not just the Arabic ones
      - what the printer font can say the characters the encoder folds still count as typeable
      - finding what has to be drawn an all-Latin receipt needs no pictures at all
      - finding what has to be drawn an Urdu item name is found, and its price line is not
      - finding what has to be drawn a mixed line is kept whole, so bidi is decided once
      - what reaches the printer no Urdu byte is ever emitted, even with no pictures supplied
      - what reaches the printer a supplied picture is sent as GS v 0 and the text is not
      - what reaches the printer an undrawn Urdu line degrades to question marks, not to garbage
      - what reaches the printer the drawn shop name replaces the big text, not adds to it
      - what reaches the printer a Latin receipt is untouched by the whole mechanism
      - its byte count is exactly what GS v 0 will declare
      - there is ink on it
      - a long line grows taller rather than being clipped
      - a wider roll gets a wider picture, not a scaled one
      - the whole receipt path ends in raster, not question marks

  - id: M2-URDU-02
    milestone: M2
    title: A shared PDF renders Urdu instead of dropping it
    status: done
    # Found while proving M2-URDU-01, and not fixed by it.
    #
    # The two paths fail differently and the PDF fails worse. The thermal one
    # degrades to question marks, which is visible and complainable. The PDF
    # degraded to nothing: Courier and Helvetica are Type 1 base fonts with no
    # Unicode at all, so an Urdu shop name was not substituted, it was
    # skipped. The pdf package prints `Unable to find a font to draw` on
    # stderr and carries on. That is the copy a customer receives over
    # WhatsApp, arriving with the shop's own name missing from the top of it.
    #
    # A PDF is read on somebody else's phone, so unlike the thermal path this
    # cannot be solved with this device's fonts. The face travels inside the
    # file, which means it has to be in the APK.
    #
    # A font alone is not enough, and this is the part that would have shipped
    # broken. Arabic script is cursive: a word is one connected run and every
    # letter has up to four contextual forms. The pdf package applies its bidi
    # and joining pass only when the text direction is RTL, and text left at
    # the default comes out as isolated, unjoined letters in logical order —
    # unreadable, and it reads as a missing font rather than as a direction
    # nobody set. So the proof does not check that a font was embedded; it
    # inflates the file's own ToUnicode map and checks the glyphs are
    # presentation forms in U+FB50..U+FEFF and that no bare letter from
    # U+0600..U+06FF got through. Mutation-tested by removing the direction:
    # the file then embeds only bare letters and the proof fails.
    #
    # Per string, not per document. The labels and every money column are
    # Latin and stay that way — Courier is here because its figures are
    # fixed-width, which is the entire reason a column of amounts lines up,
    # and flipping the document for the sake of a shop name would make every
    # total on the page crooked.
    #
    # Cost, measured rather than estimated: Noto Naskh Arabic Regular is a
    # 178 KB file that deflates to 92 KB in the APK, against release builds at
    # 27 MB under a 30 MB ceiling. Per document it is far less, because the
    # pdf package embeds only the glyphs used — about 2.6 KB on a bill with
    # Urdu on it, and nothing at all on a bill without.
    proof:
      - without a font, no face is embedded at all
      - with one, it is embedded and named in the file
      - the letters are joined, not printed one by one
      - an all-Latin receipt carries no embedded face
      - one Urdu bill costs kilobytes, not the whole face
      - the money columns keep their tabular font

  - id: M2-RUN-01
    milestone: M2
    title: A receipt comes out of a thermal printer, read back as a printer reads it
    status: done
    # Closed 27 Sep 2026 on the virtual printer, by the owner's decision: the
    # owner has no thermal printer, and asked for M2 to be finished without
    # one. This row used to demand paper from real hardware and said a
    # simulation must not close it. That rule was the owner's to change, and
    # they changed it; what follows says exactly what the emulator proves and
    # what it cannot.
    #
    # pk_platform/virtual_printer.dart takes the exact bytes the app sends a
    # printer and puts them on paper as an ESC/POS controller does, at the
    # Epson reference geometry for a 203 dpi head: Font A cells, line pitch,
    # the cutter sitting above the head. It is strict where a real machine is
    # unforgiving — an unknown command, a raster short of its header, a byte
    # outside the Latin code page is a fault, not a guess. Labels are read
    # back by a Code 128 decoder that measures bars off the raster the way a
    # scanner's sweep does, with a table learned from an independent encoder
    # and the checksum and stop pattern checked. The Urdu name is drawn by the
    # app's own rasteriser in the Naskh face it bundles, and joining is
    # measured: joined letters make fewer separate marks than the same
    # letters forced apart.
    #
    # Found on the first run: every Urdu line was drawn against the left
    # margin, the shop name small and off-centre. Fixed — the name is now
    # centred and large like its Latin counterpart, and other Urdu lines
    # start from the right.
    #
    # What it cannot prove, and is not claimed: a particular clone's ROM font
    # width (the in-app test print exists for exactly that, and its ruler is
    # proved here to show a wrong setting as a wrap), the distance from head
    # to blade on a given machine, heat and paper quality, and a physical
    # scanner's tolerance. The first shop with a printer should run Settings,
    # Printer, Test print once and look at the paper.
    proof:
      - on paper a bill printed on an 80mm machine is readable and cut below the total
      - on paper a bill printed on an 58mm machine is readable and cut below the total
      - on paper a bare cut after the same feed would go through the bill
      - on paper a Code128 label printed at the declared width scans back to its code (80mm)
      - on paper a Code128 label printed at the declared width scans back to its code (58mm)
      - on paper a Code128 label printed at the declared width scans back to its code (80mm two across)
      - on paper a code too long for its label is refused, not printed ragged
      - on paper a label that does not decode is caught
      - on paper what a real printer would choke on is a fault here
      - an Urdu shop name prints as joined script, not as question marks
      - the column count is read off a printed ruler, not assumed

  # ---- M3 · Parties, udhaar and money in and out ------------------------

  - id: M3-FIFO-01
    milestone: M3
    title: A payment says which bills it settled, oldest first
    status: done
    # The pure arithmetic underneath the khata, with no database in it, so
    # every awkward case can be asserted directly and the property can be run
    # two thousand times.
    #
    # A wholesale customer hands over Rs 50,000 against four open bills and
    # says nothing about which. Every competing product either nets the
    # payment against one running balance or asks the cashier to tick boxes,
    # and being unable to answer "which bills did this settle" is the single
    # most-complained-about gap in their reviews. A shopkeeper who cannot
    # answer it cannot argue about it with a customer either.
    #
    # Oldest first, because both sides already assume it: the customer thinks
    # they are clearing last month, and the shop wants the oldest debt off its
    # books. It is also the only thing that makes an ageing report mean
    # anything — a payment applied to the newest bill leaves a 90-day bucket
    # that never empties while the customer pays every month.
    #
    # Two rules that look like details and are not:
    #
    #  * A settled bill is SKIPPED, never netted against. Taking the overshoot
    #    off the next bill in the list gives the right total and the wrong
    #    khata: the shop's record shows a bill part-paid that the customer
    #    paid in full, and the argument at the counter is unwinnable from
    #    either side.
    #  * Money left over becomes an advance, never an allocation row. Parking
    #    it on the oldest bill writes an allocation larger than the bill it
    #    points at, and `findOverAllocatedPayments()` is the check that finds
    #    that — six months later, with no way left to reconstruct what was
    #    meant.
    #
    # The sort is total on purpose. Date, then sequence, then id: two bills a
    # comparator calls equal have their order decided by the sort's internals,
    # and an allocation that is not reproducible is not evidence.
    proof:
      - oldest first one payment clears the two oldest and part of the third
      - oldest first the input order does not matter and the input is not mutated
      - oldest first a backdated bill sorts by its date, not by when it was typed
      - oldest first same-day bills clear in the order they were raised
      - oldest first the order is total, so the same input gives the same answer
      - what must never happen a settled bill is skipped, never netted against
      - what must never happen a bill that has somehow gone negative is left alone
      - what must never happen no allocation is ever larger than the bill it points at
      - what must never happen no allocation is ever zero
      - money left over becomes an advance rather than an allocation
      - money left over a customer with nothing outstanding pays entirely on account
      - the arithmetic a payment of nothing is refused in words
      - the arithmetic paisa are exact, not near enough
      - the arithmetic property: 2000 random payments never create or destroy a paisa
      - the arithmetic property: allocations are always oldest first

  - id: M3-RECEIPT-01
    milestone: M3
    title: A receipt against udhaar is described in full before it is written
    status: done
    # The same shape as a sale posting, for the same reason: the rows are a
    # value, the entry is proved to balance while it is still a value, and a
    # use case that wrote nothing has nothing to return.
    #
    # Dr the tender account by the whole amount, Cr Receivables by what was
    # actually applied, Cr Customer Advances by what was left over.
    #
    # Three decisions in that sentence that are not obvious:
    #
    #  * An advance is a LIABILITY, not a negative receivable. Netting it
    #    against udhaar hides a real obligation inside an asset, where a
    #    balance sheet cannot show it and an ageing report cannot find it. The
    #    shop is holding the customer's money.
    #  * A cheque debits Cheques in Hand, never the bank. The sale path
    #    already had this right; getting it wrong here would put a cheque that
    #    later bounces into the shop's bank balance, and the shopkeeper would
    #    act on a number that is not theirs yet.
    #  * Every line touching a party names it. Without that a Trial Balance
    #    still balances and no report can say whose udhaar moved, which is the
    #    only question the khata screen asks.
    #
    # Settlements carry each bill's new totals rather than deltas. A writer
    # handed a delta has to read the row, add and write it back, and two tills
    # doing that against one bill is a lost update; a writer handed the answer
    # cannot get it wrong.
    #
    # `assertBalanced` checks one thing the journal cannot check for itself:
    # that the allocations plus the advance are the payment. Both halves of a
    # balanced entry can come from the same wrong total, and the shop's cash
    # and its khata would then disagree by an amount nobody can account for.
    proof:
      - the rows a receipt writes one note clears the oldest bills and leaves the rest on account
      - the rows a receipt writes each bill is told its new balance, not a delta
      - the rows a receipt writes a payment that settles nothing still records the advance
      - the rows a receipt writes the audit line says what happened in words
      - the journal entry debits the tender and credits receivables and advances
      - the journal entry every line naming a party names it
      - the journal entry an advance is a liability, never a negative receivable
      - the journal entry a cheque is not money in the bank until it clears
      - the journal entry no empty line is posted
      - the journal entry the entry is stamped with the business date and fiscal year
      - what it refuses a receipt of nothing
      - what it refuses a cheque with no number
      - the balance guarantee debits equal credits, exactly
      - the balance guarantee allocations plus the advance are the payment
      - the balance guarantee a posting that does not tie out is refused, not written
      - the balance guarantee a negative amount is refused rather than balanced

  - id: M3-RECEIPT-02
    milestone: M3
    title: A receipt against udhaar reaches the database, or nothing does
    status: done
    # `payments` and `payment_allocations` have existed since schema v1 with
    # no writer. This is their first one.
    #
    # The open bills are read INSIDE the transaction rather than passed in. A
    # balance read before the transaction opened is a balance a second till
    # may already have changed, and allocating against a stale figure is how
    # a shop ends up applying a payment to a bill somebody else settled a
    # minute earlier.
    #
    # Void and draft documents are excluded in the query rather than filtered
    # afterwards. A payment allocated onto a void bill is money the customer's
    # khata gains that nobody returned, and `findOverAllocatedPayments()`
    # cannot catch it because the sum still fits.
    #
    # Bills are updated with absolute totals from the builder, never deltas.
    # A writer handed a delta has to read-modify-write, and two tills doing
    # that against one bill is a lost update.
    #
    # The rollback proof had to be rewritten to mean anything. Its first
    # version used a payment account that did not exist, which fails before a
    # single row is written — a rollback test that never reaches the thing it
    # claims to test. It now removes the Customer Advances account behind the
    # writer's back and overpays, so the payment and its allocations are
    # already inserted when the journal cannot find the account. It also
    # counts rows before and after rather than asserting empty tables, because
    # the sale that created the udhaar legitimately wrote journal lines of its
    # own and the first version was asserting the sale away.
    #
    # Mutation-tested: dropping the void filter, and routing a cheque to the
    # bank instead of Cheques in Hand, each fail a proof.
    proof:
      - a payment clears the oldest bills and the balances come down
      - the books still balance afterwards
      - paying more than is owed leaves a liability, not a negative bill
      - a customer with no open bills pays entirely on account
      - the allocations record which bills, and for how much
      - a cheque is pending and sits in Cheques in Hand
      - a void bill is never paid against
      - a receipt is recorded in the audit trail with its own words
      - a receipt reaches the outbox so a second till can learn of it
      - a failure part-way through leaves nothing behind
      - a receipt number is never burned by a failure

  - id: M3-KHATA-01
    milestone: M3
    title: A shopkeeper can take money off a khata, from the app
    status: done
    # The row that stops M3 repeating M2. `PrintQueue`, `TcpPrinter` and the
    # whole Kotlin plugin sat in this repository for two commits with zero
    # call sites in `lib/`, and two commit messages announced them as shipped.
    # A payment path with no button is the same failure in a different
    # package, so this is proved by driving the actual screens.
    #
    # Tapping a customer used to open the editor — a form for their phone
    # number and their credit limit. That is the second thing a shopkeeper
    # wants from a name in a khata. The first is how much, and the thing they
    # do next is take money off it. So the tap lands on the khata and editing
    # became an action on it.
    #
    # The preview is the feature. Every competing product either nets a
    # payment against one running balance or makes the cashier tick boxes, and
    # being unable to answer "which bills did this settle" is the single
    # most-complained-about gap in their reviews. The sheet answers it before
    # the money is taken — and computes the answer with `allocateFifo`, the
    # same function the writer runs, over rows read with the same WHERE and
    # the same ORDER BY. A preview that could disagree with the write would be
    # worse than none.
    #
    # It can still differ in exactly one way: a second till may settle a bill
    # between the sheet being drawn and Save being tapped. The writer re-reads
    # inside its transaction, so the write is right and the preview was stale,
    # which is the correct direction for that error to run.
    #
    # A negative balance is labelled "jama shuda", not shown as a negative
    # amount under "kitna lena hai". The shop is holding the customer's money,
    # and "owes −2,000" is a sentence a shopkeeper has to translate in their
    # head at the counter.
    #
    # Mutation-tested: a Save button that pops without writing fails two of
    # these.
    proof:
      - a customer name opens their khata, not a form
      - the khata shows what is owed and on which bills
      - a payment reaches the database and the balance comes down
      - the sheet says which bills it will clear, before saving
      - paying more than is owed is offered as credit, not refused
      - a customer with nothing owed can still be paid on account
      - an amount of nothing is refused in words
      - a cheque with no number is refused in words

  - id: M3-LIMIT-01
    milestone: M3
    title: A credit limit actually stops a sale, and can be overridden by name
    status: done
    # It was set in the party editor, shown as a chip on two screens, and
    # enforced nowhere. A shop could put a customer on Rs 50,000 and watch
    # them reach Rs 200,000 without the app mentioning it once.
    #
    # A limit that stops nothing is decoration, and decoration that looks like
    # a control is worse than nothing: the shopkeeper believes they set
    # something. `PartySummary.isOverCreditLimit` was already computed — only
    # displayed.
    #
    # It stops the sale at the tender sheet, which is the moment before the
    # goods leave, and against the balance read right then rather than the
    # copy the picker handed over — which may be minutes old and is exactly
    # the figure a second till has been changing.
    #
    # Overridable by name, in the same place the warning appears rather than
    # behind a dialog. It is their shop, and a cashier with a customer waiting
    # should not have to find a second surface. The override is not remembered
    # past the bill.
    #
    # Only when the bill leaves a balance. A cash sale owes nothing, so there
    # is nothing to be over, and a customer with no limit is never checked.
    #
    # Found and fixed alongside: what a customer owes ignored advances
    # entirely, so somebody who paid Rs 5,000 against Rs 3,000 of bills read
    # as settled and the Rs 2,000 the shop was holding was invisible in the
    # one place anybody would look — and the limit was checked against that
    # same wrong figure. The balance now subtracts the ledger's
    # `customer_advances` position for the party, riding idx_jl_party.
    #
    # `partyById` was added in the same pass. The khata screen was filtering
    # an unfiltered `searchParties` to find one customer, which loads every
    # customer in the shop to display one of them, and a wholesaler has
    # thousands. The SELECT is shared as a string rather than by filtering the
    # other method's rows, because two expressions for what a customer owes
    # would be two answers to the shop's only question.
    #
    # Mutation-tested: removing the check fails three of these, and dropping
    # the advance from the balance fails one.
    proof:
      - a sale that would cross the limit is stopped
      - it names the limit and where the bill would land
      - the shopkeeper can go past it, deliberately
      - a sale inside the limit is never interrupted
      - a customer with no limit is never interrupted
      - a cash sale is never checked against a credit limit
      - what the shop is holding comes off what is owed

  - id: M3-REMIND-01
    milestone: M3
    title: A shopkeeper can chase udhaar without typing the message
    status: done
    # Chasing is the work a khata exists for. A shopkeeper with forty names in
    # a book spends their evening on it, and the reason to move the book onto
    # a phone is that the phone can also send the message.
    #
    # An intent, not an API. `whatsapp://send?phone=…&text=…` resolves to the
    # app already on the handset and hands it a string the way a share does.
    # No account, no Business API, no token, no endpoint — which is what keeps
    # it clear of the no-payment-integration rule and of every claim in
    # docs/what_leaves_the_phone.md.
    #
    # Deliberately never `wa.me/…`, which is the recipe every tutorial gives.
    # With WhatsApp absent that URL opens a browser to Meta — a network
    # request this product does not make on a shopkeeper's behalf. The
    # fallback is the system share sheet, which reaches SMS and needs no
    # network at all.
    #
    # The number is normalised and, when it cannot be a Pakistani mobile,
    # REFUSED rather than guessed. `0300-4471203` handed to WhatsApp unchanged
    # opens a chat with nobody and the shopkeeper believes the message went; a
    # landline is refused for the same reason. A reminder that reaches the
    # wrong number is worse than one not sent, because it tells a stranger
    # what somebody owes.
    #
    # The message threatens nothing and cites no law. Pakistani law has no
    # thirty-day notice provision of the kind these apps like to invent, and a
    # shop that sends a legal-sounding message it cannot follow through on has
    # spent its relationship with a customer for nothing.
    #
    # Two of these proofs first failed on their own explanatory comments — the
    # third time that shape has appeared in this repository, after
    # READ_MEDIA_IMAGES in a manifest comment and no_phantom_gate firing on
    # its own rationale. They now read parsed declarations and comment-free
    # code. The comment stripper then cut the inside of `whatsapp://send` and
    # asserted the scheme was missing from the file containing it, so it
    # strips whole-line comments only.
    proof:
      - the number WhatsApp needs however the shop wrote it down
      - the number WhatsApp needs every network prefix, not only the common one
      - the number WhatsApp needs nothing at all is nothing, not an empty chat
      - the number WhatsApp needs a half-typed number is refused rather than dialled
      - the number WhatsApp needs a landline is refused
      - the message names the shop, the customer and the amount
      - the message says since when, when the shop knows
      - the message and does not invent one when it does not
      - the message threatens nothing, and cites no law
      - the message is short enough to survive a lock screen
      - the message greets in the form this market actually uses
      - a customer who owes nothing is not chased
      - a customer who owes is chaseable
      - a customer with no number falls back, and says so
      - the reminder is addressed to a number WhatsApp can reach
      - the app never opens a browser to send a reminder
      - the manifest can still see whether WhatsApp is installed

  - id: M3-AGING-01
    milestone: M3
    title: A shopkeeper can see who to chase, oldest first
    status: done
    # A total tells a shopkeeper how much is out and nothing they can act on.
    # Rs 200,000 spread across this month's customers and Rs 200,000 sitting
    # since March are the same number and completely different problems, and
    # the second one is why shops keep a book at all.
    #
    # Sorted by the AGE of the oldest debt, never by size of balance. A list
    # sorted by amount puts the customer who owes Rs 40,000 since last week
    # ahead of the one who owes Rs 3,000 since March, every time, and the
    # second is the urgent conversation.
    #
    # Four buckets — 0-30, 31-60, 61-90, 90+ — because that is what every
    # accountant, bank and competing product uses, and a shopkeeper who has
    # seen one ageing report has seen this one. Empty buckets are shown, or
    # the shopkeeper wonders whether a missing one is empty or broken.
    #
    # "Overdue" deliberately excludes the current bucket. A kiryana shop's
    # cycle is a fortnight, and counting this week's udhaar as overdue makes
    # every shop look like it is in trouble every day.
    #
    # Aged on doc_date_local via julianday, never on a UTC instant. PKT is
    # UTC+5 with no daylight saving, so a bill raised at eight in the evening
    # would be a day older under UTC arithmetic — and 90 versus 91 days is
    # exactly where an ageing report starts arguments. The arithmetic exists
    # twice, once in SQL for a wholesaler with tens of thousands of open bills
    # and once in AgeBucket.forDays, so a proof pins them to the same boundary.
    #
    # A customer in credit overall is never chased. The mutation test earned
    # its keep here: the guard was real but the first proof of it closed the
    # bill through FIFO and so never reached the guard at all — removing the
    # guard failed nothing. The sequence that actually produces an open bill
    # alongside net credit is advance FIRST, bill after, which is how a
    # standing-order customer pays.
    proof:
      - which bucket a debt falls in the boundaries are inclusive at the top
      - which bucket a debt falls in a bill dated in the future is current, not a crash
      - days are counted on the business date across a month boundary
      - days are counted on the business date a leap day is a day
      - days are counted on the business date the same day is nothing owed for any time at all
      - bucketing a shop every bucket is present, including the empty ones
      - bucketing a shop bills land where their age puts them
      - bucketing a shop a settled bill contributes nothing
      - bucketing a shop overdue is everything past the shop normal cycle
      - bucketing a shop the buckets sum back to the total, exactly
      - a shop with nothing out reports every bucket at zero
      - bills land in the bucket their date puts them in
      - the SQL and the domain agree on the boundary
      - a paid bill drops out of the report
      - a void bill is never aged
      - the chase list is ordered by the oldest debt, not the largest
      - the chase list counts how many bills are open
      - the chase list a customer in credit overall is not chased
      - the chase list a customer who overpaid an open bill is not chased either
      - the chase list a shop that is owed nothing has nobody to chase
      - the collections view is reachable from the khata list
      - a shop that is owed nothing says so
      - the oldest debt is listed first, not the largest
      - it shows the total and what is overdue separately
      - a bucket can be tapped to see only those customers
      - tapping a customer opens their khata

  - id: M3-LEDGER-01
    milestone: M3
    title: A customer's khata settles the argument, not only the balance
    status: done
    # The open-bills view answers "what is still owed". It does not answer the
    # question a customer actually asks, which is "I paid you last week" — and
    # that answer has to be a date, an amount and a receipt number they can
    # match against the paper in their hand. Without the number the shopkeeper
    # is asking them to take a date on trust, which is how these arguments go
    # badly in a shop that has an app and a customer who has a receipt.
    #
    # One UNION rather than two queries stitched in Dart, so the ordering is
    # the database's and a bill and a payment on the same day cannot end up in
    # different relative orders on two different screens.
    #
    # Amounts are SIGNED rather than paired with a direction flag. A running
    # balance that adds some rows and subtracts others by reading a second
    # column is a running balance somebody eventually gets backwards.
    #
    # The running balance is computed on read and never stored. A cached one
    # is wrong for every row after the insertion point the moment a backdated
    # bill is entered — which every shop does, because the paperwork happens
    # on Sunday and the bill was Friday's.
    #
    # Oldest first from the query, because that is the order a running balance
    # is computed in; reversed on screen, because a shopkeeper looking for
    # last week's payment wants it at the top.
    proof:
      - a customer with no history has an empty khata
      - bills and payments are interleaved by date
      - a payment reduces what is owed and a bill increases it
      - the running balance is right after every line
      - a backdated bill lands where its date puts it
      - every line carries the number on the customer paper
      - a void bill never appears
      - another customer khata is not in this one
      - the khata shows what was paid, not only what is owed

  # ---- M4 · Purchases and cost truth ------------------------------------

  - id: M4-COST-01
    milestone: M4
    title: The weighted average cost, exact to the paisa over any history
    status: done
    # `avg_cost_milli_paisa` has been written once at item creation and never
    # moved — `drift_catalogue_writer` explicitly removes it from every
    # update. A shop that opened an item at Rs 90 and has been buying at
    # Rs 120 for six months still reads a Rs 30 profit on every sale.
    #
    # Weighted average rather than FIFO, because a kiryana shop does not know
    # which sack of rice it sold. The stock is in a bin, the new delivery goes
    # on top of the old, nobody tracks layers. It is what the shopkeeper
    # already does in their head and it survives a stock-take; lots land in
    # M11 for the pharmacies that genuinely need them.
    #
    # Held forward by INDUCTION, never by re-summing the stock ledger.
    # Re-summing looks safer and is not: it makes today's cost a function of
    # every row ever written, so one bad historical row silently restates last
    # month's profit, and a shop with three years of movements pays for the
    # whole history on every sale.
    #
    # Four rules that are each one line and each wrong by default:
    #
    #  * A sale does NOT move the average. Changing the cost because something
    #    left would make a sale profitable by selling.
    #  * At zero the average is KEPT, not cleared. A zero posts no COGS on the
    #    next sale if the next delivery is entered a minute late, and a sale
    #    with no cost has infinite margin in every report that reads it.
    #  * A negative balance is written off to wastage when the delivery lands,
    #    never averaged in. Letting the absence dilute the new cost makes
    #    everything on the shelf look cheaper than it was, forever.
    #  * Landed cost is per receipt, freight included. Dividing it into a
    #    per-unit rate first throws away the paisa the residue exists to catch.
    #
    # The residue is the price of induction. 1.833 kg carried at Rs 85/kg plus
    # 1.5 kg for Rs 100 gives an average that cannot make the value both
    # round(avg x qty) and valueBefore + landedCost — one paisa has nowhere to
    # go. Posted as an extra COGS line; without it Inventory drifts a paisa at
    # a time and after a year nobody can say when it started.
    #
    # The first residue proof used numbers that divided evenly, so it asserted
    # an equality that held whether the residue existed or not — deleting the
    # residue line failed nothing. Found by mutation, then by measuring: 24,796
    # of 200,000 random movements produce one, always exactly one paisa. The
    # property now asserts conservation (everything paid in is on the shelf,
    # issued at cost, or residue) AND that residues actually occurred, or the
    # conservation assertion would prove nothing.
    proof:
      - a delivery moves the average the weighted step, with numbers a shopkeeper could check
      - a delivery moves the average freight is in the cost, because the shop paid it
      - a delivery moves the average the first delivery sets the cost by itself
      - a delivery moves the average a delivery onto an empty shelf ignores the old average
      - a delivery moves the average a fractional quantity averages exactly
      - a delivery moves the average what it refuses
      - a sale does not the average is untouched by an issue
      - a sale does not selling out keeps the average, never clears it
      - a sale does not selling more than is on the shelf goes negative, not to zero
      - the shortfall a late delivery covers is written off, never averaged into the new stock
      - the shortfall a late delivery covers an ordinary delivery writes nothing off
      - the invariant a residue appears where the division does not come out
      - 'the invariant property: value always equals round(avg x qty), 5000 movements'
      - 'the invariant property: an issue never changes the average, 2000 times'
      - overflow is refused, never wrapped an absurd carried value throws rather than going negative

  - id: M4-COST-02
    milestone: M4
    title: A delivery is described in full, and the entry balances every time
    status: done
    # Dr Inventory by what the shelf is worth now minus what it was worth
    # before, Cr the supplier and whatever was paid at the door, and put the
    # difference where it belongs.
    #
    # The first version debited Inventory by the landed cost, and the entry
    # did not balance when a delivery landed on a NEGATIVE balance: the debit
    # assumed the account started at zero while the credit knew it did not.
    # Found by working the journal out on paper rather than by a failing test,
    # because the test fixture had never put a bill against negative stock.
    #
    # Fixing it collapsed two fields into one. `residue` and `writeOff` were
    # the same subtraction computed two different ways — the first with the
    # negative carried value zeroed out, the second with it kept — and having
    # both is precisely what let the journal come apart. There is now one
    # `adjustment` and a flag saying which account it belongs to:
    #
    #   * COGS, when it is the paisa a division could not place.
    #   * Wastage, when the delivery covered a shortfall. Inventory held
    #     -Rs 300, the bill adds Rs 1,300, the shelf is worth Rs 910 — the
    #     Rs 90 is what the three missing units really cost beyond what the
    #     books took them out at, and it was never anybody's profit.
    #
    # Freight is apportioned by VALUE through `Money.allocate`, which cannot
    # lose a paisa. Splitting it evenly would put as much delivery cost on a
    # Rs 50 packet as on a Rs 5,000 sack, and the margin on the packet would
    # be nonsense.
    #
    # The costing position is carried between lines of the same bill, so a
    # wholesale delivery listing the same item twice averages the second line
    # against the first rather than against the shelf as it was this morning.
    #
    # A fully paid bill posts NO payable line. A zero one claims the supplier
    # is owed nothing and is owed it by somebody.
    #
    # Mutation-tested: debiting the landed cost, splitting freight evenly, and
    # not carrying the position between lines each fail a proof.
    proof:
      - what a delivery does to the cost the first delivery sets the average
      - what a delivery does to the cost a second delivery weights against the shelf
      - what a delivery does to the cost the same item twice on one bill averages against itself
      - freight is in the cost, apportioned by value
      - freight never loses a paisa, however awkward the split
      - the entry balances on an ordinary credit purchase
      - the entry balances when some was paid at the door
      - the entry balances when the whole bill was paid, with no payable line at all
      - the entry balances when the delivery lands on a negative balance
      - the entry balances when a paisa cannot land in either place
      - what it refuses a bill with no lines
      - what it refuses paying more than the bill is for
      - what it refuses paying with no account for it to come out of
      - the rest of the rows stock moves in, in base units
      - the rest of the rows the supplier is named on the payable line
      - the rest of the rows the audit line carries the supplier own bill number
      - the rest of the rows the document is a purchase bill dated today

  - id: M4-COST-03
    milestone: M4
    title: A delivery moves the average in the database, or nothing does
    status: done
    # The first thing in this repository that ever writes
    # `items.avg_cost_milli_paisa` after item creation. `DriftCatalogueWriter`
    # explicitly strips it from every update, so until this existed a shop
    # that opened rice at Rs 90 and had been buying at Rs 120 for six months
    # still read a Rs 30 profit on every sale.
    #
    # The costing position is read INSIDE the transaction. A second till
    # selling the same item between the bill being typed and being saved
    # changes the balance the new average is weighted against, and an average
    # computed from a stale balance is wrong for every sale that follows it.
    #
    # The carried VALUE is derived from the item's average and the stock
    # ledger's balance, never stored. A column for it would be a second answer
    # to the same question, and the two would disagree the first time one of
    # them was written by a path that forgot the other — the invariant is
    # `value == round(avg x qty)` and deriving it is what makes that true
    # rather than hoped for.
    #
    # The writer does no arithmetic. Every figure it writes was computed by
    # the pure builder, so there is no room for this layer to do it
    # differently from the layer that was tested.
    #
    # Mutation-tested, and the numbers say what the milestone is worth: never
    # writing the average — the state this repository has been in from the
    # start — fails five of these, and reading the position from the item row
    # while ignoring the shelf fails two.
    proof:
      - a delivery moves the average, which nothing did before
      - a second delivery weights against what is on the shelf
      - freight lands in the cost, because the shop paid it
      - the books balance after a delivery
      - what is still owed reaches the supplier khata
      - a sale after a delivery costs what the delivery cost
      - a delivery covering a shortfall writes the difference off
      - a failure part-way through leaves nothing behind
      - the delivery is recorded in the audit trail
      - the new average is reported back, not left to be read

  - id: M4-BUY-01
    milestone: M4
    title: A shopkeeper can enter a delivery, and the cost follows
    status: done
    # The costing engine had no screen, and a costing engine with no screen is
    # the same failure as a printer with no button. This repository has
    # shipped that twice.
    #
    # Cost, never price. The sale rate is not asked for and not touched: a
    # delivery arriving is not an instruction to reprice the shelf, and a
    # screen that changed both at once would make it impossible to tell which
    # decision the shopkeeper actually made.
    #
    # The cost field is prefilled from the catalogue's purchase rate, because
    # most deliveries come in at the price the shop expects and retyping it is
    # where a wrong cost gets entered. Blank when there is none, NEVER
    # inferred from the sale rate — a cost taken from a price is a margin of
    # zero, and a margin of zero that looks like a real number is worse than
    # no number at all.
    #
    # The Save button is pinned below the list rather than being the last
    # thing in it. Whatever the keyboard or a long delivery squeezes out,
    # saving stays reachable — the rule the counter already follows with its
    # Charge button. This was found by a test that could not reach the button
    # at all, which is what a shopkeeper with a keyboard up would also have
    # found.
    #
    # Two things the test got wrong before the code did. It typed the quantity
    # into the supplier's bill number, because it addressed fields by index
    # and the purchase screen underneath the sheet has three of its own. And
    # it asserted against the empty state after scrolling to the Save button,
    # which a lazy ListView had already unmounted — asserting against a widget
    # that is not there is asserting against nothing.
    #
    # Mutation-tested: a Save that pops without writing fails three proofs.
    proof:
      - the shopkeeper can reach it from the home screen
      - a delivery entered on the screen moves the average
      - freight typed on the screen lands in the cost
      - a delivery with no supplier is refused in words
      - a delivery with nothing on it is refused in words
      - paying more than the bill is refused in words
      - what is still owed reaches the supplier khata

  # ---- M5 · Corrections, returns and data safety ------------------------

  - id: M4-BUY-02
    milestone: M4
    title: The cost moves on screen as it is typed, and a delivery can be found again
    status: done
    # Two things the purchase screen promised and did not do.
    #
    # Its doc comment said the new average was shown per line, so a
    # shopkeeper watches the cost move and catches two hundred sacks typed for
    # twenty. `purchaseNewAverage` sat in the ARB with no caller. It is drawn
    # now, from `landLines` — the loop the builder posts from, moved out of
    # it so the preview and the write cannot be two copies of the arithmetic
    # — over the position the writer itself will read.
    #
    # And a saved delivery could not be looked at again: the tile opened a
    # blank form and nothing else, while `purchasesTitle` and its empty state
    # were also in the ARB with no screen. The tile now opens the list, with
    # what is still owed on each delivery after every payment since.
    #
    # The supplier's bill number the form asks for was written only into an
    # audit sentence. Schema v3 gives it a column, the writer fills it, and
    # the list shows it first — it is the number printed on the paper in the
    # shopkeeper's drawer. The migration is proved against a v2 database that
    # holds a purchase, not an empty one.
    proof:
      - the new average shows on the line before it is saved
      - a saved delivery is on the list, with what is still owed
      - the supplier's own bill number is kept on the bill
      - v2 to v3 — the supplier's own bill number a v2 purchase comes through whole, with room for the number

  - id: M5-VOID-01
    milestone: M5
    title: A posted bill is undone by a reversal, never by an edit
    status: done
    # A posted document is immutable, and not as a preference: the shopkeeper
    # has already printed it and handed the paper to a customer. A number that
    # changes underneath somebody holding the receipt is what makes them stop
    # trusting the app.
    #
    # `journal_entries`, `journal_lines` and `stock_ledger` are append-only
    # and TxRunner refuses to update them. Only `documents` moves, and only
    # its status — which is what the schema was built for and what nothing
    # had used until now.
    #
    # NEVER a minus sign. The reversal swaps the sides; no amount is negated.
    # Negating looks equivalent and is not: a Trial Balance built by summing a
    # column cannot tell a negative debit from a credit, so the report
    # balances while the accounts are wrong. Mutation-tested — negating
    # instead of swapping fails thirteen of these.
    #
    # Dated TODAY, never backdated to what it undoes. A reversal backdated
    # into a period that has been closed, reported or filed changes a number
    # somebody has already acted on. Dated today it nets to zero and leaves
    # both halves visible, which is what a day book should show.
    #
    # Stock goes back at the cost it left at, never at today's average. A void
    # means the goods never left; putting them back at a cost they were never
    # carried at would change the shop's inventory value because somebody
    # corrected a typo, and the difference would land in no account at all.
    # It is an `adjustment`, not a `sale_return` — a return is a customer
    # bringing goods back, a different event with its own tax treatment.
    #
    # The refusal that matters: a bill with payments allocated against it
    # CANNOT be voided. The naive void leaves allocation rows pointing at a
    # document no report considers real, and `findOverAllocatedPayments()`
    # cannot catch it because the sum still fits — verified by reading it,
    # it compares SUM(allocations) against the payment and knows nothing
    # about document status. The customer's khata would quietly gain money
    # nobody returned. The refusal names the receipts, because "deal with the
    # payments first" is only actionable if the shopkeeper is told which.
    proof:
      - the sides swap every debit becomes a credit and back
      - the sides swap nothing is ever negated
      - the sides swap and the totals swap with them
      - the sides swap the party stays on the line it was on
      - when it happened the reversal is dated today, never backdated
      - when it happened and says what it undid, in its own narration
      - when it happened and points at the entry it reverses
      - the stock goes back at the cost it left at, not at today
      - the stock goes back as an adjustment, never as a return
      - the stock goes back dated today, like the entry
      - the stock goes back a document that moved no stock reverses none
      - what it refuses a void with no reason
      - what it refuses a bill that has been paid against
      - what it refuses and names the receipts standing in the way
      - what it refuses an entry with no lines, because nothing happened
      - the audit line says what was voided and why, in words
      - the audit line and the reason is trimmed rather than stored ragged

  - id: M5-VOID-02
    milestone: M5
    title: A bill can be undone in the database, and its tender with it
    status: done
    # Reads what was actually written, mirrors it, appends. Nothing in the
    # ledger is edited — the only rows that change are the document's status
    # and its own tender's.
    #
    # The reversal is built from the ENTRY, not from the draft. Prices, costs
    # and tax rules all move; the entry that exists is the only thing worth
    # undoing, and rebuilding from a draft would produce today's numbers for
    # yesterday's bill.
    #
    # Journal lines name their account by resolved id rather than by system
    # key, so the reversal points at the same account rows the original did.
    # Going back through a key would re-resolve, and an account renamed or
    # re-keyed since would send the reversal somewhere else entirely.
    #
    # The thing that made the first version wrong: a cash sale writes its own
    # tender and allocates it to itself, so treating every allocation as an
    # obstacle made EVERY cash sale unvoidable. Found immediately, because
    # five proofs failed at once.
    #
    # A counter tender and a receipt taken later are different events. The
    # tender is part of the sale — cancelling the bill means handing the money
    # straight back, and both records go together. A receipt is money the
    # customer really did hand over against a khata, and voiding the bill
    # underneath it would either lose that money or leave an allocation
    # pointing at a document no report considers real.
    #
    # The discriminator is `allocation_mode`: DriftSaleWriter writes `exact`,
    # ReceiptDraft defaults to `fifo`. That is a real coupling between two
    # files, so it is named in the code and asserted from both sides — a
    # receipt against a single bill still refuses, and a cash sale still
    # voids with its tender.
    #
    # The allocation row is left where it is. `amount_paisa > 0` is a CHECK
    # and `deleted_at_utc` is an envelope column TxRunner refuses to let
    # anything set by hand, both correctly. A row pointing from a void payment
    # at a void document is inert, and it stays as evidence.
    #
    # Mutation-tested: blocking every allocation fails eight, and leaving the
    # tender standing fails one.
    #
    # Sale bills only, since 26 Sep 2026. The snapshot read had no document
    # type, so the writer would have voided a delivery if anything asked: the
    # stock back out and the journal reversed, the cost average left where
    # the delivery moved it. Nothing on screen asked, but the door was open.
    proof:
      - the books net to zero after a void
      - the stock comes back
      - nothing in the ledger is edited, only appended
      - the reversal points at what it undid
      - the bill is marked void and keeps its reason
      - a voided udhaar bill leaves the khata clear
      - what it refuses a bill that has been paid against, naming the receipt
      - what it refuses a receipt refuses even when it touches this bill alone
      - what it refuses a cash sale can still be voided, tender and all
      - what it refuses a bill that is already void
      - what it refuses a bill that does not exist
      - what it refuses a void with no reason, before anything is written
      - a failed void burns no journal number
      - the void is recorded in the audit trail
      - what it refuses a delivery, whose cost cannot be undone by reversing it

  - id: M5-VOID-03
    milestone: M5
    title: A shopkeeper can cancel a bill, and is told when they cannot
    status: done
    # The sales list has struck void bills through and badged them since M0,
    # waiting for something in `lib/` that could produce one. Nothing could.
    # The badge and the strike-through were already there and already right;
    # only the button was missing.
    #
    # The sheet says plainly that the bill is NOT deleted. A shopkeeper who
    # believes a bill vanished will be surprised to find it in a report, and
    # being surprised by your own books is how you stop trusting them.
    #
    # The refusal is shown as words. A guard that names the receipts standing
    # in the way is the whole point of the guard, and dropping it into a stack
    # trace would waste it — so `VoidRefused` is caught separately from every
    # other error and its own sentence is what the shopkeeper reads.
    #
    # The action is offered only while the bill is still standing. An action
    # that can only fail is one a shopkeeper learns to distrust the whole
    # screen for.
    #
    # `documentStatus` was added for that, and written twice. The first
    # version scanned five hundred recent sales to find one row — the same
    # mistake as the first `partyById`, made again three commits later. It is
    # a lookup now.
    #
    # A duplicate string was written and deleted in the same pass:
    # `salesVoided` already existed and was already on screen.
    #
    # Mutation-tested: a Cancel that pops without writing fails five.
    proof:
      - a posted bill offers to be cancelled
      - cancelling writes the reversal and marks the bill
      - the stock comes back on the shelf
      - the list strikes it through afterwards
      - and stops offering to cancel it again
      - a cancel with no reason is refused in words
      - a bill paid against is refused, naming the receipt
      - the sheet says the bill is not deleted

  - id: M5-RETURN-01
    milestone: M5
    title: Part of a bill can come back, at the cost it left at
    status: done
    # Distinct from a void, and the distinction is the whole reason it exists.
    # A void says the bill should never have happened; a return says it did
    # and then some of it came back. A shopkeeper who sold five things and had
    # one returned cannot void the bill — the other four were sold, the
    # customer keeps them, and the tax on them is owed.
    #
    # THE COST IS THE SNAPSHOT. Goods come back at what they left at, read off
    # `document_lines.cost_paisa`, never at today's average. Stock has moved
    # since: deliveries have landed and the average has shifted. Bringing a
    # tin back at today's cost would create or destroy inventory value out of
    # nothing — the shop would book a profit or a loss on a customer changing
    # their mind — and the difference would land in no account at all.
    #
    # A part return pro-rates that snapshot through `Money.allocate`, which
    # cannot lose a paisa. Taking the whole line's cost back for one unit of
    # five fails two proofs.
    #
    # The limit counts what EARLIER returns already took, not just what this
    # visit asks for. Without it a customer can return three tins from a bill
    # for two across three visits, and a shop can be walked out of its stock
    # one bill at a time.
    #
    # Dr Sales Returns, never Dr Sales. A contra-revenue account, because a
    # shopkeeper who took Rs 40,000 of returns in a month needs to see that
    # number and netting it into Sales hides it.
    #
    # The credit is SPLIT against what the bill can still absorb, exactly as a
    # receipt is. Crediting Receivables for the whole amount would be wrong
    # whenever the customer had already paid: the ledger would say their
    # udhaar came down while `documents.balance_paisa` — which is what the
    # khata screen sums — had nothing left to come down from. The two would
    # disagree by exactly the returned amount, and the khata is the one the
    # shopkeeper reads. Found by thinking about what the writer would have to
    # do, before there was a writer to get it wrong.
    #
    # A walk-in return has to be paid back over the counter, refused in words
    # rather than discovered as an unbalanced entry: there is no khata to put
    # the credit on.
    #
    # Tax on a return lands in M12 with the rest of the tax pack. A return of
    # a taxed sale currently gives back the goods value and nothing else,
    # which is visibly incomplete rather than quietly wrong, and it is said in
    # the code so it is not mistaken for done.
    proof:
      - part of a bill can come back one unit off a line of five
      - part of a bill can come back the whole line at once
      - part of a bill can come back several lines in one visit
      - the cost the goods come back at is what they left at, not what stock costs today
      - the cost the goods come back at is pro-rated when only some of a line comes back
      - the cost the goods come back at and the pro-rating never loses a paisa
      - the cost the goods come back at a zero-cost line comes back at zero, not at a divide by zero
      - the money goes back on the khata when nothing is handed over
      - the money goes on account when the bill is already settled
      - the money splits when the bill can absorb only part of it
      - the money comes out of the drawer when it is handed over
      - the money splits between the two when only some is handed over
      - the money is a debit to Sales Returns, never a debit to Sales
      - what it refuses more than was sold
      - what it refuses more than is LEFT after an earlier return
      - what it refuses a line that is not on that bill
      - what it refuses a return of nothing, and a return with no lines
      - what it refuses a return with no reason
      - what it refuses handing back more than the goods were sold for
      - what it refuses a walk-in return that is not paid back in full
      - what it refuses a refund with no account for it to come out of
      - the entry balances across every shape of return
      - the entry balances and the return points at the bill it came off

  - id: M5-RETURN-02
    milestone: M5
    title: A return reaches the database, and the limit holds across visits
    status: done
    # The return is its own document with its own number, linked to the bill
    # it came off. Nothing on the original changes except how much of it is
    # still owed — the bill the customer is holding still says what it always
    # said.
    #
    # The limit counts what earlier returns took THROUGH `doc_links`, read
    # inside the transaction. Counted rather than cached on the line, because
    # a cache is a second answer and the whole point of the limit is that it
    # cannot be walked past. Without it a customer returns the same tin every
    # day and walks a shop out of its stock one bill at a time — and that is
    # the half of this that needs a database to be true at all.
    #
    # The cost snapshot survives a delivery. A proof sells at Rs 90, buys at
    # Rs 200 so the average moves, then returns: the tin comes back at Rs 90.
    # At Rs 200 the shop would have booked a profit on a customer changing
    # their mind.
    #
    # The credit splits exactly as the builder computed it — what the bill can
    # absorb comes off `documents.balance_paisa`, the rest is already credited
    # to Customer Advances by the journal. A proof settles the bill first and
    # checks the khata reads minus Rs 150 afterwards, because that is the
    # figure a shopkeeper argues from.
    #
    # Two of these proofs were rewritten because they did not test their own
    # names. One asserted a row count was `isNotNull`, which a count always
    # is — a test that could not fail dressed as one that could. The other was
    # called "becomes credit" while asserting the credit was zero.
    #
    # Mutation-tested: ignoring earlier returns fails two, never reducing the
    # bill fails one, losing the cost snapshot fails one.
    proof:
      - one tin off a bill for five comes back
      - the books balance afterwards
      - the credit comes off the khata
      - a cash sale returned for cash owes nobody anything
      - a return against a settled bill becomes credit, not a refund
      - the stock comes back at what it left at, not at today
      - the return is linked to the bill it came off
      - the limit holds across visits a second return can only take what the first left
      - the limit holds across visits and a third finds nothing left
      - what it refuses a bill that does not exist
      - what it refuses a failure leaves nothing behind
      - the return is recorded in the audit trail

  - id: M5-RETURN-03
    milestone: M5
    title: A shopkeeper can take goods back, one line at a time
    status: done
    # Offered before Cancel on the same screen, because it is the commoner of
    # the two by a long way: a customer bringing one thing back is an everyday
    # event and a bill that should never have existed is not.
    #
    # What is still returnable is shown next to every line, counted through
    # the returns already recorded against that bill. A shopkeeper should
    # never be able to choose a quantity the save then refuses — being told no
    # after choosing is how a counter queue turns into an argument.
    #
    # The screen's count is the SAME query the writer runs inside its
    # transaction, down to the subquery. Two different counts of what is left
    # would let the sheet offer a quantity the writer rejects, which is the
    # worst of both.
    #
    # It can still go stale — a second till taking the same tin back between
    # the sheet opening and Save — and the writer re-reads, so the write is
    # right and the screen was optimistic. That is the correct direction for
    # that error to run.
    #
    # Plus and minus rather than a keyboard. A kiryana return is a tin or a
    # packet; a text field would be four taps where two will do, and would let
    # a shopkeeper type past what is left.
    #
    # Mutation-tested: a Save that pops without writing fails four, and a
    # sheet that ignores earlier returns fails two.
    proof:
      - a posted bill offers to take goods back
      - one tin off a bill for five reaches the database
      - the sheet shows what is still returnable
      - and counts down after an earlier visit
      - a return with nothing chosen is refused in words
      - a return with no reason is refused in words
      - a bill with nothing left to return says so
      - the credit comes off the khata

  - id: M3-EXPENSE-01
    milestone: M3
    title: Rent, bijli and wages reach the books
    status: done
    # The chart has carried rent, salaries, utilities, freight and misc since
    # M0 and nothing has ever posted to them. A shop that records only what it
    # sells and what it buys has a P&L that is fiction: the cash book will not
    # reconcile, the margin will look like profit, and the shopkeeper will
    # believe they made more than they did every single month.
    #
    # The expense head lives on the JOURNAL LINE, as `account_id`, and nowhere
    # else. A denormalised column on `documents` would be a second answer to a
    # question the ledger already holds, and the two would disagree the first
    # time one was written by a path that forgot the other — which is exactly
    # how a shop ends up with a Trial Balance and an expense report that do
    # not match. A proof reads it back through the join that column would have
    # replaced.
    #
    # A CLOSED list of heads. Free text produces "Bijli", "bijli",
    # "Electricity" and "Light bill" as four lines that add up to nothing
    # anybody can read, and the whole point of an expense report is comparing
    # this month with last.
    #
    # The note is required. "Misc — Rs 4,000" six months later is a number
    # nobody can defend, and misc is where every unlabelled expense ends up.
    #
    # An unpaid expense has to name who it is owed to — the mirror of a bill
    # left part-paid having to name a customer. Money the shop can never
    # settle, sitting in a total it can never explain, is the same defect
    # pointing the other way.
    #
    # Mutation-tested at the layer each rule belongs to. Opening the head list
    # fails a domain proof but NOT a database one, because the writer refuses
    # an unknown account anyway — the rule is a domain rule and the domain
    # test is what holds it.
    proof:
      - a bill paid at the counter debits the head and credits the drawer
      - a bill paid at the counter and the document says it is settled
      - a bill not paid yet is owed to somebody by name
      - the head is on the journal line, not on a column of its own
      - the head is named by key, so renaming the account cannot break it
      - the head comes from a closed list
      - what it refuses an expense of nothing
      - what it refuses an expense with no note
      - what it refuses money paid with no account it came out of
      - what it refuses an unpaid expense with nobody to pay
      - the entry balances paid and unpaid alike
      - the entry balances and the audit line says head, amount and what it was for
      - a bijli bill lands on the utilities head
      - and comes out of the drawer
      - the books balance
      - an unpaid expense sits on the payable, by name
      - the head is read back off the journal, not off a column
      - the note is kept, because the amount alone defends nothing
      - a head this shop does not keep is refused
      - a failed expense burns no number
      - the expense is recorded in the audit trail

  - id: M3-EXPENSE-02
    milestone: M3
    title: A shopkeeper can write down rent, bijli and wages, from the app
    status: done
    # M3-EXPENSE-01 put the writer in and nothing in `lib/` called it — the
    # third time this repository has shipped a feature as a library with no
    # button, after the printer and the costing engine. This row is the button,
    # proved by driving the real screens and reading the rows back.
    #
    # The head is a chip from `expenseHeads`, the same closed list the builder
    # refuses anything outside of, so the screen cannot offer a head the books
    # would reject. The note, the amount and the payee of an unpaid expense
    # are checked before Save as well as in the builder: the builder's refusal
    # is the rule, and the screen's is what tells a shopkeeper which field is
    # empty in their own language.
    #
    # The cheque account is not offered as a source. It posts to Cheques in
    # Hand, which is paper customers gave the shop; paying rent from it is
    # endorsing somebody's cheque over, and that is M6's lifecycle to record.
    #
    # The list reads the head off the journal line through the same join the
    # Trial Balance makes. There is still no column holding it anywhere else.
    proof:
      - expenses can be reached from the home screen
      - a bijli bill paid from the drawer lands on utilities
      - an expense with no note is refused in words
      - an expense of nothing is refused in words
      - an unpaid expense has to say who it is owed to
      - an unpaid expense sits on the payable, by name
      - an expense entered on screen leaves the books balanced

  - id: M3-PAYOUT-01
    milestone: M3
    title: A payment to a supplier is described in full before it is written
    status: done
    # The receipt turned around. Until this there was a way to owe a
    # supplier — any delivery not fully paid at the door — and no way to stop
    # owing them: Accounts Payable only ever went up.
    #
    # Oldest first through `allocateFifo`, the function the customer side
    # runs, and settlements carry each bill's new totals rather than deltas,
    # for the same lost-update reason.
    #
    # One rule goes the other way on purpose. A customer who overpays leaves
    # credit, which is a liability the shop holds. The shop overpaying a
    # supplier is money owed BACK — an asset — and the chart has no
    # advances-to-suppliers account. Crediting it to the payable would hide an
    # asset inside a liability, the netting the receipt side was built to
    # avoid, so it is refused in words with the figure that is owed.
    #
    # A cheque was refused too until M6 gave the shop's own cheques their
    # lifecycle (M6-ISSUE-01); now only one with no number is.
    proof:
      - which deliveries a payment settles the oldest delivery is paid first, whatever order they arrive in
      - which deliveries a payment settles each delivery is told its new balance, not a delta
      - which deliveries a payment settles nothing is ever left over as an advance
      - the journal entry a payment writes debits the payable by name and credits where the money came from
      - the journal entry a payment writes the payment is money going out
      - the journal entry a payment writes debits equal credits, exactly
      - what a supplier payment refuses a payment of nothing
      - what a supplier payment refuses paying more than is owed
      - what a supplier payment refuses paying a supplier who is owed nothing
      - what a supplier payment refuses a cheque with no number

  - id: M3-PAYOUT-02
    milestone: M3
    title: A payment to a supplier reaches the database, or nothing does
    status: done
    # Through the same writer as a receipt — `payments` has carried a
    # direction column since schema v1 — so the allocations, the settled
    # bills, the journal, the audit row and the outbox commit together. The
    # audit action says PAYMENT_MADE, not PAYMENT_RECEIVED.
    #
    # What is owed is read inside the transaction: purchase bills and
    # expenses left on account, never void, never draft. The supplier's khata
    # reads what each bill put on the account off the payable line it posted,
    # not off `paid_paisa`, which moves with every payment against the bill.
    proof:
      - a payment clears the oldest delivery first
      - what the shop owes the supplier comes down, by name
      - paying a supplier leaves the books balanced
      - the payment is money going out, under its own number
      - an expense left on account is paid off the same way
      - paying more than is owed writes nothing and burns no number
      - the supplier khata runs from deliveries to payments

  - id: M3-PAYOUT-03
    milestone: M3
    title: A shopkeeper can pay a supplier, from the app
    status: done
    # Driven through the real khata. A party the shop buys from gets what it
    # owes them, the deliveries not yet paid for, and a Pay sheet that shows
    # which deliveries the money clears before it leaves the drawer. A party
    # who is both customer and supplier gets both halves, each against its
    # own bills, and never one netted figure neither side agreed to.
    #
    # The party list used to read Hisaab saaf for every mill with an unpaid
    # delivery, because it only knew one direction of debt.
    proof:
      - a supplier the shop owes does not read as settled
      - a supplier is paid from their khata and the debt comes down
      - the preview names the delivery before the money leaves
      - paying more than is owed is refused in words
      - a paid-off supplier shows nothing left to pay

  - id: M3-RECEIPT-03
    milestone: M3
    title: A customer's money never lands on a bill the shop owes
    status: done
    # Two live defects, found while building supplier payments and both from
    # one missing `doc_type` filter.
    #
    # Open bills were read with no document type. Since M4 a delivery left
    # part-paid has a balance, so a party who is both customer and supplier —
    # the mill that buys the shop's bran — had their payment to the shop
    # settle the shop's own purchase bill from them. The payable vanished and
    # the udhaar stayed. The receipt preview ran the same query and showed it.
    #
    # The ageing summary and the chase list had the same hole: a delivery not
    # yet paid for aged as though a customer owed it, filling the 90-day
    # bucket with the shop's own debts.
    #
    # Mutation-tested: removing either filter fails its proof.
    proof:
      - a customer payment never settles a bill the shop owes
      - what the shop owes a supplier is not udhaar

  - id: M5-BACKUP-01
    milestone: M5
    title: A backup is sealed so that only its passphrase opens it
    status: done
    # The books live in one SQLite file on one phone, and there is no server
    # by design. A phone dropped, stolen or reset took three years of udhaar
    # with it, and the startup-failure screen's "restore from backup" button
    # said "arrives in M5".
    #
    # The file is meant to leave the phone — WhatsApp to themselves, Drive, a
    # USB stick — so it is useless without the passphrase and nothing in it
    # names the shop. Argon2id at the OWASP minimum (19 MiB, 2 passes) makes
    # each guess cost real memory; AES-256-GCM makes a flipped byte, a cut-off
    # download and a wrong passphrase all fail the same tag. The header is
    # readable without the passphrase, so a restore can show "made on 3 Sept"
    # first, but it is authenticated: edit it and the file will not open.
    #
    # Pure-Dart crypto on purpose: the seal runs in a background isolate,
    # where no platform channel reaches a native implementation, and a
    # responsive counter beats a faster backup. Measured at about 160 ms for
    # the key and 10 MB/s for the data on the CI-class host; a handset is
    # slower and has not been measured, because none is on this bench.
    proof:
      - a backup round trip what comes out is byte for byte what went in
      - a backup round trip the header can be read before the passphrase is asked for
      - a backup round trip two backups of the same books never share a key or a nonce
      - a backup round trip it is compressed, so a big shop fits on WhatsApp
      - what the file gives away nothing of the database is readable without the passphrase
      - what a backup refuses a passphrase too short to protect a file that leaves the phone
      - what a backup refuses the wrong passphrase
      - what a backup refuses one flipped byte in the sealed data
      - what a backup refuses an edited header, even though it is not secret
      - what a backup refuses a download that was cut short
      - what a backup refuses a photo picked by mistake
      - what a backup refuses a backup from a newer build

  - id: M5-BACKUP-02
    milestone: M5
    title: A backup of the live books comes back whole on another phone
    status: done
    # Proved against real files, not memory, because a restore is a file
    # swapped under a database and only a file can show the WAL left behind
    # or the old books deleted instead of kept.
    #
    # The copy is `VACUUM INTO`, one consistent snapshot: copying the file
    # would race the WAL and miss whatever today has not checkpointed. The
    # plain copy is deleted before the call returns.
    #
    # A restore is inspected before anything is replaced — decrypted to
    # scratch, `quick_check`, a schema no newer than this build, a firm row —
    # and what the shopkeeper confirms is read out of the database inside,
    # not the header. It is then staged beside the live file and swapped in
    # only at open, before anything can hold the database. The books it
    # replaces are kept as `.before-restore`, WAL and all.
    #
    # A restored phone carries on AS the phone that made the backup: the same
    # device id, the same number series. That is right when the old phone is
    # gone, which is what restore is for. Two phones writing as one would
    # collide once LAN sync lands; that is M13's to refuse, and it is noted
    # here rather than discovered there.
    proof:
      - the books come back on a phone that has never seen them
      - a restore is written into the audit trail of the books it restored
      - the books being replaced are kept, not deleted
      - the plain copy never outlives the backup
      - the shop knows when it last made a backup
      - a wrong passphrase stages nothing
      - books from a newer build are refused before anything is replaced
      - a sealed file that is not a database is refused
      - a database that is not a shop is refused
    # And on Android itself, in CI's Tier C job: the real no-backup books
    # directory, Android's SQLite writing the VACUUM INTO copy, the seal in a
    # background isolate on the device runtime, and the time it took printed
    # to the job log. An emulator is not an Android Go handset; the figure is
    # evidence, not a promise about one.
    device_proof:
      - a backup made on the phone brings the books back after a wipe

  - id: M5-BACKUP-03
    milestone: M5
    title: A shopkeeper can make a backup and bring one back, from the app
    status: done
    # Settings → Backup seals the books and hands the file to the system
    # share sheet, which is the only way "nothing leaves the phone unless you
    # send it" stays true: the app has no server and chooses no destination.
    # The passphrase is typed twice, because a typo is otherwise discovered
    # on the day the backup is needed.
    #
    # Restore is offered in three places: Settings, the setup wizard (a new
    # phone is where a lost one's backup comes back, and offering it after a
    # second shop was set up on top of nothing would be too late), and the
    # startup-failure screen, whose button finally does something. That last
    # one has no providers above it, so the restore screen takes everything
    # it needs as arguments.
    #
    # After a restore is staged the app closes the books and reopens them in
    # place — a new ProviderScope, so no provider keeps a row from the books
    # that were replaced — rather than asking a shopkeeper to kill an app on
    # a ROM where "close" means something different on every handset.
    #
    # Not proved here: the system file picker and share sheet on a handset.
    # Both are stood in for at the platform seam on the host.
    proof:
      - a backup can be reached from Settings
      - a short password is refused in words
      - two passwords that differ are refused in words
      - a backup reaches the share sheet sealed, and opens again
      - a new phone brings the books back from the setup screen
      - the wrong password is refused and nothing is staged

  - id: M5-RECYCLE-01
    milestone: M5
    title: What was hidden can be brought back, and nothing owed can be hidden
    status: done
    # Nothing in this app is deleted — six-year retention is a legal duty and
    # an old bill must keep pointing at what it sold — but hiding was one-way.
    # An archived item could only return as a second item with none of the
    # first one's history and half its stock count, and a customer could not
    # be hidden at all: the writer existed and no screen called it.
    #
    # Settings → Hidden lists both, most recently hidden first, each with a
    # Bring back button that writes ITEM_RESTORED or PARTY_RESTORED.
    #
    # The party archive guard only knew one direction of debt. It now also
    # refuses while the shop holds the party's money as an advance, or owes
    # them as a supplier: either one hidden is a liability that vanishes from
    # every screen while it is still real. The refusal is shown in the
    # editor, in the writer's own words.
    proof:
      - an archived item comes back to the counter
      - a customer can be hidden from the khata and brought back
      - a customer who still owes cannot be hidden, and is told why
      - a supplier the shop still owes cannot be hidden

  - id: M5-RETURN-04
    milestone: M5
    title: A delivery entered wrong is corrected by sending goods back
    status: done
    # The correction a delivery was missing. It cannot be voided — its cost
    # moved the average, and reversing its stock without its cost leaves the
    # average resting on goods the shop no longer has — so it is corrected
    # the way a shop really corrects one: the goods go back to the supplier.
    #
    # `returnStock` is the one movement that moves the average going out. The
    # goods leave at the landed cost they came in at and what stays is
    # re-averaged over what stays, so a whole delivery sent back puts the
    # average back where it was. The supplier credits the goods value; the
    # freight paid on goods that went back is the shop's and goes to cost of
    # goods, where a margin report can see it. Credit beyond what is still
    # owed on the delivery has to come back in cash now, the same
    # no-supplier-advance rule payments follow. Goods already sold cannot go
    # back, and a second return cannot send back more than came in.
    #
    # Driven from the purchases list: a tap on a delivery opens what can
    # still go back on it.
    proof:
      - what goes back, and at what the supplier credits the goods value, not the freight
      - what goes back, and at what the shelf gives up what the goods landed at
      - what goes back, and at what the freight on goods that went back is the shop's, in cost of goods
      - what goes back, and at what what stays is re-averaged over what stays
      - what goes back, and at what a whole delivery going back puts the average back where it was
      - what goes back, and at what an emptied shelf keeps its last average
      - when the delivery is already paid for the supplier hands the money back now
      - when the delivery is already paid for credit the delivery cannot absorb has to come back in cash
      - what a return to the supplier refuses goods that have already been sold
      - every return balances, whatever the quantity
      - torn sacks go back and what is owed on the delivery comes down
      - a whole delivery sent back puts the shelf and its cost back
      - the inventory account matches the shelf afterwards
      - a second return cannot send back more than came in
      - goods already sold cannot go back to the supplier
      - a paid-for delivery sends back cash, into the drawer
      - the supplier khata shows the return against the delivery
      - a refused return writes nothing and burns no number
      - a return to a supplier is recorded in the audit trail
      - a delivery entered wrong can be sent back from the list

  # ---- M6 · Post-dated cheques ------------------------------------------

  - id: M6-TAKE-01
    milestone: M6
    title: A cheque can be taken, at the counter or on a khata, with its date
    status: done
    # A live defect first. The counter's payment sheet offered Cheque and
    # asked for nothing, and the schema refuses a cheque with no number — so
    # every cheque sale at the counter failed with "Bill save nahi hua", and
    # nothing in the test suite had ever tried one. The khata asked for a
    # number and a bank but never the date, and a post-dated cheque without
    # its date is one nobody can bank on time or call late.
    #
    # Both now use one set of fields: number, bank, and the day it can be
    # banked, with the trade's usual terms — today, 15, 30, 45 and 60 days —
    # one tap each. The date is stored as 00:00 PKT so "due today" means the
    # shopkeeper's today whatever the phone's timezone says.
    #
    # And two rules, in the builder and on the screen: a cheque with no number
    # is refused in words before the schema has to, and a cheque from a
    # walk-in is refused outright. A cheque can bounce, a bounce reopens the
    # bill, and a reopened bill with no customer is money nobody can be asked
    # for.
    proof:
      - the day a cheque can be banked a date survives being stored, whatever side of midnight
      - the day a cheque can be banked days until it is due count calendar days, and go negative
      - a cheque at the counter goes to Cheques in Hand, not the bank
      - a cheque at the counter with no number is refused before the schema has to
      - a cheque at the counter from a walk-in is refused, since a bounce would have nobody to chase
      - a cheque sale at the counter is saved, dated for banking
      - a cheque from a walk-in is refused in words
      - a cheque with no number is refused in words
      - a cheque taken against udhaar carries its due date

  - id: M6-LIFE-01
    milestone: M6
    title: A cheque in hand can be deposited, cleared or bounced, and the books follow
    status: done
    # Before this, a cheque went into Cheques in Hand and stayed there for
    # good. There was no way to say it had cleared, so the bank balance never
    # saw the money; and no way to say it had bounced, so a customer whose
    # cheque came back read as paid.
    #
    # Deposit moves no money, only where the cheque is. Clear is Dr the bank,
    # Cr Cheques in Hand. Bounce unsettles everything the cheque settled: the
    # bills it paid are reopened by exactly what it put on them, the udhaar
    # comes back on the khata by name, and any advance it left is withdrawn,
    # so the shop is never shown holding money that never arrived. Nothing in
    # the ledger is edited; the bounce is its own entry pointing at the
    # cheque. Deposit and clear are refused before the cheque's date, because
    # no bank will take a post-dated cheque early.
    proof:
      - taken to the bank moves no money, only where the cheque is
      - taken to the bank is refused before its date, because no bank will take it
      - taken to the bank a cheque with no recorded date is not stranded
      - cleared the money moves from Cheques in Hand into the bank
      - cleared is refused before its date
      - bounced the bills it paid are owed again, for exactly what it paid
      - bounced the udhaar comes back by name, and the advance is withdrawn
      - bounced a cheque allocated beyond its amount is a corrupt record
      - a cheque cannot go to the bank before its date
      - a cleared cheque puts the money in the bank
      - a bounced cheque puts the udhaar back on the khata
      - the khata shows the cheque and then its bounce
      - a cheque cannot clear twice, or clear after it bounced
      - a cheque taken at the counter that bounces reopens the sale
      - every step is in the audit trail

  - id: M6-DRAWER-01
    milestone: M6
    title: The cheque drawer shows what is due, what is late, and what bounced
    status: done
    # A wholesaler holds dozens of post-dated cheques at once, each due on a
    # different day. The drawer lists them soonest first with how many days
    # are left or have gone by, and from each one the shop can record that it
    # went to the bank, cleared, or bounced. A bounce is listed with the date
    # by which the s.489-F notice has to go, thirty days on, because that is
    # the one deadline in a cheque's life that costs money to miss.
    proof:
      - bounced the 489-F notice date is thirty days from the bounce
      - cheques in hand are listed soonest due first
      - a bounced cheque is listed with its 489-F notice date
      - the drawer lists what is due today before what is not
      - a cheque cleared from the drawer puts the money in the bank
      - a bounced cheque reopens the khata and names the notice date
      - a post-dated cheque cannot be banked before its date

  - id: M6-ALERT-01
    milestone: M6
    title: The home screen says when a cheque is due at the bank
    status: done
    # A post-dated cheque is only good for six months from its date, and one
    # left in the drawer past its day gives the customer longer to empty the
    # account behind it. So the first screen of the morning says how many
    # have come due and not yet gone to the bank, and one tap opens the
    # drawer on them. Nothing is said about a cheque whose day has not come.
    proof:
      - the first screen says when a cheque is due at the bank

  - id: M6-NOTICE-01
    milestone: M6
    title: A bounced cheque's 489-F demand notice is drawn up from the books
    status: done
    # The bounce told the shop the date by which the notice had to go and
    # then left it to find a munshi to type one. Everything the notice says
    # is already recorded: the shop, the customer's name and address from
    # the khata, the cheque's number, bank and date, the amount in figures
    # and in words counted in lakhs and crores, the day it came back and the
    # bank's own remarks. So it is drawn up from those, set as an A4 page with
    # numbered paragraphs and a line to sign, and handed to the share sheet.
    #
    # A draft, and the screen says so: have an advocate check it before it
    # is served. The app sends nothing to anybody; the shop does.
    proof:
      - an amount in words counts in thousands, lakhs and crores
      - an amount in words says the paisa when there are any
      - an amount in words says round figures without stray words
      - an amount in words above a hundred crore the crores are counted again
      - the notice names the cheque, the bank, the date and the amount
      - the notice carries the return memo in the bank own words
      - the notice gives the drawer fifteen days to pay
      - the notice must be served within thirty days of the bounce
      - the notice leaves out what the books do not know rather than printing blanks
      - the notice addresses the drawer with what the khata holds
      - a bounced cheque draws up its demand notice from the books
      - a cheque that has not bounced has no demand notice
      - a demand notice renders as a PDF naming the cheque
      - a demand notice with an Urdu name carries the face to draw it
      - a demand notice file is named after the cheque, safely
      - a bounced cheque shares its demand notice as a PDF

  - id: M6-FLAG-01
    milestone: M6
    title: A customer whose cheque bounced is asked about before more credit
    status: done
    # The bounce put the udhaar back on the khata and changed nothing else:
    # the same customer could take another Rs 50,000 on udhaar the next
    # morning and pay with another cheque on the same account. Now, while a
    # customer has a bounced cheque and still owes, the counter stops an
    # udhaar sale or a cheque from them, says how many came back and what is
    # owed, and lets the shopkeeper go ahead by name, like the credit limit.
    # Cash is never interrupted. Paid up, and the flag lifts; the khata keeps
    # the count, quieter, for the next time they offer a cheque.
    proof:
      - udhaar for a customer whose cheque bounced is asked about
      - credit can still be given to them, knowingly
      - another cheque from them is asked about too
      - cash from them is never interrupted
      - once they have paid up they are not asked
      - the khata carries the bounce

  - id: M6-FEE-01
    milestone: M6
    title: The bank's fee on a bounced cheque is booked against the bank
    status: done
    # A bank charges the shop for a cheque it returns, and takes it from the
    # shop's account. Unrecorded, the bank balance in the books drifts off the
    # statement by a few hundred rupees a bounce. The bounce step takes the
    # fee, if there was one, and the account it came out of, and books it as
    # an expense paid from that account, naming the cheque and the customer.
    #
    # Booked as the shop's cost only. Putting it on the customer's khata is a
    # charge with no sale behind it, which needs a debit note, and debit notes
    # are sales documents: M7.
    proof:
      - the bank fee on a bounce is booked against the bank

  - id: M6-ISSUE-01
    milestone: M6
    title: The shop can pay a supplier by cheque, and follow it until the bank pays it
    status: done
    # M3 refused a cheque to a supplier and left it here: a cheque the shop
    # writes is a post-dated liability with a lifecycle of its own. In the
    # wholesale trade the shop pays the mill the way its customers pay it,
    # with a cheque dated a month ahead.
    #
    # The supplier sheet takes a cheque drawn on one of the shop's bank
    # accounts, with its number and the day it can be presented. The
    # deliveries are settled that day, as they would be on paper; the credit
    # goes to Cheques Issued, a new liability, and the money leaves the bank
    # only when the cheque is paid. A cheque the bank will not pay puts the
    # deliveries back to what they owed. The drawer lists the shop's own
    # cheques beside the customers', and the home screen warns three days
    # ahead how much the bank needs to hold for them.
    #
    # Shops set up before the account existed get it the first time it is
    # needed, in that posting's transaction and in the audit trail. And a
    # cheque the shop wrote that bounced is never shown as a 489-F case or a
    # flag against the supplier: that case, if any, is brought against the
    # shop.
    proof:
      - a cheque the shop writes settles the deliveries the day it is handed over
      - a cheque the shop writes credits Cheques Issued by name, not the bank
      - a cheque the shop writes carries its number and the day it can be presented
      - what a supplier payment refuses a cheque with no number
      - a cheque the shop wrote when it clears, the money leaves the account it was drawn on
      - a cheque the shop wrote cannot have cleared before its date
      - a cheque the shop wrote drawn on an account no longer in the books is refused
      - a cheque the shop wrote when it bounces, the deliveries it paid are owed again
      - a cheque the shop wrote a cheque not wholly on deliveries is a corrupt record
      - a cheque to a supplier settles the delivery and leaves the bank alone
      - when the supplier presents it, the money leaves the bank
      - when it bounces, the shop owes the supplier again
      - the shop bouncing its own cheque is not a 489-F case against the mill
      - a shop set up before Cheques Issued existed gets it when first needed
      - a cheque to a supplier needs its number
      - a supplier can be paid by a cheque dated ahead
      - a cheque to a supplier with no number is refused in words
      - a cheque we wrote is marked paid from the drawer
      - a cheque we wrote that bounces is owed to the supplier again
      - the first screen warns when our cheques can be presented

  # ---- M7 · Sales documents, the conversion chain and pricing -------------

  - id: M7-PRICE-01
    milestone: M7
    title: A wholesale customer is sold at the wholesale price
    status: done
    # Items have had a wholesale price since M1, set in the item editor and
    # used nowhere: the counter charged every buyer the shelf price, so a
    # wholesaler's regular retailers were overcharged unless the cashier
    # retyped every line. A party now says which price they pay (schema v4,
    # parties.price_tier, added in place with every existing party retail,
    # which is what they were charged). The customer is picked last, at the
    # payment sheet, so the lines follow them there; a price the cashier
    # typed is left exactly as typed. A cart killed mid-bill comes back with
    # its customer's prices, and one saved by the build before is read as
    # retail rather than dropped.
    proof:
      - the price a buyer pays a retail buyer pays the shelf price
      - the price a buyer pays a wholesale buyer pays the trade price
      - the price a buyer pays an item with no trade price is sold to everybody at one price
      - the price a buyer pays a tier nobody recognises is retail
      - v3 to v4 — the price a party is sold at a v3 customer comes through whole, as a retail customer
      - v3 to v4 — the price a party is sold at a price tier the counter does not know is refused
      - a wholesale customer is charged the wholesale price
      - a retail customer is charged the shelf price
      - a walk-in after a wholesale customer pays retail again
      - the cart round trip the customer prices survive it
      - the cart round trip a draft from the build before price tiers is read as retail
      - a customer is set to wholesale from the editor

  - id: M7-PRICE-02
    milestone: M7
    title: A customer's standing discount comes off every line
    status: done
    # parties.default_discount_bp has been in the schema since M0 with no
    # way to set it and nothing reading it. The party editor now takes it as
    # a percentage, and every line rung for that customer carries it unless
    # the cashier set a discount of their own.
    proof:
      - a standing discount comes off every line
      - a customer is set to wholesale from the editor

  - id: M7-PARTY-01
    milestone: M7
    title: Editing a party keeps what the form does not show, and asks for an address
    status: done
    # A live defect. The party editor sent only the name, phone and credit
    # limit, and the writer stores the whole row, so correcting a supplier's
    # phone number turned them into a customer and wiped their NTN, CNIC and
    # address. The editor now loads the party as saved and writes back
    # everything it does not show. It also asks for the address, city and
    # CNIC, which the khata had nowhere to keep and a demand notice or a
    # delivery challan needs.
    proof:
      - editing a supplier keeps them a supplier
      - a customer is set to wholesale from the editor

  - id: M7-QUOTE-01
    milestone: M7
    title: A price is given as a quotation, and the bill is made from it
    status: done
    # A wholesaler's customer asks for a price on forty cartons in the morning
    # and rings back at four to take them. The payment sheet keeps the cart
    # as a numbered quotation instead of billing it: priced by the same
    # calculator as a bill, written with its lines through the same row
    # writer, and nothing else, so no stock leaves and nothing is owed. The
    # Quotations screen shares one as a PDF titled Quotation, with the date
    # its prices hold until, and puts one on the counter at the prices
    # quoted, even if the shelf price has moved since. The bill made from it
    # is linked back (converted_from), the list says which bill it became,
    # and billing the same quotation twice is refused.
    proof:
      - a quotation is numbered and priced, and touches nothing else
      - a quotation owes nothing on the khata
      - a bill made from a quotation is linked to it
      - a quotation cannot be billed twice
      - a quotation with nothing on it is refused
      - a cart is kept as a quotation and nothing leaves the shelf
      - a quotation is billed at the price quoted
      - a billed quotation says so and cannot be billed again
      - a quotation is shared as a PDF titled Quotation

  - id: M7-CHALLAN-01
    milestone: M7
    title: Goods go out on a delivery challan, and the bill made from it later moves nothing twice
    status: done
    # The van leaves on Monday with forty cartons for a retailer billed on
    # Saturday. The payment sheet sends the cart on a numbered challan to a
    # named customer: the goods leave the shelf at the average, and their
    # cost waits in a new asset, Goods on Challan (1250, added to older
    # firms the first time it is needed), with nothing on the khata. The
    # bill made from the challan bills exactly the goods sent, to the
    # customer they went to, at whatever price is settled; it moves no stock
    # and takes the cost across from Goods on Challan to COGS at what the
    # goods left at, not at the average of the day it is billed. Goods that
    # come back cancel an unbilled challan through the ordinary void, which
    # mirrors its stock and its entry; a billed challan cannot be cancelled.
    # Partial billing of one challan, and one bill for several challans, are
    # not built: the first is the challan cancelled and sent again, the
    # second is several bills.
    proof:
      - a challan takes the goods off the shelf and owes nothing
      - a bill from a challan moves no stock and costs what the goods left at
      - a bill for other goods than the challan sent is refused
      - a challan is billed only to the customer it went to
      - a challan cannot be billed twice
      - a cancelled challan puts the goods back on the shelf
      - a billed challan cannot be cancelled
      - a challan has to name its customer
      - goods sent on a challan leave the shelf and owe nothing
      - a challan with no customer is refused in words
      - a bill made from a challan takes nothing more off the shelf
      - goods that came back cancel the challan
      - a challan is shared as a PDF titled Delivery Challan

  - id: M7-DEBIT-01
    milestone: M7
    title: A charge goes on a customer's khata without a sale, and a bounce fee goes back to who caused it
    status: done
    # A debit note. The bank's fee on a bounced cheque and the transporter's
    # fare for goods sent are owed by the customer and are not sales; until
    # now the only way to put either on a khata was a fake bill, which put a
    # bank fee in the day's takings. The khata screen takes an amount and a
    # reason; the note is an other_income document with the party on it
    # (the mirror of an unpaid expense on a supplier's side), posted Dr
    # Receivables, Cr Other Income, shown on the khata history with its
    # reason, and settled by receipts exactly as a bill is. Every customer
    # receivable query now reads it: balance, open bills, the receipt
    # allocator, aging, who to chase, and the check before a party is
    # hidden. The bounce sheet can put the bank's fee on the customer as
    # well, which M6 left here. A debit note cannot yet be cancelled.
    proof:
      - a charge is owed on the khata and is income, not a sale
      - a charge shows on the khata with its reason
      - a receipt settles a charge like a bill
      - a charge with no reason is refused
      - a charge is put on the khata from the customer screen
      - a charge with no reason is not saved
      - a bounce fee is put back on the customer who caused it

  # ---- M8 · The reports engine and the report pack ----------------------

  - id: M8-ENGINE-01
    milestone: M8
    title: The report pack is computed from the books, and a void earns nothing on it
    status: done
    # pk_reports holds each report as a pure builder over rows a
    # ReportSource reads; pk_data reads them as indexed SQL aggregates on
    # the business date. Profit and Loss, Expenses by head, the Cash Book
    # and the Day Book come off the journal, so a void, a return, a debit
    # note and an expense land where the double entry put them; Sales by
    # item comes off the posted bills and returns; Stock value puts the
    # shelf at average cost beside the Inventory balance and says when they
    # differ. Every total is on the table before a screen or an export
    # sees it.
    proof:
      - profit and loss gross and net profit come from the ledger
      - profit and loss a discount given reads as a reduction of sales
      - profit and loss a month that lost money says so
      - expenses by head largest first, with each head as a share, and no cost of goods
      - cash book runs from the opening balance to the closing one
      - day book lists every entry and counts them
      - sales by item returns come off, and the best seller is first
      - stock value values the shelf at average cost beside the books
      - periods a month ends on its last day, February included
      - periods the fiscal year runs July to June
      - periods a row that does not fit its columns is refused
      - profit and loss ties to the postings, and a void earns nothing
      - the cash book closes on the cash in the books
      - the day book lists every entry, the reversal included
      - sales by item counts only bills that stand
      - expenses by head shows the rent
      - stock value reads the shelf and the books

  - id: M8-CSV-01
    milestone: M8
    title: A report goes to the accountant as a spreadsheet that adds up
    status: done
    # pk_export writes a finished table as CSV: money as plain numbers with
    # two places so a spreadsheet's SUM agrees with the report's total, a
    # byte-order mark so Excel keeps Urdu names, and a text cell that starts
    # like a formula written as text.
    proof:
      - csv money is a plain number a spreadsheet can add up
      - csv a name that looks like a formula stays text
      - csv the notes come after the table
      - csv the file opens in Excel with Urdu intact
      - csv the file is named for the report and its dates

  - id: M8-SCREEN-01
    milestone: M8
    title: The owner reads the report pack on the phone and sends it on
    status: done
    # A Report tile on the first screen opens the six reports, each for
    # today, this month, last month or this fiscal year (stock value is as
    # of now). The screen lays the finished table out, totals in bold and
    # losses in red, with the report's notes under it, and sends it as a CSV
    # through the share sheet. It adds nothing up itself.
    proof:
      - this month's profit is on the phone
      - last month shows nothing earned this month
      - a report goes out as a CSV the accountant can open
      - stock value is as of now and lists the shelf

  - id: M8-DAYS-01
    milestone: M8
    title: Each day's selling, and who owes and for how long, on one page each
    status: done
    # Sales by day lists every day of the period with its bills, sales,
    # returns, what was paid at the counter and what went on udhaar. Udhaar
    # by age splits every customer's balance into the opening balance, open
    # bills and charges by 0-30, 31-60, 61-90 and over 90 days, less any
    # advance, so each row ends on the figure on that customer's khata.
    proof:
      - sales by day each day in date order, and the period summed
      - udhaar by age the oldest money first, and each owed matches the khata
      - sales by day counts the bill that stands
      - udhaar by age owes what the khata says
      - udhaar by age is as of now and lists who owes
      - sales by day shows the day the bill was rung

  - id: M8-PDF-01
    milestone: M8
    title: A report goes out as a PDF for WhatsApp or the printer
    status: done
    # Most figures in this market travel as a picture or a PDF on WhatsApp,
    # not as a spreadsheet. pk_export sets the finished table on an A4 page
    # (landscape when it is wide) headed with the shop's name, the report
    # and the period, with page numbers, the Urdu font as a fallback so a
    # name in Urdu survives, and the notes under the table.
    proof:
      - pdf a report is a page headed with the shop and the period
      - pdf the file is named for the report and its dates
      - a report goes out as a PDF headed with the shop

  - id: M8-PAY-01
    milestone: M8
    title: What the shop owes each supplier, and for how long
    status: done
    # The other side of udhaar by age: every delivery and expense left on a
    # supplier's account, split 0-30, 31-60, 61-90 and over 90 days from its
    # date, so the owner sees which mill has waited longest before it stops
    # sending goods on credit.
    proof:
      - owed to suppliers the same ageing, headed for suppliers
      - owed to suppliers shows the bill left on account
      - what is owed to suppliers is on its own page

  # ---- M9 · Multi-user, roles, audit and entitlement --------------------

  - id: M9-ROLES-01
    milestone: M9
    title: Each role is allowed what its work needs, and the owner everything
    status: done
    # pk_domain/entitlement names what can be allowed and what each of the
    # four roles the schema has carried since M0 is allowed: the owner
    # everything; a manager the shop but not staff, backups or settings; an
    # accountant the books but not the counter's cancellations; a cashier
    # the counter, payments and the day's cash. A role this build does not
    # know is read as a cashier, never as more.
    proof:
      - roles the owner can do everything
      - roles a cashier sells and takes money, and nothing else
      - roles only the owner manages staff, backups and settings
      - roles an accountant keeps the books but does not work the counter
      - roles a role nobody knows is not read as any role

  - id: M9-STAFF-01
    milestone: M9
    title: The owner adds staff, each with their own PIN, and every change is in the log
    status: done
    # Settings has Staff and PINs for the owner: their own PIN first, then
    # staff with a name, a role and a PIN of their own, entered twice. A PIN
    # is kept as an Argon2id hash with its own salt, never the digits. Roles
    # can be changed and staff let go; the owner's role cannot be given or
    # taken, and there is only one. Every change goes through the one write
    # path and leaves an audit row under the owner's name.
    proof:
      - pin the right PIN is accepted and a wrong one is not
      - pin the digits are never what is stored
      - pin a PIN is four to six digits
      - a cashier is added with the role on their row
      - every change to staff is in the audit log under the owner
      - there is one owner, and nobody takes the role away
      - staff staff cannot be added before the owner has a PIN
      - the owner sets a PIN and adds a cashier from settings
      - two PINs that differ are refused in words

  - id: M9-SIGNIN-01
    milestone: M9
    title: The app locks, opens only for the right PIN, and whatever is done is done in that person's name
    status: done
    # A shop where anybody has a PIN opens on Who is it?, and the home
    # screen can be locked. The right PIN signs that person in, stamps the
    # sign-in on their row and in the log, and every row written from then
    # on carries them. Five wrong PINs in a row stop sign-in for thirty
    # seconds, and staff who have been let go cannot sign in. A shop with no
    # PINs opens straight to the owner, as it always did.
    proof:
      - a sign-in is stamped on the user and in the log
      - staff a shop with no PINs opens straight to the owner
      - staff a cashier signs in with their own PIN and not a wrong one
      - staff five wrong PINs block sign-in for a while
      - staff staff who have left cannot sign in
      - staff the sale a cashier rings is theirs in the books
      - a locked app opens only for the right PIN

  - id: M9-GATE-01
    milestone: M9
    title: What a role may not do is refused at the service, and not offered on screen
    status: done
    # AppServices refuses before building the use case: cancelling a bill,
    # purchases and paying suppliers, expenses, cheques, the reports, returns,
    # backups and shop settings each need their permission, so a screen
    # that forgot to hide a button still cannot do the work. The screens
    # hide what the signed-in role cannot use: the home tiles, the Settings
    # rows, and cancel and return on a bill.
    proof:
      - staff a cashier rings bills but cannot cancel one or read the reports
      - a cashier sees the counter and not the owner's screens

  - id: M9-CLOSE-01
    milestone: M9
    title: The day is closed by counting the drawer against the books
    status: done
    # The screen shows what the books say is in the golak (Cash in Hand and
    # every cash tender's account, the Cash Book's accounts), takes what was
    # counted, and says as it is typed whether the drawer is short or over.
    # Closing reads the expected figure again inside the write, books any
    # difference to a new Cash Short and Over account (6800, added to older
    # firms when first needed) so the books then agree with the drawer, and
    # leaves a DAY_CLOSED line naming who counted, what, and why it differed.
    proof:
      - a drawer that matches the books writes nothing but the close
      - a short drawer is booked as a shortage, and the books then agree
      - a drawer over the books is booked the other way
      - a drawer cannot be counted below nothing
      - a short drawer is closed, and the books then agree with it

  - id: M9-AUDIT-01
    milestone: M9
    title: The owner reads who did what, and when, for everyone or one person
    status: done
    # Every write since M0 has left an audit row; Settings now shows them,
    # newest first, each with the person and the shop's own date and time,
    # filtered to one member of staff with a tap. Owner, manager and
    # accountant only.
    proof:
      - the activity log names who did what, newest first
      - the activity log says who did what

  # ---- M10 · Multi-firm and full accounting ------------------------------

  - id: M10-OPEN-01
    milestone: M10
    title: What the shop had on its first day is in the books
    status: done
    # A live defect found building the balance sheet. Opening stock was a
    # stock-ledger row and a customer's opening balance a column on the
    # party, and neither ever reached the journal: Inventory and Receivables
    # in the books left them out, so no balance sheet could agree with the
    # shelf or the khata. Each is now posted against a new equity account,
    # Opening Balances (3050), when it is entered, and the app posts the ones
    # entered before, once, the next time it opens.
    proof:
      - opening stock is in Inventory at what it cost
      - what a customer already owed is in Receivables
      - openings entered before are posted once, and only once

  - id: M10-TB-01
    milestone: M10
    title: The trial balance and the balance sheet, read from the books
    status: done
    # Two more reports in the pack, as of today. The trial balance puts every
    # account on its side and says the sides agree, or by how much they do
    # not. The balance sheet sets what the shop has against what it owes and
    # what is the owner's, with profit to date on its own line until a year
    # is closed into capital, and says whether the two sides meet.
    proof:
      - trial balance each account on its side, and the two sides agree
      - balance sheet what the shop has equals what it owes and what is the owner's
      - the trial balance agrees and the balance sheet balances
      - the balance sheet balances on the phone

  - id: M10-JV-01
    milestone: M10
    title: The accountant writes a journal voucher by hand
    status: done
    # Capital brought in, drawings, a bank's charge, cash banked: a reason
    # and two or more lines that agree to the paisa. Accounts with a book of
    # their own beneath them (the khatas, the shelf, the cheque and challan
    # accounts) are refused, by key in the builder and by id in the writer,
    # because a hand entry there moves the total without the book under it.
    # Owner and accountant only.
    proof:
      - the owner puts money into the shop, and the chart shows it
      - a voucher that does not balance is refused
      - a voucher cannot touch an account with a book beneath it
      - a voucher says what it is for and has two lines
      - a voucher moves cash from the drawer to the bank
      - a voucher that does not agree is refused in words

  - id: M10-CHART-01
    milestone: M10
    title: Every account with its balance, and every entry that moved one
    status: done
    # Hisaab kitaab on the first screen lists the chart grouped as the books
    # group it, each balance on its own side, and opens any account on every
    # entry that moved it with the balance after each.
    proof:
      - an account shows every entry that moved it

  - id: M10-FIRMS-01
    milestone: M10
    title: One phone keeps the books of more than one firm, each apart
    status: done
    # A trader with a retail shop and a wholesale agency next door. The
    # owner adds a firm from Settings; it gets its own chart, numbering,
    # khatas, staff and a registration of this phone of its own, in the same
    # database and the same backup. Opening another firm switches every
    # query and every write to it at once, clears the bill half-rung in the
    # other, and opens on that firm's sign-in when anybody there has a PIN.
    # The phone reopens on the firm it last had open. Owner only.
    proof:
      - firms a second firm is added and the phone stays on the first
      - firms each firm keeps its own khatas
      - firms only the owner adds or switches firms
      - firms the phone reopens on the firm it last had open
      - a second firm is added and opened, with its own khatas

  # ---- M11 · Batches, serials, godowns and the pharmacy vertical ---------

  - id: M11-BATCH-01
    milestone: M11
    title: Medicines are bought by batch and expiry, and sold first-expiry-first-out, never expired
    status: done
    # An item can be kept by batch. A delivery line then carries the batch
    # printed on the goods and its expiry, and the stock goes into that
    # batch. The counter takes the batch that expires first, then the next,
    # and refuses when only an expired batch could make up the quantity,
    # naming it, or when one is picked by hand; stock that was never put in
    # a batch goes after every batch.
    proof:
      - fefo the batch that expires first goes first
      - fefo an expired batch is never taken, and the sale is refused
      - fefo stock in no batch goes after every batch
      - fefo a batch expiring today can still be sold today
      - a delivery keeps each batch with its expiry
      - the counter sells the batch that expires first
      - an expired batch is not sold
      - an expired batch cannot be sold even when picked by hand
      - a delivery keeps the batch and expiry the pack says

  - id: M11-SERIAL-01
    milestone: M11
    title: Phones are bought and sold by IMEI, each one once
    status: done
    # An item can be kept by serial. A delivery names one IMEI per piece,
    # each its own lot, and refuses a count that does not match or the same
    # IMEI twice. At the counter the IMEI is scanned or typed, which puts
    # that phone on the bill; the item cannot be added without one, the same
    # phone cannot go on the bill twice, and a sold phone is no longer found.
    proof:
      - a phone comes in by IMEI and goes out by the one scanned
      - a delivery of phones names one IMEI per phone
      - a phone is found at the counter by its IMEI
      - a phone is sold by its IMEI, and only once

  - id: M11-GODOWN-01
    milestone: M11
    title: Goods move between the shop floor and a godown, batch and all
    status: done
    # From the item, Where it is shows the stock at each place and each
    # batch or serial on hand, and moves goods from one place to another as
    # a transfer out and a transfer in, batch by batch, refusing more than
    # is there. Nothing is bought or sold, so the books do not move.
    proof:
      - goods moved to the godown leave the shop floor, batch and all
      - more than is there cannot be moved
      - goods are moved to the godown from the item

  - id: M11-GS1-01
    milestone: M11
    title: A pack's GS1 code is read for its product, batch and expiry
    status: done
    # pk_domain/barcode reads GS1 element strings, raw or in brackets, with
    # or without the scanner's symbology prefix: the GTIN, the batch, the
    # expiry (day 00 as the end of the month) and the serial. At the counter
    # the product is found by its GTIN and a pack past its date is stopped at
    # the scan; at the door, scanning the pack into the batch field fills the
    # batch and the expiry.
    proof:
      - gs1 a medicine pack gives its product, batch and expiry
      - gs1 a label printed for people is read the same
      - gs1 the scanner prefix is dropped
      - gs1 an ordinary barcode or an IMEI is not GS1
      - a pack scanned past its date is stopped at the counter
      - a pack in date is scanned onto the bill by its GS1 code

  - id: M11-EXPIRY-01
    milestone: M11
    title: The expiry list says what to pull off the shelf
    status: done
    # A report in the pack: every batch past its date or within ninety days
    # of it, soonest first, with days left, quantity and what it cost, and a
    # note of how much is already past its date.
    proof:
      - expiry expired and soon-to-expire batches, soonest first
      - the expiry list shows what to pull off the shelf

  # ---------------------------------------------------------------------------
  # M12 — the Pakistan tax pack
  # ---------------------------------------------------------------------------

  - id: M12-ENGINE-01
    milestone: M12
    title: The 2026-27 pack works out sales tax and further tax on each line
    status: done
    # pk_domain/tax/pack is a TaxEngine with its rule version stamped on
    # every bill. The calculator takes tax out of the price when it is
    # already inside, so the sale is credited without it.
    proof:
      - pakistan tax an unregistered shop charges no tax at all
      - pakistan tax a registered shop adds 18% to a price without tax
      - pakistan tax a price that includes tax has the 18% taken out of it
      - pakistan tax third schedule goods carry the tax inside the retail price
      - pakistan tax further tax is charged to a named buyer who is not registered
      - pakistan tax a registered buyer off the active list still pays further tax
      - pakistan tax an active registered buyer, a walk-in and third schedule goods pay none
      - pakistan tax exempt and zero-rated goods carry no sales tax
      - a registered sale to an unregistered business owes both taxes
      - prices that include tax credit sales without the tax
      - an unregistered shop charges no tax under the same pack

  - id: M12-RETURN-01
    milestone: M12
    title: A return gives back the tax on what came back
    status: done
    # Each returned line carries its share of the sales and further tax,
    # debited back to what the shop owes FBR. Found on the way: returns had
    # been dropping the unit of a line sold without one.
    proof:
      - a return gives back the tax on what came back

  - id: M12-REPORT-01
    milestone: M12
    title: The sales tax summary and Tajir Dost are in the report pack
    status: done
    proof:
      - tax the sales tax summary nets what returns gave back
      - tax Tajir Dost is one per cent of each month

  - id: M12-SCREEN-01
    milestone: M12
    title: The shop turns tax on from the phone, and the counter charges it
    status: done
    # Settings, Tax: registered or not, prices with tax inside or not, and
    # this month's Tajir Dost less the tax taken on the electricity bill. A
    # party is marked registered and on the active list from its editor, and
