  - id: M2-BT-01
    milestone: M2
    title: Bluetooth SPP reaches a battery printer without asking for location
    status: done
    # The plugin shipped with full JUnit scaffolding, mockito, verbose test
    # logging -- and zero tests. Worse than zero: useJUnitPlatform() was
    # configured with no engine on the test runtime classpath, so the Gradle
    # task ran nothing and reported success. A green tick over an empty room.
    #
    # Nine Kotlin tests now cover PacedWriter (chunking, pacing, and the
    # bytes-written contract), and `melos run android` asserts the JUnit XML
    # reports MORE THAN ZERO tests rather than trusting the exit code. The
    # Dart proofs below cover the seam no Kotlin test can reach.
    #
    # Writing them found a live inversion. The PlatformException handler read
    # `error.details is int ? ... : 0`, so a platform error carrying no byte
    # count reported zero bytes written -- which reads as "nothing came out,
    # retry freely". The comment directly above it warned that losing that
    # number "would turn every failure into safe to retry, which is how a
    # flaky link produces two of every long bill". The comment described the
    # danger and the code did the thing. Absent is not zero.
    proof:
      - what the platform says it can do no radio and no permission both read as unavailable
      - what the platform says it can do a platform that throws is unavailable, not a crash
      - what the platform says it can do permission is asked about separately from the radio
      - finding a printer everything paired is offered, whatever it calls itself
      - finding a printer nothing paired is an empty list, not an error
      - finding a printer a device with no name is offered by its address
      - sending a receipt the pacing settings reach the platform
      - sending a receipt how much paper moved survives the trip back
      - sending a receipt nothing written is safe to try again
      - sending a receipt a failure that says nothing about paper is treated as though it moved
      - sending a receipt a missing plugin is also treated as though paper moved
      - sending a receipt a permission refusal names the permission, not a stack trace
      - Bluetooth is asked for by the plugin that uses it
      - scanning is declared as never being about location
      - the legacy Bluetooth pair stop at Android 11

  - id: M2-USB-01
    milestone: M2
    title: The printer already cabled to the counter prints
    status: done
    # The third transport, and the shape most Pakistani shop counters actually
    # have: an 80mm thermal unit on a USB lead at six to twelve thousand
    # rupees. The Bluetooth one is what a delivery man carries; the LAN one is
    # how a counter and a back office share a machine. Without this a shop is
    # asked to buy a second printer in order to use the app.
    #
    # Two things cost real time to get right.
    #
    # These devices enumerate as USB PRINTER CLASS (0x07), not CDC serial.
    # Every usb_serial package looks for 0x02/0x0A, finds nothing, and reports
    # no device attached against a printer that is plainly plugged in and lit.
    #
    # And `bulkTransfer` returns the count it ACTUALLY moved, routinely less
    # than it was offered. Trusting the request size drops the remainder, and
    # the remainder at the end of a receipt is the cut command -- so the
    # symptom is a bill that prints perfectly and never cuts, on some
    # printers, some of the time. `a short transfer is resumed, not treated as
    # a whole chunk` is the Kotlin test that holds that line.
    #
    # It needs no manifest permission at all: USB access is granted per device
    # by the system at the moment of use. That makes it the best privacy story
    # of the three transports.
    proof:
      - it is its own transport kind, not the Bluetooth one
      - a phone without OTG says so instead of failing at print time
      - a platform that does not answer is unavailable, not a crash
      - a plugged-in printer is offered, with whether it is ready
      - nothing plugged in is an empty list, not an error
      - the bytes and the pacing reach the platform
      - it does not answer the Bluetooth methods
      - how much paper moved survives the trip back
      - nothing written is safe to try again
      - an error with no byte count is treated as though paper moved
      - a refused permission is reported in words a shopkeeper can act on

