    status: done
    proof:
      - the home screen renders on a shop with no sales at all
      - every empty state renders in the list it lives in
      - the counter is usable with an empty catalogue

  - id: M0-UI-07
    milestone: M0
    title: Text scales to 200% without clipping a row
    status: done
    proof:
