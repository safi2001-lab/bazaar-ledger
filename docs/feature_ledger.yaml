# The anti-lie gate.
#
# One row per feature. A row may say `status: done` only if `proof` names a
# test that exists, is not skipped, and passed in the run that checked it.
# `dart run tool/verify_ledger.dart` runs every suite and fails the build if
# any claim is unsupported.
#
# The rule this exists to enforce: a commit may not say "Complete Milestone N"
# unless this script printed 100% for N. The previous build shipped five
# commits each announcing a completed sprint; an audit later put the real
# figure at about 18%, and this script would have printed that number and
# rejected every one of them.
#
# `proof` values are test names exactly as the JSON reporter emits them:
# group description and test description joined by a space.
#
# status: done | wip | todo
#
# ---------------------------------------------------------------------------
# Why `milestones:` exists.
#
# For several weeks every one of the fifty rows below said `milestone: M0`, and
# verify_ledger scored only the milestones that had rows. M1 through M14 had no
# denominator, were never printed, and could not fail. Eight commits announcing
# M1 and M2 work passed a gate that was never asked the question.
#
# Declaring every milestone up front is what fixes that. A milestone with no
# rows now prints as a dash and, once it is `open`, fails the build outright.
# The gate can finally contradict a commit message.
#
# state:  planned  declared, not started. Its files may not be touched yet.
#         open     being built. Must have rows; its percentage is real.
#         sealed   finished. Still touchable for fixes; still measured.
#
# owns:   path globs. The longest matching pattern wins, so `packages/**` under
#         M0 is a catch-all that any later milestone overrides for its own
#         area. This is what stops M7 code being written during M2.
# ---------------------------------------------------------------------------

milestones:
  - id: M0
    title: The walking skeleton — one real sale
    state: sealed
    owns:
      - packages/**
      - lib/**

  - id: M1
    title: Catalogue and stock truth
    # Sealed on 24 Aug 2026 at 20/20, with every proof passing in the run that
    # checked it. Sealed does not mean untouchable -- a fix to an M1 file is
    # ordinary -- it means the milestone is measured and complete, and R5 will
    # now refuse a commit that claims it is not.
    state: sealed
    owns:
      - lib/features/items/**
      - packages/pk_domain/lib/src/catalogue/**

  - id: M2
    title: A receipt reaches paper, once, on hardware a shop owns
    # Sealed 27 Sep 2026 at 20/20, the last row on the virtual printer by the
    # owner's decision (see M2-RUN-01 for what that proves and what it does
    # not). Nothing has yet been printed on a physical machine.
    state: sealed
    owns:
      - packages/pk_platform/**
      - packages/pk_printer_android/**
      - lib/features/printing/**
      - lib/features/scan/**

  - id: M3
    title: Parties, udhaar and money in and out
    # Opened 24 Aug 2026. The reason the app exists: a kiryana shop's book of
    # who owes what is the thing it keeps on paper today, and the thing it
    # would actually pay to stop keeping on paper.
    #
    # Sealed 26 Sep 2026 at 14/14. Money comes in against udhaar and goes out
    # to suppliers and as expenses, each from a screen and each proved by
    # driving it; the two doc_type defects that let a customer's money land
    # on the shop's own purchase bills were found and closed on the way.
    state: sealed
    owns:
      - lib/features/khata/**
      - lib/features/expenses/**
      - packages/pk_domain/lib/src/receivables/**

  - id: M4
    title: Purchases and cost truth
    # Opened 24 Aug 2026. `avg_cost_milli_paisa` is written once at item
    # creation and never moves, so until this milestone lands every margin
    # figure in the app is a guess.
    #
    # Sealed 26 Sep 2026 at 5/5. The average moves with every delivery, the
    # screen shows where each line leaves it before Save, and a delivery can
    # be found again by the supplier's own bill number. Correcting a delivery
    # entered wrong is a correction, and waits in M5.
    state: sealed
    owns:
      - lib/features/purchases/**
      - packages/pk_domain/lib/src/costing/**

  - id: M5
    title: Corrections, returns and data safety
    # Opened 24 Aug 2026. A shop that cannot fix a mistake has a permanent
    # wrong number in its books, and the wrong number is the one an auditor
    # finds.
    #
    # Sealed 26 Sep 2026 at 11/11. A sale is voided or returned, a delivery
    # is corrected by sending goods back, the books are backed up sealed and
    # brought back on another phone, and nothing hidden is lost.
    #
    # Encryption of the live database at rest was planned here and moved to
    # M14 by the owner's decision, not dropped. Both native SQLite packages
    # this build can link are end-of-life, so doing it properly starts with
    # moving the data layer to sqlite3 3.x, and SQLCipher lands in an APK
    # already at 27 of its 30 MB. That is launch hardening, where the size
    # budget is managed. Until then the books are protected by Android's app
    # sandbox and the no-backup directory, and every backup that leaves the
    # phone is encrypted.
    state: sealed
    owns:
      - lib/features/backup/**
      - lib/features/recycle/**
      - packages/pk_domain/lib/src/corrections/**
      - packages/pk_platform/lib/src/backup/**
      - packages/pk_bootstrap/lib/src/backup_service.dart

  - id: M6
    title: Post-dated cheques
    # Opened 26 Sep 2026. In the wholesale markets this is built for, most of
    # the volume is settled by cheques dated fifteen to sixty days ahead. A
    # cheque is a promise with a date on it, and it can bounce: until it
    # clears it is not money in the bank, and until the shop can see which
    # cheques are due, which are late and which bounced, it cannot chase any
    # of them.
    #
    # Sealed 26 Sep 2026 at 8/8. A cheque is taken with its date at the
    # counter or on a khata, sits in a drawer that lists what is due and
    # says so on the home screen, and is banked, cleared or bounced from
    # there. A bounce reopens exactly what the cheque paid, books the bank's
    # fee, asks before the same customer gets more credit, and draws up the
    # 489-F demand notice. The shop's own cheques to suppliers have the same
    # life on the other side of the books, with a warning before they can be
    # presented.
    #
    # Not built here, and said so: recharging a bounce fee to the customer
    # needs a debit note (M7); the research notes also mention pre-filling an
    # Order XXXVII summary suit, which the plan never scheduled and which is
    # an advocate's drafting, not a shop's.
    state: sealed
    owns:
      - lib/features/cheques/**
      - packages/pk_domain/lib/src/cheques/**
      - packages/pk_platform/lib/src/cheques/**

  - id: M7
    title: Sales documents, the conversion chain and pricing
    # Opened 26 Sep 2026, pricing first: items had carried a wholesale price
    # since M1 and parties a standing discount, and the counter used neither.
    #
    # Sealed 26 Sep 2026 at 7/7. A customer is charged their own price and
    # discount; a price is given as a quotation and billed from later; goods
    # go out on a challan and are billed from it without leaving the shelf
    # twice; and a charge that is not a sale goes on the khata as a debit
    # note. Not built, and said here rather than left to be discovered: a
    # sale order as a document of its own (a quotation the customer has
    # accepted is billed or sent on a challan directly), a proforma invoice,
    # a challan made from a quotation, billing part of a challan or several
    # challans on one bill, and cancelling a debit note.
    state: sealed
    owns:
      - lib/features/documents/**
      - packages/pk_domain/lib/src/documents/**
      - packages/pk_domain/lib/src/pricing/**

  - id: M8
    title: The reports engine and the report pack
    # Opened 26 Sep 2026. Every figure the app showed was a day's takings or
    # one party's balance; the question a shop owner asks at the end of the
    # month -- did I make money, and where did it go -- had no answer on the
    # phone at all.
    #
    # Sealed 26 Sep 2026 at 7/7. Nine reports, each a pure builder over
    # indexed aggregates, read on the phone for a chosen period and sent on
    # as a CSV or a PDF: Profit and Loss, Sales by day, Sales by item,
    # Expenses by head, the Cash Book, the Day Book, Stock value, Udhaar by
    # age and Owed to suppliers. Not in this pack, and owned elsewhere: the
    # Trial Balance and Balance Sheet (M10, with the rest of full
    # accounting), and every tax report including the Tajir Dost 1% ledger
    # (M12). Not built at all yet: a purchase register, and a single
    # customer's statement as a PDF (the khata screen shows the history).
    state: sealed
    owns:
      - packages/pk_reports/**
      - packages/pk_export/**
      - lib/features/reports/**

  - id: M9
    title: Multi-user, roles, audit and entitlement
    # Opened 26 Sep 2026. Every row since M0 has carried the user who wrote
    # it, and it has always been the owner: there was no way to add anybody
    # else, so the counter boy rang bills as the owner and could cancel them,
    # read what the goods cost, or restore a backup over the day's books.
    #
    # Sealed 26 Sep 2026 at 6/6. Roles, staff with their own PINs, sign-in
    # and a lock, refusals at the service, the activity log and the day
    # close. Not built, and said here: the subscription plans (built in
    # M21); and the discount ceiling each role carries on its row is not yet
    # checked at the counter.
    state: sealed
    owns:
      - lib/features/users/**
      - lib/features/audit/**
      - lib/features/day_close/**
      - packages/pk_domain/lib/src/entitlement/roles.dart
      - packages/pk_domain/lib/src/entitlement/staff.dart
      - packages/pk_domain/lib/src/entitlement/activity.dart

  - id: M10
    title: Multi-firm and full accounting
    # Opened 26 Sep 2026. The double entry has been complete under every
    # screen since M0, and nothing let anybody read it as books: no chart
    # with balances, no trial balance, no balance sheet, no way to write the
    # owner's own money in or out.
    #
    # Sealed 26 Sep 2026 at 6/6. Openings are in the books, the trial balance
    # and balance sheet are in the report pack, the chart and every account's
    # entries are on the phone, vouchers are written by hand, and one phone
    # keeps more than one firm. Not built: closing a year into retained
    # earnings (the balance sheet shows profit to date instead), accounts of
    # the shop's own beyond the shipped chart, and a firm's books
    # consolidated with another's.
    state: sealed
    owns:
      - lib/features/accounting/**
      - lib/features/firms/**

  - id: M11
    title: Batches, serials, godowns and the pharmacy vertical
    # Opened and sealed 26 Sep 2026 at 5/5. stock_lots and the lot and
    # location columns on the stock ledger had been in the schema since M0
    # with nothing writing them. A pharmacy now buys by batch and expiry,
    # sells the batch that expires first and never an expired one; a mobile
    # shop buys and sells phones by IMEI; goods move to a godown and back;
    # a pack's GS1 code is read at the counter and at the door; and the
    # expiry list says what to pull off the shelf. Not built: a return from
    # a customer or to a supplier going back into the batch it came from
    # (returns land in no batch), drug schedules and prescriptions, and
    # selling straight from a godown rather than the shop floor.
    state: sealed
    owns:
      - lib/features/batches/**
      - packages/pk_domain/lib/src/stock/**
      - packages/pk_domain/lib/src/barcode/**

  - id: M12
    title: The Pakistan tax pack, computed locally and never transmitted
    # Opened and sealed 27 Sep 2026 at 4/4. The engine had been a zero-rate
    # stub since M0. The pack for 2026-27 now charges 18% sales tax, takes
    # it out of prices that include it and out of Third Schedule retail
    # prices, adds 4% further tax for a named buyer who is unregistered or
    # off the active list, and charges nothing for an unregistered shop.
    # Returns give the tax back, the sales tax summary nets it, Tajir Dost
    # is worked out each month, and paying a supplier more than Rs 50,000
    # in cash warns of section 73. Nothing is sent to FBR. Not built: FBR
    # POS integration, withholding on a distributor's bills, provincial
    # sales tax on services, and the annex-C schedule a registered shop
    # files.
    state: sealed
    owns:
      - lib/features/tax/**
      - packages/pk_domain/lib/src/tax/pack/**

  - id: M13
    title: LAN multi-counter sync over the shop's own wi-fi
    # Opened and sealed 27 Sep 2026 at 4/4. The outbox format had been in
    # the schema since M0 with nothing reading it. A master now serves the
    # counters over plain HTTP on the shop's wi-fi; a counter joins once
    # with the code the master shows, receives the whole shop, prints bills
    # under its own letter, and syncs every half minute. Rows merge last
    # writer wins by HLC, the ledgers are append-only so no sale or stock
    # movement is merged away, and the stock balances are rebuilt from the
    # whole ledger after each merge. Not built: finding the master without
    # typing its address (mDNS), encrypting the traffic, counter-to-counter
    # sync without the master, merging an edit column by column rather than
    # row by row, and a screen for resolving a clash (they are counted, and
    # kept under a marked name).
    state: sealed
    owns:
      - lib/features/sync/**
      - packages/pk_sync/**
      - packages/pk_data/lib/src/sync/**
      - packages/pk_bootstrap/lib/src/sync_services.dart

  - id: M14
    title: Launch hardening and Excel import
    # Also owns encryption of the live database at rest, moved here from M5
    # on 26 Sep 2026: it needs the data layer on sqlite3 3.x first (the 2.x
    # native packages are end-of-life) and it spends APK size this milestone
    # is where the budget is managed.
    #
    # Opened and sealed 27 Sep 2026 at 3/3. The data layer is on drift 2.35
    # and sqlite3 3.5, which bundles SQLite3 Multiple Ciphers through a build
    # hook in place of the end-of-life sqlite3_flutter_libs. The books are
    # encrypted at rest under a random key sealed by the Android Keystore,
    # books kept in the clear before are encrypted at the next open, and a
    # backup still opens on a phone that never had the key. Item lists and
    # khatas come in from .xlsx or .csv. Errors nothing caught are kept on
    # the phone and shown in Data Health. Not built: old binary .xls files,
    # a supplier's opening balance from a sheet (it is said, and left for a
    # purchase bill), sqlite3 3.6 (it needs a newer Flutter SDK than
    # 3.44's), and the APK size measured on this change — Tier B measures
    # it on the next signed build.
    state: sealed
    owns:
      - lib/features/import/**
      - packages/pk_bootstrap/lib/src/encrypted_database.dart
      - packages/pk_bootstrap/lib/src/import_services.dart
      - packages/pk_bootstrap/lib/src/crash_journal.dart
      - packages/pk_import/**
      - android/app/src/main/kotlin/**

  - id: M15
    title: A VIP price, the third price a buyer can be sold at
    # Opened and sealed 30 Sep 2026 at 1/1. The plan document's price lists
    # named three tiers and the app had two. Items carry a VIP price, a party
    # is marked VIP, and the counter charges it, falling back to wholesale
    # and then retail where an item has no VIP price. Schema v5: items gains
    # its column in place, parties is rebuilt to widen its CHECK.
    # Its files are M7's (pricing) and M1's (items, parties); it owns none.
    state: sealed
    owns: []

  - id: M16
    title: A weighing scale's label rings up the item and its weight or price
    # Opened and sealed 30 Sep 2026 at 1/1. Scales print EAN-13 labels in the
    # 20–29 range carrying the item's PLU and a weight or a price. The shop
    # says which prefix means which, and how many digits the PLU has; the
    # counter finds the item by its own code and rings up the weight, or the
    # quantity the printed price buys, to the gram. A torn label (bad check
    # digit) is not read. Not built: a scale connected by cable, and labels
    # that carry both a weight and a price.
    state: sealed
    owns:
      - lib/features/scale/**
      - packages/pk_domain/lib/src/barcode/scale.dart

  - id: M17
    title: Making things — bills of materials and production runs
    # Opened and sealed 30 Sep 2026 at 1/1. A recipe says what one batch of a
    # finished item takes and what the work costs on top; a production run
    # takes the components off the shelf at their average cost, puts the
    # finished goods on it at that cost plus the work, and moves the finished
    # item's average as a delivery would. Only the work is new value, booked
    # to Inventory against Production Costs Absorbed (6850). Schema v6 adds
    # boms, bom_lines and assemblies. Not built: components or finished goods
    # kept by batch or serial (refused in words), making in a godown rather
    # than on the shop floor, undoing a run, and by-products.
    state: sealed
    owns:
      - lib/features/manufacturing/**
      - packages/pk_domain/lib/src/manufacturing/**
      - packages/pk_data/lib/src/write/drift_manufacturing_writer.dart
      - packages/pk_data/lib/src/db/tables/manufacturing.drift

  - id: M18
    title: Van sales — loading, selling from the van, and settling the rider
    # Opened and sealed 30 Sep 2026 at 1/1. A van is a stock location with a
    # rider. Goods are loaded onto it as a transfer; a phone set to the van
    # sells from its stock, and each sale records where it left from; the
    # rider's cash is settled once a day against what the van's cash sales
    # took, any short or over booked to Cash Short and Over, and what was
    # not sold goes back to the shop floor batch by batch. Schema v7 adds
    # vans, van_settlements and documents.location_code. Not built: routes
    # and stops, credit sales collected on the round (the khata handles
    # them as any udhaar), returns going back onto the van, and settling a
    # day other than today.
    state: sealed
    owns:
      - lib/features/vans/**
      - packages/pk_domain/lib/src/vans/**
      - packages/pk_data/lib/src/write/drift_van_writer.dart
      - packages/pk_data/lib/src/db/tables/vans.drift

  - id: M19
    title: FBR Digital Invoicing — each bill reported, numbered and QR'd
    # Opened and sealed 30 Sep 2026 at 1/1. A registered shop turns it on in
    # Tax, with the token PRAL issued and, if it uses one, an integrator's
    # address. Each bill made after that is marked pending when saved and
    # sent at once and every five minutes while the app is open: checked
    # first for what FBR would refuse (the shop's NTN, an 8-digit HS code on
    # every line), written as DI v1.12 JSON with every amount the exact
    # decimal of its paisa, posted with the token, and FBR's answer kept on
    # the bill. The receipt prints FBR's number and a QR of it, or "FBR:
    # pending". Schema v8 adds the FBR columns on documents. Found on the
    # way: bills rung up at the counter never carried the item's HS code, so
    # FBR would have refused every one of them.
    #
    # Not exercised against FBR itself: there are no PRAL credentials on
    # this bench, so the payload, the answers and the retry are proved
    # against a stand-in, and the field names follow the plan document's
    # DI v1.12 summary rather than PRAL's published schema. Not built:
    # credit notes to FBR for returns, amending a bill inside the 72 hours
    # (a late bill is flagged), and provincial sales tax on services.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/tax/fbr/**
      - packages/pk_platform/lib/src/fbr/**
      - packages/pk_platform/lib/src/receipt/fbr_qr.dart
      - packages/pk_bootstrap/lib/src/fbr_services.dart
      - lib/features/tax/fbr_screen.dart
      - lib/features/tax/fbr_keeper.dart

  - id: M20
    title: Automatic Google Drive backup — every day, sealed, the newest seven kept
    # Opened and sealed 30 Sep 2026 at 1/1. The owner types a backup
    # passphrase twice on the Backup screen and turns on Drive backup;
    # Google's own screen allows the app its private app folder
    # (drive.appdata), and the first backup goes at once. From then on,
    # whenever the app opens or comes back to the front a day after the last
    # one, the books are sealed exactly as a shared backup is and uploaded,
    # the newest seven are kept, and the last time or the last failure shows
    # on the Backup screen. A new phone restores from Drive on the setup
    # screen, through the same restore that checks and stages a file. No
    # background job: a shop opens its till every day.
    #
    # Not exercised against Google itself: there is no OAuth client for this
    # app on this bench, so Google sign-in has never run, and the Drive REST
    # calls are proved against a stand-in for Drive on this machine. It
    # needs the app's Android OAuth client (package name and signing SHA-1)
    # in the owner's Google Cloud project and GOOGLE_OAUTH_CLIENT_ID in the
    # build; without it the Drive section is not shown at all. The new
    # google_sign_in plugin has not been through the release gates here
    # (they need the upload key).
    state: sealed
    owns:
      - packages/pk_platform/lib/src/backup/cloud_store.dart
      - packages/pk_bootstrap/lib/src/drive_backup_services.dart
      - lib/features/backup/drive_access.dart

  - id: M21
    title: Subscription plans — Free, Silver, Gold, Platinum, bought through Google Play
    # Opened and sealed 1 Oct 2026 at 1/1. The plans and prices are the
    # plan document's (section 15): Free for ever with bills, khatas, stock,
    # cash book, printing and backup by hand, and a "made with" line on
    # bills; Silver Rs 1,999 a year (no line, three firms, the daily Drive
    # backup, post-dated cheques, wholesale and VIP prices, the books and
    # tax reports); Gold Rs 3,499 (five people with PINs, batches and
    # serials, scale labels, godowns, counters on wi-fi); Platinum Rs 5,999
    # (no limits, recipes, vans, live FBR). One table in pk_domain says
    # which plan has what. Every paid feature is refused at the service, as
    # permissions are, and the screens lock it and offer the plan that has
    # it. Losing a plan locks nothing already made.
    #
    # Bought through Google Play Billing (in_app_purchase). Each purchase is
    # kept on the phone exactly as Play signed it and the RSA signature is
    # checked against the key built into the app every time the app opens;
    # Play is asked again whenever it can be reached, and a plan Play has
    # not confirmed for 30 days lapses. No key in the build: everything is
    # Free, never open. A test build has a switch to try any plan without
    # paying; a release build has none.
    #
    # Not exercised against Google Play itself: there is no Play listing or
    # licensing key on this bench, so the purchase sheet has never opened.
    # The signature check is proved against signatures openssl made, and
    # the purchase flow against a stand-in for Play. Live FBR is Platinum
    # as the plan document has it; Gold's "FBR formatting and QR" has no
    # separate meaning here, because the QR carries FBR's own number.
    state: sealed
    owns:
      - lib/features/subscription/**
      - packages/pk_domain/lib/src/entitlement/plans.dart
      - packages/pk_platform/lib/src/billing/**
      - packages/pk_bootstrap/lib/src/plan_services.dart
      - packages/pk_bootstrap/lib/src/plan_gates.dart

features:
  # ---------------------------------------------------------------------------
  # M0 — the walking skeleton: one real sale
  # ---------------------------------------------------------------------------

  - id: M0-MONEY-01
    milestone: M0
    title: Money is whole paisa and never a float
    status: done
    proof:
      - arithmetic is exact the classic float failure does not occur
      - arithmetic is exact a thousand additions of one paisa make exactly ten rupees
      - arithmetic is exact the reference cart totals to the paisa

  - id: M0-MONEY-02
    milestone: M0
    title: Apportionment never creates or destroys a paisa
    status: done
    proof:
      - allocate and split never create or destroy paisa weighted allocation sums back
      - allocate and split never create or destroy paisa an indivisible split still sums back
      - allocate and split never create or destroy paisa property: 2000 random allocations all sum back exactly

  - id: M0-MONEY-03
    milestone: M0
    title: Quantity carries three decimals and never renders as a whole number
    status: done
    proof:
      - Qty display — the regression that defined this package a fractional weight never renders as a whole number
      - Qty parse rejects a fourth decimal rather than truncating

  - id: M0-MONEY-04
    milestone: M0
    title: Rate times quantity rounds once, half-up, symmetrically
    status: done
    proof:
      - Rate x Qty — the one multiplication in the application the reference line: Rs 150.00/kg x 3.5 kg = Rs 525.00
      - Rate x Qty — the one multiplication in the application rounding is half-up and symmetric about zero
      - Rate x Qty — the one multiplication in the application property: 5000 random lines round to within half a paisa
      - Rate x Qty — the one multiplication in the application the overflow guard throws instead of wrapping silently

  - id: M0-MONEY-05
    milestone: M0
    title: A pro-rata loose sale never exceeds the pack MRP
    status: done
    proof:
      - Rate x Qty — the one multiplication in the application pro-rata loose sale never exceeds the pack MRP

  - id: M0-ID-01
    milestone: M0
    title: ULID keys are monotonic even when the clock goes backwards
    status: done
    proof:
      - ULID sorts lexicographically in creation order
      - ULID is strictly increasing inside a single millisecond
      - ULID does not go backwards when the clock does
      - ULID does not repeat across 20,000 ids

  - id: M0-ID-02
    milestone: M0
    title: HLC string order is causal order
    status: done
    proof:
      - HLC sorts causally as a plain string
      - HLC still moves forward when the wall clock moves backwards
      - HLC two devices converge on the same order after exchanging
      - HLC refuses a peer whose clock is implausibly far ahead

  - id: M0-ID-03
    milestone: M0
    title: Every mutation carries a complete, unforgeable row envelope
    status: done
    proof:
      - the envelope is stamped on every row from the ActorContext
      - the envelope cannot be forged by a caller
      - the envelope an update bumps the revision and re-stamps the clock
      - ActorContext refuses an empty identity, in release as well as in debug

  - id: M0-TIME-01
    milestone: M0
    title: Reports group on the shopkeeper's day and the Pakistani fiscal year
    status: done
    proof:
      - BusinessDate uses the shopkeeper day, not the UTC day
      - BusinessDate derives the Pakistani fiscal year, which starts 1 July

  - id: M0-SCHEMA-01
    milestone: M0
    title: Schema v1 holds all twenty-five tables, every one STRICT
    status: done
    proof:
      - the schema contains exactly the tables this version plans
      - every table is STRICT
      - a STRICT table refuses text in an integer column

