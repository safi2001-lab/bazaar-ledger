    owns: []

  - id: M30
    title: A bill is found again and sent again, whenever it is wanted
    # Opened and sealed 2 Oct 2026 at 1/1. Shopkeepers testing the app said
    # a bill could be shared on the screen that opens after the sale and
    # never again. The sales list now finds a bill by its number, the
    # customer's name or phone, or its amount, narrowed to today, this week,
    # this month, last month or dates picked, and to paid, still owed or
    # cancelled, every narrowing in SQL under the paging cursor. Every row,
    # in the list and on the home screen, sends its bill without opening it:
    # a PDF, a picture of the paper, the customer's own WhatsApp chat with
    # the bill written out (whatsapp://, never wa.me; with no number the PDF
    # goes through the share sheet and says why), or the printer, through
    # the receipt screen's own print path moved where both can reach it. The
    # receipt, a delivery, a quotation and a challan carry the same buttons.
    # A cancelled bill goes out marked CANCELLED / MANSOOKH, and a bill whose
    # original was printed goes out as DUPLICATE / DOBARA COPY. The picture
    # is the printer's own 48-column layout drawn by Flutter's text engine,
    # QRs included; no dependency was added for it.
    #
    # Found on the way: a delivery could not be opened at all. A tap went
    # straight to sending goods back, and a delivery read through the
    # receipt query would have called itself an Invoice with the mill as its
    # Customer. It opens read-only now, titled Purchase Bill, the mill as
    # Supplier, its own bill number at the foot, sending back one tap away.
    #
    # Not built, and why: a file dropped straight into a named WhatsApp chat
    # (a whatsapp:// link carries text only, and the intent that names a
    # chat with a file is undocumented), so files go through the share sheet
    # with the message as their caption; neither mark on thermal paper, so
    # the reprint path stays exactly as it was; a list of returns, which do
    # not have one to open them from; and a record of each share, so only a
    # printed bill is sent as the duplicate.
    state: sealed
    owns:
      - lib/features/sales/send_bill.dart
      - lib/features/sales/send_sheet.dart
      - lib/features/sales/print_bill.dart
      - lib/features/printing/receipt_picture.dart
      - lib/features/documents/document_screen.dart
      - packages/pk_domain/lib/src/documents/bill_message.dart
      - packages/pk_domain/lib/src/ports/sale_search.dart

  - id: M31
    title: Every entry in a khata can be opened and put right; a bill stays as it was printed
    # Opened and sealed 2 Oct 2026 at 1/1. Shopkeepers testing the app said
    # a customer's khata entries could not be changed once added. Now every
    # line opens: a bill as it was printed (share, print, return, cancel —
    # never edit); a payment taken or made with its bills, what was left on
    # account, who keyed it in and when, and the entry it corrected or was
    # corrected by, a tap away; a charge with its reason; the opening
    # balance. A payment can be sent as a receipt PDF, edited or cancelled,
    # and so can a charge and an expense; the opening balance is corrected
    # from the khata or the party's details. Cancelling mirrors the entry
    # dated today, reopens the bills the payment settled and strikes out its
    # allocations; editing is that and the corrected entry in one
    # transaction, tied together in the activity log. A reason is picked
    # from five presets or typed. The owner, a manager and the accountant
    # may do it (a new permission); a cashier may not.
    #
    # Found on the way: open bills were shown by their database id, and so
    # was the receipt preview; a payment's journal entry never named its
    # payment, so cancelling finds older ones by narration; a reprinted bill
    # lists every payment allocated to it whatever its status, which is why
    # a cancelled receipt's allocations are struck out rather than left
    # standing; the refusal to cancel a paid bill said "Undo those first"
    # when nothing could, and now says where.
    #
    # Not built, and why: a payment is never moved to another khata (cancel
    # it and enter it on the right one, two acts the shop can see); a cheque
    # at the bank, cleared or bounced is refused, since cancelling would
    # contradict the bank, and moves on through the Cheques screen; money
    # taken at the counter goes with its bill; a correction is dated today,
    # never backdated into a day already closed; a cancelled entry leaves
    # the khata list rather than showing struck through; a return to a
    # supplier has no page of its own.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/corrections/payment_void.dart
      - packages/pk_domain/lib/src/corrections/opening_correction.dart
      - packages/pk_domain/lib/src/ports/correction_writer.dart
      - packages/pk_domain/lib/src/ports/entry_details.dart
      - packages/pk_application/lib/src/correct_entries_use_case.dart
      - packages/pk_data/lib/src/write/drift_correction_writer.dart
