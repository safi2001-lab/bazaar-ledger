  - id: M0-RECEIPT-01
    milestone: M0
    title: The 80mm receipt is exactly 48 columns and never clips an amount
    status: done
    proof:
      - 80mm layout every line is exactly 48 columns or shorter
      - 80mm layout amounts are flush against the right margin
      - 80mm layout a long item name wraps instead of being cut off
      - 80mm layout a huge amount is never clipped, the label is
      - 80mm layout a fractional weight never prints as a whole number

  - id: M0-RECEIPT-02
    milestone: M0
    title: The 58mm receipt is exactly 32 columns
    status: done
    proof:
      - 58mm layout every line is exactly 32 columns or shorter

  - id: M0-RECEIPT-03
    milestone: M0
    title: Real ESC/POS bytes, opening with a reset and ending with a cut
    status: done
    proof:
      - ESC/POS byte stream opens with a reset so the last job cannot bleed into this one
      - ESC/POS byte stream ends with a cut that feeds the paper past the blade first
      - ESC/POS byte stream selects a font rather than trusting the printer default
      - ESC/POS byte stream emits GS v 0 when there is a raster to print
      - ESC/POS byte stream is pure Latin, so no printer renders a random glyph
      - ESC/POS byte stream kicks the drawer only when asked

  - id: M0-RECEIPT-04
