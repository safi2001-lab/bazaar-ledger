      - step 7 — the sale is really in the database one document, numbered INV-2627-0001, totalling 552500 paisa
      - step 7 — the sale is really in the database two lines, with the fractional weight intact
      - step 7 — the sale is really in the database the journal balances at 552500 on both sides
      - step 7 — the sale is really in the database two stock movements, out of the shop
      - step 7 — the sale is really in the database one payment and one allocation, with the change recorded

