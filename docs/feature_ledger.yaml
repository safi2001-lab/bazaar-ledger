  - id: M38
    title: Every bill has a day it is due, and a customer's promise is kept on the khata
    # Opened and sealed 3 Oct 2026 at 1/1. Until now the khata knew how old
    # each bill was and nothing about when it was meant to be paid, so a
    # wholesale customer on fifteen days and a household that settles on
    # salary day were chased by the same clock. Now a customer carries
    # credit days — on the full form and on the short one at the counter —
    # and each open bill on the khata says "Due 12 Oct", "Due today" or
    # "Overdue 9 days". A customer with no term of their own is held to the
    # shop's usual thirty days, the same edge the bill-age report has always
    # called current, so a shop that never sets one sees the overdue figure
    # it saw before.
    #
    # Due dates are derived, never stored: the bill's date plus the
    # customer's credit days, worked out on every read, in SQL and in
    # `dueDateOf`, and a test pins the two together across month ends. No
    # schema change was open to this milestone (v8 is held elsewhere), and
    # the shopkeeper's own words for it are a term on the customer, not a
    # date on the paper. The consequence is deliberate and the form says it
    # before Save: changing a customer's credit days moves the due date of
    # every bill they still owe on.
    #
    # A promise to pay ("Jumma ko de dunga") is written on the khata: a day
    # (today, tomorrow, Friday, a week, salary day on the 1st, or any day),
    # an amount if one was said, and their words. It is never ticked:
    # kept when receipts from the day it was made to the day it was for
    # reach what was promised, broken when the day passes without, replaced
    # when a new one was made before its day — read off the books, so it
    # cannot be left "pending" about a promise everyone knows was broken.
    # Taking one off marks it and keeps it; earlier promises, broken ones
    # included, stay listed under the latest. Promises are rows in the
    # firm's `settings` (`promise.<party>.<id>`, JSON), one per promise so
    # two counters taking promises the same evening each keep theirs when
    # the LAN sync merges, written through TxRunner with an audit row each.
    #
    # The home screen carries the morning: customers due today, customers
    # late, customers who promised today, each line opening the chase list
    # narrowed to them. That card is the reminder — no OS notification, no
    # new plugin, no notification permission. The chase list ages by due
    # date (not yet due / 1-30 / 31-60 / 61-90 / 90+), reads most late
    # first or by the day promised, filters to due today, late, promised
    # today or promised, and never lists a customer in credit overall
    # (it joins the one SELECT the whole app reads a balance from). The
    # due-date ageing and the chase rows are exposed as
    # `services.udhaar.queries.dueAging` / `dueParties` for a reports
    # milestone to register; the reports files are not this one's.
    #
    # Found on the way, at M33's report: the khata's own history left out
    # goods brought back, so its running balance ran ahead of the balance
    # above it by the return. It now lists each return (the part not
    # refunded over the counter), and a test lands it on the balance. A
    # return line says what came back and opens nothing; returns have no
    # page of their own.
    #
    # Not built, and why: a notification from the phone the day before (no
    # plugin, by the brief); a shop-wide default other than thirty days (a
    # setting nobody has asked for yet); due dates on an opening balance,
    # which has no bill date to count from — it is chased by promise.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/receivables/due_dates.dart
      - packages/pk_domain/lib/src/receivables/promise.dart
      - packages/pk_domain/lib/src/ports/udhaar.dart
      - packages/pk_data/lib/src/read/drift_udhaar_queries.dart
      - packages/pk_data/lib/src/write/drift_udhaar_store.dart
      - packages/pk_bootstrap/lib/src/udhaar_services.dart
      - lib/features/khata/udhaar_providers.dart
      - lib/features/khata/due_chip.dart
      - lib/features/khata/promise_sheet.dart
      - lib/features/khata/udhaar_due_card.dart

  - id: M39
    title: Forty reminders sent in an evening, each in the customer's own language
    # Opened and sealed 3 Oct 2026 at 1/1. The chase list's "Send reminders"
    # turns it into a tick list: tick the customers, or everyone late at
    # once, and the round walks through them one by one. Each comes up with
    # their message already written; one tap opens their WhatsApp chat with
    # it typed (the same whatsapp:// intent as M3 and M30, never wa.me), or
    # the phone's own messages app through the sms: intent — the shopkeeper
    # taps Send there, from their own SIM, and the app never holds
    # SEND_SMS. Back in the app: Sent, Skip, or Later (to the end of the
    # round). The round is kept in the draft store after every step, beside
    # the half-rung bill, so a ROM that kills the app while WhatsApp is open
    # leaves the chase list offering to carry on from the next name.
    #
    # Messages come from a template per language — Urdu in its own script,
    # Roman Urdu, English — with {name} {amount} {due} {shop} {phone}
    # {wallet} {oldest_bill_date}; a line whose placeholder has nothing to
    # say is left out whole rather than sent half-empty. The owner edits
    # each in Settings with the message shown filled in, and puts the
    # shop's own words back with one tap (kept as an empty value, so a
    # better default shipped later still reaches shops that never changed
    # theirs). The defaults greet, name the shop and the amount, ask kindly,
    # threaten nothing, cite no law, and fit a lock screen — the rules M3's
    # reminder kept; they now also say the oldest bill's due date, which is
    # the term the shop gave, not a threat. {wallet} is the shop's Raast
    # alias and bank account from Payment details, as plain text — never a
    # payment link or a QR payload. The Urdu-script template is data, not an
    # ARB string: the app speaks Roman Urdu and English; the customer's
    # message is written in what the customer reads.
    #
    # Each customer has a reminder language and a "don't remind" switch on
    # their form; one who opted out cannot be ticked, and their khata
    # offers no Remind and says why. The khata's own Remind uses the same
    # template and language.
    #
    # Storage, decided: templates and each customer's language/opt-out are
    # rows in the firm's `settings` (`reminder.template.<lang>`,
    # `reminder.party.<id>`), through TxRunner, audited, synced like every
    # setting. The reminder log is the audit trail itself — one
    # REMINDER_SENT row on the customer, with the channel and language in
    # its JSON, who and when in its envelope — because "who reminded whom,
    # when, and how" is exactly what an audit row is. The khata says "Aaj
    # yaad dilaya · Malik Sahib · WhatsApp"; the chase list says when each
    # was last reminded. A reminder sent from the round is logged when the
    # shopkeeper says Sent; one sent from the khata's own button is logged
    # when it is handed to WhatsApp, because that customer was chosen and
    # the button pressed on purpose.
    #
    # Not built, and why: sending without the shopkeeper pressing Send (it
    # needs SEND_SMS, which Play reserves for SMS apps, or WhatsApp's
    # Business API, an account and a server); knowing whether WhatsApp
    # actually delivered (the intent tells nobody); a picture of the bill
    # attached to a reminder (a whatsapp:// link carries text only).
    state: sealed
    owns:
      - packages/pk_domain/lib/src/receivables/reminder_templates.dart
      - lib/features/khata/reminder_queue.dart
      - lib/features/khata/reminder_queue_screen.dart
      - lib/features/khata/send_reminder.dart
      - lib/features/settings/reminder_templates_screen.dart

  - id: M44
    title: "Baqi chhor do: a balance settled with a discount or written off, with the reason kept"
    # Opened and sealed 3 Oct 2026 at 1/1. Taking money on a khata now
    # offers "let the rest go": a customer owing Rs 10,000 hands over
    # Rs 9,500, the receipt is taken as any receipt is, and the Rs 500 it
    # did not cover settles the remaining bills and is posted to a new
    # Settlement Discount expense (6410, beside Bad Debts, apart from
    # Discount Given, which is off the price at the counter). A balance
    # given up on is written off from the khata — all of it, or the bills
    # picked — with a reason that may not be blank, to the Bad Debts
    # expense the chart has carried since M0. The khata shows each as a
    # line ("Riayat SD-…", "Doobi hui raqam WO-…"); the chase list opens a
    # list of everything let go with who, why, how much and who let it go,
    # cancelled ones struck through.
    #
    # Modelled as an allowance: a payment in of mode `adjustment` (the mode
    # the schema has kept since M0 for exactly this), allocated to bills the
    # way a receipt is and written by the receipt's own writer, with the
    # debit on the expense instead of the drawer. So the receivable comes
    # down by exactly what was let go, the profit and loss shows it, the
    # books balance in the same commit, and no cash figure moves: its rows
    # sit under a hidden payment account of mode `adjustment`, which the
    # drawer, the cash book and the day close (all read mode `cash`) never
    # count and no tender sheet offers. Each kind has its own number series
    # (SD-, WO-), so a reprinted bill, the khata and the activity log say
    # which it was without a column — no schema change was open. A
    # write-off of an opening balance clears it on the customer's advances,
    # as a receipt against an opening balance does.
    #
    # Reversible by M31's cancel, unchanged in spirit: the cancel path finds
    # an allowance's entry by its narration as it finds a receipt's, mirrors
    # it, reopens the bills and strikes the allocations, so a cancelled
    # write-off puts the udhaar back to the paisa. An edit is refused in
    # words (the edit path would take it back as money); the payment page
    # offers only Cancel for one, and no receipt PDF.
    #
    # Permissions: a write-off needs M31's correctEntries (owner, manager,
    # accountant). A settlement discount is open to whoever takes payments
    # within their role's discount ceiling (a cashier five per cent of what
    # is settled, M22), and unlimited to whoever may write off; past the
    # ceiling the sheet says who can, and the service refuses anyway. The
    # bad-debts list reads `services.udhaar.queries.allowances`, which a
    # reports milestone can register as the Bad Debts report by period.
    #
    # Not built, and why: a settlement discount with no money taken at all
    # (that is a write-off, and is done as one); recovering a written-off
    # debt as income (cancel the write-off and take the money, which keeps
    # one story on the khata); a write-off of what a supplier is owed.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/receivables/allowance.dart
      - packages/pk_domain/lib/src/ports/settlement_writer.dart
      - packages/pk_application/lib/src/settle_khata_use_case.dart
      - packages/pk_data/lib/src/write/drift_settlement_writer.dart
      - lib/features/khata/write_off_sheet.dart
      - lib/features/khata/bad_debts_screen.dart

  - id: M36
    title: A bill rung again, or put right and issued again, without typing it twice
    # Opened and sealed 3 Oct 2026 at 1/1. A wholesaler's customer orders
    # "the same as last week", and a bill with one wrong price on it is
    # thirty lines that were right; both meant ringing every line again
    # while the customer waited. Now any bill — a cancelled one too — goes
    # onto the counter as a NEW bill from its own screen (under the bar's
    # dots), from its row in the sales list (the long press), or from the
    # counter once the customer is named ("Pichhla order dobara"): the same
    # goods, in the units billed, the same customer, khula maal as khula
    # maal. Asked first which prices: today's for this customer (their tier
    # and standing discount, the default) or the prices billed, discounts
    # and all. A line whose item was archived since, a free line, a phone
    # sold by serial and an item billed twice at two prices are left off
    # and named at the head of the lines; never over a bill being rung.
    #
    # "Ghalti theek karein" (owner and manager: it cancels, so it needs what
    # a cancel needs, and the counter): why — Wrong item, Wrong quantity,
    # Wrong price, Wrong customer, or words — then the bill is cancelled by
    # the ordinary cancel, every refusal standing, and its exact copy opens
    # on the counter, saying which bill it replaces until it is saved. The
    # two are linked `revises` in doc_links, a type the schema has carried
    # since v1 and nothing wrote; written in the sale's own commit and
    # refused for a bill still standing or one already put right by a bill
    # still standing. Each bill's screen says "Replaces INV-…" or "Replaced
    # by INV-…", a tap from the other. Not supersedes_id (a revision of the
    # same number) nor voided_by_id (the cancellation is the reversing
    # entry, not the new bill). No schema change.
    #
    # The money. The cancel takes the bill's own tenders off the books, as
    # it always did — in the books' eyes the money is handed back. It was
    # not, so the corrected bill's payment sheet starts at exactly what the
    # bill had taken, in the way it came: cash written in as handed over
    # (the card shows the change when the bill came down and what is still
    # to take when it went up), any other mode again with its reference or
    # cheque, a bill all on udhaar on udhaar. Proved against the journal:
    # Rs 300 cash put right to Rs 150 leaves the drawer Rs 150, once; Rs 300
    # with Rs 100 paid put right to Rs 450 leaves the khata Rs 350, not Rs
    # 550. If the copy is dropped, the bill stays cancelled and its money
    # handed back, and the sheet says so, with the amount, before anything
    # is done. A receipt taken later against the khata is never carried —
    # a bill with one cannot be cancelled at all.
    #
    # The cancel sheet takes its reason from presets too (order cancelled,
    # rung twice, wrong entry, or words), as M31's payments do; typed words
    # alone still do. The receipt preview keeps the paper's own size
    # whatever the app's text size (M56 left it growing). The cart draft is
    # v5 for the bill it replaces and the money taken; v2 to v4 still read.
    #
    # Found on the way and fixed, both in the cancel itself and both
    # doubling money: a bill with goods already returned against it could
    # be cancelled, so the reversal of the whole sale counted the returned
    # goods and their refund a second time; and a bill paid at the counter
    # by a cheque already at the bank, cleared or bounced was cancelled with
    # its cheque, contradicting the bank (M31's rule for khata cheques).
    # Both are now refused in words, the return pointing at taking the rest
    # back as a return.
    #
    # Not built, and why: "Replaces INV-…" on the paper itself (the printed
    # layouts are M2's and M51's, and the bill a customer holds is printed
    # as it always was); a line split across serial pieces or units merged
    # in any cleverer way than the counter can hold; telling FBR a reported
    # bill was cancelled (the cancel never has; the corrected bill reports
    # as any new one); the "previous balance on the bill" and copy labels
    # TASKS lists beside M36 were M51's and are done there.
    state: sealed
    owns:
      - lib/features/sales/bill_again.dart
      - lib/features/sales/bill_reasons.dart
      - lib/features/sales/correct_bill_sheet.dart
      - packages/pk_domain/lib/src/sales/bill_copy.dart

  - id: M42
    title: Who changed what and when, a day once closed stays closed, and a PIN before anything is undone
    # Opened and sealed 3 Oct 2026 at 1/1. Vyapar sells "View History" on
    # its premium plan; Tally keeps an edit log and a period lock, Zoho a
    # lock date, Marg a freeze; Khatabook's most-asked-for setting is a Data
    # Lock PIN. A Pakistani shop wants all three for one reason: the counter
    # boy, the son and the owner use one phone, and when the bill in the
    # customer's hand says Rs 4,200 and the books say Rs 3,800, the owner
    # needs to know which hand, when, and what it said at the time.
    #
    # History: every bill, payment, expense, customer and item has one, read
    # from what the books already keep -- the audit row each write has left
    # inside its own transaction since M0, the print jobs (M2), the return
    # and conversion links, the allocations of every receipt, settlement
    # discount and write-off (M44), the cancel with its reason, and M31's
    # corrections both ways (the replaced entry points on to its
    # replacement, the replacement back). Who, on which counter, when; an
    # edit of a customer or an item now keeps every field's before and after,
    # taken by the write path itself from the row before it is updated, so
    # no writer has to remember and none added later can forget. Opened from
    # the payment page, the expense page, the customer's editor and every
    # line of the activity log; a line about another paper opens its
    # history. The activity log's permission: owner, manager, accountant.
    #
    # Closed books: the owner closes the books up to a day -- the last day
    # counted at the drawer (M9) is offered first, the end of last month
    # otherwise -- and anything dated on or before it is refused in words:
    # a back-dated bill, purchase, payment, expense or journal, a cancel of
    # a bill, payment, charge or expense dated inside, a correction that
    # would post there. A return today against an old bill is dated today
    # and goes through, and so does a receipt today settling an old bill,
    # or an old cheque clearing or bouncing today. The owner may let one
    # entry in with their PIN and a reason; the write is made and a
    # CLOSED_BOOKS_OVERRIDDEN row names who agreed and why. Kept in settings,
    # so it reaches every counter with the rest of the books and binds there
    # from its next write.
    #
    # Data Lock: off until the owner turns it on, and only once the owner
    # has a PIN. Then cancelling a bill or a payment, correcting a payment,
    # charge, expense or opening balance, writing off udhaar, hiding an item
    # or a customer, cancelling a loan entry, reopening closed books,
    # turning Data Lock off, and restoring a backup each ask a PIN first:
    # the PIN of whoever is doing it (their role already let them; the PIN
    # proves it is them and not whoever picked the phone up) or the owner's,
    # standing beside them. M9's hasher checks it and the digits are never
    # kept; wrong PINs count towards sign-in's half-minute block. The PIN
    # given is itself an audit row. Only the owner closes the books or
    # changes Data Lock.
    #
    # Where the locks are kept: TxRunner, the one write path, as M9's roles
    # are kept at the service. Every dated row (documents, journal entries,
    # payments, stock) is judged as it is written; a status taking a row out
    # of the books, or a date moved, as it is updated; Data Lock at commit,
    # against the audit codes the transaction is about to leave (every
    # cancel, write-off and hiding leaves exactly one). A refusal rolls the
    # transaction back with ApprovalNeeded; the app's shell answers it with a
    # PIN prompt over whatever screen asked and the write is tried again,
    # outside the transaction, so no screen that cancels or posts anything
    # has to know a lock exists. With no prompt -- a test, a tool -- the
    # refusal in words is the answer.
    #
    # Counters: an entry a counter made before it heard of the closing
    # arrives by sync and is taken in (the money really moved; refusing it
    # would leave the two phones disagreeing about the drawer), and is listed
    # for the owner under the closing as having arrived afterwards.
    #
    # Not built, and why: the receipt screen's History button and the item
    # editor's (both one line, in files other milestones hold open); a share
    # of a bill is not recorded anywhere, so the history shows prints but not
    # shares; history for a purchase, a cheque's own page or a loan (their
    # pages belong to others); an edit window in hours, Marg-style (a closed
    # day covers the shop's case); a field-by-field diff of a posted bill,
    # which is never edited -- it is cancelled and rung again, and both show.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/entitlement/book_locks.dart
      - packages/pk_domain/lib/src/entitlement/record_history.dart
      - packages/pk_data/lib/src/read/drift_record_history.dart
      - packages/pk_bootstrap/lib/src/audit_services.dart
      - lib/features/audit/history_screen.dart
      - lib/features/audit/approval_prompt.dart
      - lib/features/settings/books_lock_screen.dart

  - id: M41
    title: What to order, ordered from the right supplier, and orders the customer placed
    # Opened and sealed 3 Oct 2026 at 1/1. Purchase orders are documents of
    # their own (`purchase_order`, numbered PO-): a supplier, items in the
    # unit the supplier counts in, the rate they quoted, the day expected
    # and a note. Nothing else: no journal entry, no stock row, no payment,
    # a balance of zero — a test counts the journal and the stock ledger
    # either side of one. Sent to the supplier as a WhatsApp list of what is
    # still to come at the rates quoted (the same whatsapp:// intent as M30,
    # never wa.me), or as a PDF titled Purchase Order. "Maal aa gaya" opens
    # the delivery with the order's supplier and what is still to come of
    # each line, in the order's unit when it comes out whole and at the
    # order's rate; a line changed to a rate the order did not quote says
    # "Rate PO se mukhtalif: 520.00 vs 500.00" on the line, in red, before
    # the delivery is saved. The delivery is linked to the order
    # `converted_from` as M25 links a bill to its challan, in the delivery's
    # own commit, and refused for another supplier's order or a cancelled
    # one. What has come in is never stored on the order: it is read off
    # the linked deliveries that still stand and spread over the order's
    # lines in order, so the order reads open, part received, received,
    # cancelled, or closed (cancelled after part of it came).
    #
    # Sale orders (`sale_order`, SO-) are lighter than a quotation: a
    # customer, items, quantities at the price promised, the day promised.
    # "Counter par bill banayein" puts what is still to go on the counter
    # through the cart's own loadQuotation (no change to the cart), where
    # the payment sheet bills it; the bill is linked back, and an order goes
    # out a delivery at a time (the "already billed" check is a quotation's,
    # not an order's). The write path also takes an order onto a challan,
    # and the bill made from that challan takes the order's advance; the
    # payment sheet (M36's) offers no challan while a document is on the
    # counter, so from the screen an order is billed. An advance is a receipt
    # through the existing receipt path, naming the order by its number and
    # held whole for it rather than swallowed by old udhaar
    # (`ReceiptDraft.holdAsAdvance`). The bill made from the order — or from
    # a challan made from it — takes the advance inside its own entry: of
    # what it would have put on the khata as udhaar, the part the advance
    # covers comes out of Customer Advances instead, and the bill reads that
    # much paid. Inside the bill's entry rather than beside it, so every
    # correction the app has stays true without knowing about orders: a
    # cancelled bill holds the advance again, a cancelled advance receipt
    # leaves the bill owed in full on the khata, a bounced advance cheque
    # takes back what it never paid; tests prove each against the khata and
    # the books. Never more than the bill leaves owed, nor than the shop
    # holds for the customer.
    #
    # The shortage list: a "*" in the counter's bar and the items list's
    # writes what a customer asked for — an item found by name, or their own
    # words — with an optional quantity and note. Each line is a row in the
    # firm's `settings` (`shortage.<id>`, JSON), one per line so two counters
    # each keep theirs through the LAN sync, written through TxRunner and
    # audited. A line naming an item leaves the list by itself once a
    # delivery of that item is entered after it was written; any line can be
    # ticked off ("Mil gaya", struck out, not destroyed). The list is sent
    # on WhatsApp or the share sheet as text.
    #
    # "Order banayein" (from the Orders hub and the Low stock list): M34's
    # Low Stock read and its reorder quantity, called rather than copied —
    # the average day's selling times fifteen days less the shelf, never
    # less than back to the floor — less what is on a standing purchase
    # order, and at least what the shortage list asked for that is not on
    # its way. Grouped by the supplier each item last came from, at what it
    # last cost them per unit; quantities editable, lines struck off, a
    # supplier picked for items nobody has supplied; one tap makes one
    # purchase order per supplier, all in one commit.
    #
    # Reports: Open purchase orders, Open sale orders (with the advance
    # held) and Items on open orders (ordered, received or delivered, still
    # to come) join M35's quotations and challans in the Orders group, as of
    # today, read through the order screens' own read so a report and an
    # order's page cannot disagree.
    #
    # Roles: purchase orders and what to order need `purchases`; sale orders
    # `sell`; an advance `takePayments`; the shortage list either.
    #
    # Not built, and why: short-closing a single line (an order is closed
    # whole, by cancelling what is left); a purchase return taking quantity
    # back off "received" (a delivery sent back stays received against its
    # order — the return is its own document); an advance by cheque from the
    # order screen (taken from the khata's receipt sheet like any cheque);
    # a purchase unit remembered on the item (no schema change was open:
    # the order line's unit is picked from the shop's conversions each
    # time); the credit-limit check at the counter does not yet count an
    # order's advance against the bill it pays.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/documents/orders.dart
      - packages/pk_domain/lib/src/documents/order_advance.dart
      - packages/pk_domain/lib/src/documents/reorder.dart
      - packages/pk_data/lib/src/read/drift_order_reads.dart
      - packages/pk_data/lib/src/write/drift_order_writer.dart
      - packages/pk_reports/lib/src/order_reports.dart
      - packages/pk_bootstrap/lib/src/order_services.dart
      - lib/features/orders/**
      - lib/features/purchases/delivery_line_sheet.dart

  - id: M53
    title: Never sold into thin air, and packed by the carton
    # Opened and sealed 3 Oct 2026 at 1/1. A Pakistani shopkeeper's review
    # of Vyapar: seven hundred kilos sold against six hundred in stock, and
    # not a word said. Every item now says what happens when a sale would
    # take it below nothing, as BUSY lets a shop say it: sell on, ask first,
    # or refuse. The shop has a rule of its own in Settings, which every
    # item without one follows; a shop that never chose asks, because the
    # point is that it is never silent and never stops a sale the
    # shopkeeper means to make. Only the owner changes a rule, the shop's
    # or an item's: a cashier who could set an item to sell on could talk
    # past the one answer meant to stop him.
    #
    # At the counter the question is asked the moment a line goes past the
    # shelf — added, stepped, typed, switched to the carton — in the item's
    # own terms: "Stock sirf 600 kg hai — phir bhi bechein?" Yes keeps the
    # line and is not asked again for as much; no puts the line back as it
    # last stood. A refused item is refused in words and put back. Asked
    # once more before the bill or the challan is saved, because a bill
    # restored after a kill, a quotation put on the counter or a sale at the
    # other till changes the answer. Beneath both, the sale path and the
    # challan path refuse a blocked item themselves, inside the sale's own
    # transaction, from the place the goods leave: the shop floor, or the
    # van a rider's phone sells from (M18), never the godown (M11 does not
    # sell from one). Nothing of a refused bill survives, not even its
    # number. Every line of an item counts together; a loose line (M37) and
    # an item that carries no stock never ask. A bill made from a challan
    # moves nothing and is not asked. Deliveries, a customer's return and a
    # return to the supplier never ask (a supplier return keeps its own
    # rule, that what was sold cannot go back). A batch item is refused past
    # its whole shelf, where first-expiry-first-out used to take the rest
    # from no batch; a serial was already refused.
    #
    # Decided: an item set to ask is the counter's to ask, not the
    # service's. The cashier's yes is not a fact the books can check after
    # the fact, so the sale path lets it through, the shelf reads below
    # nothing, and the item list and the low-stock list show it in red
    # whether or not it has a floor. Two counters on the shop's Wi-Fi that
    # are apart each check at the moment of sale by what they know, so
    # both may sell the last packet; when they meet the merge keeps both
    # bills (a sale is never merged away), the shelf reads one below
    # nothing on both phones, it is flagged in both lists, and neither sells
    # another until it is counted. Refusing the second after the fact would
    # unwrite a bill a customer holds.
    #
    # Packs: an item carries its own carton, dabba, packet, strip or bori,
    # each with its size, as its own conversion from the pack into its base
    # unit. The counter offered an item's own conversions already, so a
    # carton of 24 sells as one carton at 24 times the piece and takes 24
    # pieces off the shelf, exactly or refused (M1's converter); the
    # delivery picker now offers the carton too, so ten cartons at Rs 960
    # put 240 pieces on the shelf at Rs 40. The bori ships now, a weight
    # with no size of its own, sized item by item. A dozen or a maund is not
    # a pack: the shop already sizes those. A bill keeps the size it was
    # sold at, so changing a carton from 24 to 20 changes the next bill and
    # no earlier one.
    #
    # Schema v10. items gains negative_stock ('allow', 'warn', 'block', or
    # empty to follow the shop), a column rather than a settings row so it
    # travels to the other counters with its item in the change it already
    # makes; the shop's rule is the settings row stock.negative. The two
    # unique indexes on unit_conversions now count live rows only. Nothing
    # here is destroyed: a carton taken off an item is struck out and a
    # tombstone cannot be revived through the write path, so the old index
    # kept the pair for ever and a carton could never go back on (M56 left
    # packs unbuilt for exactly this). The migration adds the column in
    # place and drops and remakes the two indexes; no row is touched.
    #
    # Found on the way and fixed: two counters giving one item a carton
    # while apart clash on ids alone, and the LAN merge, which marks a clash
    # by renaming a code or a name, had nothing to rename — it wrote the
    # same row into the same clash and every sync after failed on that one
    # change. Such a newcomer is now kept struck out, as a clash to look at;
    # each phone's own carton stands.
    #
    # Not built: an owner's PIN to let one bill past a refused item (the
    # owner changes the rule or puts the stock right, as asked); a rule per
    # godown or per van; asking on a production run or a transfer (a
    # transfer already refuses moving what is not there); two-unit
    # quantities ("2 ctn + 5 pcs") and packs on a quotation's own form,
    # which are M45's.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/catalogue/shelf.dart
      - packages/pk_domain/lib/src/catalogue/packs.dart
      - packages/pk_data/lib/src/read/drift_shelf_reads.dart
      - packages/pk_bootstrap/lib/src/shelf_services.dart
      - lib/features/pos/shelf_guard.dart
      - lib/features/items/shelf_rule.dart
      - lib/features/items/item_packs_field.dart
      - lib/features/items/pack_choice.dart

  - id: M58
    title: The reports say what the books mean, and draw it
    # Opened and sealed 3 Oct 2026 at 3/3, with M46 (the drawing) at 1/1.
    # The follow-ups merging turned up, each closed on the books.
    #
    # Words. An other_income document with no party is the shop's own
    # income (M47), and the Day Book, All Transactions and the cash flow now
    # call it Other income; one with a party is still a Charge on that
    # khata. The kind is worked out once in SQL (sql_filters.dart,
    # _entryKindSql) from the entry's own document and lines: the shop's
    # income, the home's spending (an expense entry debiting the owner's
    # drawings) and a loan (a manual entry tagged loan:<id>, M48) are their
    # own kinds, each summed apart. A write-off or a settlement discount
    # (M44) is a payment in by how it is written; All Transactions, the Day
    # Book and every statement now read it by its number's series
    # (AllowanceKind.ofPaymentNo) as Written off or Settlement discount, and
    # the Payment in total is money that came.
    #
    # The home's spending. Ghar ka kharcha, in money or goods taken home, is
    # in no expense report: the voucher read marks it (its debit is the
    # owner's drawings) and the expense transactions, categories and items
    # leave it out of every row and total and show it apart, as a tile and a
    # line saying how much and how much of it was goods. The night's Z report
    # counts the shop's expenses and puts the home's on a line of its own.
    # The profit and loss and Expenses by head never had it (equity, not
    # expense), and a test says so; the trading account's "Stock in or out
    # otherwise" now names goods taken home.
    #
    # Khula maal. M8's Sales by item joined items, so a line with no item
    # (M37) was missing; it is now one row, Khula maal (no item), with no
    # quantity and no cost, as M34's item reports have it, and its total is
    # the bill-wise profit's sale amount and, for a shop charging no tax,
    # the sale report's.
    #
    # Money owed both ways. The Loans group has its Loan Statement: narrowed
    # by a new loan filter it is that loan's statement, and not narrowed it
    # is every loan on one page (lender, taken on, owed at the start,
    # received, principal repaid, interest, fee and charges, outstanding),
    # each row opening its loan. Both are M48's buildLoanStatement over M48's
    # postings, so the hub and the loan screen cannot disagree, and the
    # outstanding is the loan's account on the balance sheet. The statement's
    # table builder moved from pk_bootstrap to pk_reports (loan_reports.dart)
    # under the same name, so the loan screen's PDF and CSV are unchanged.
    # The Party group has Udhaar by due date (not yet due, 1-30, 31-60,
    # 61-90, over 90 days late, per customer, on the udhaar pack's due-date
    # SQL; its buckets are the pack's dueAging and its owed Udhaar by age's)
    # and Bad debts and settlement discounts (the pack's allowances: who,
    # why, how much and who let it go, a cancelled one marked and counted
    # nowhere; its totals are the Bad Debts and Settlement Discount accounts
    # in the profit and loss of the period).
    #
    # Changed and cancelled bills (M35), as M42 asked once it had merged: it
    # now lists udhaar written off or let go to settle (their reason read off
    # the payment, where M44 keeps it), a loan entry cancelled (M48), and the
    # closed books let into or opened again (M42's own codes, from
    # pk_domain); a Was column beside the Amount gives an edited entry's old
    # figure from the audit row's before (an opening balance's too), so the
    # change reads Rs 5,000 to Rs 500 as Marg's bill value changes do; an
    # Allowed by column names whose PIN let a change through, from the
    # DATA_LOCK_PIN_GIVEN or CLOSED_BOOKS_OVERRIDDEN row M42 writes in the
    # same transaction on the same record; and a new filter keeps it to Rs X
    # or more, a bound WHERE on the amount shown.
    #
    # Also: recentExpenses read the expense head as required and would have
    # thrown on a head the shop added (M47), which has no system key; it now
    # names it #<account id> as an expense draft does, and still refuses an
    # expense with no debit line. No schema change.
    #
    # Not built, and why: a party filter on Bad debts (the udhaar pack's
    # read takes none, and a filter here is a WHERE or nothing); bill-age
    # ageing redrawn as a ring (the due-date one is the shop's question now);
    # a changed line's item by item difference on an edited bill (a sale bill
    # is never edited, M31; it is cancelled and issued again, M36).
    state: sealed
    owns:
      - packages/pk_reports/lib/src/loan_reports.dart
      - packages/pk_reports/lib/src/udhaar_reports.dart
      - packages/pk_reports/lib/src/money_owed_reports.dart
      - packages/pk_data/lib/src/read/reports/loan_queries.dart
      - packages/pk_data/lib/src/read/reports/udhaar_report_queries.dart

  - id: M46
    title: Reports drawn on the phone, and today's figures on the hub
    # Opened and sealed 3 Oct 2026 at 1/1, with M58. A report that reads
    # well as a picture declares how in the registry (ReportEntry.chart, a
    # ChartSpec naming the table's own columns by title) and its screen
    # offers Table or Chart: a trend of columns, or a line past thirty-one
    # points, for Sales by day, the Sale report by day (its bills summed per
    # day, every day of the period drawn, a quiet one as a gap) and Hourly
    # sales; the top ten as bars, the rest summed, for Sales by item, Sale by
    # party, Expenses by head and Expense categories; a ring for Udhaar by
    # due date (its five buckets, in one hue light to dark) and the
    # payment-mode summary (how the sales were paid, udhaar included).
    #
    # The chart is read off the finished table by chartOf in pk_reports, so
    # it cannot disagree with it, and a test holds each chart's total to its
    # table's; a cost column struck for a cashier leaves no chart rather
    # than a wrong one. Shares are basis points; pk_reports holds no float,
    # and pixels are worked out in the app from paisa. Drawn with Flutter's
    # own CustomPaint, no chart package. The marks are painted and every
    # name and figure around them is an ordinary Text, so it grows at 200%
    # on a 360dp phone, reads in Roman Urdu or English, and is spoken; the
    # colours are tokens (a categorical set and an ordered ramp, checked for
    # colour-blind separation, each stepped for the dark theme), and every
    # slice and bar has its name and amount in Rs beside it, figures
    # tabular. A tap on a column says its day and amount; a bar that is one
    # party or item opens it.
    #
    # The Reports hub opens on a Today strip: today's sale, received, udhaar
    # given, expenses and, for a role that may see costs, gross profit, the
    # night's Z report's own headline figures (labels in DayFigureLabel), a
    # tap away from the Z report itself.
    #
    # Not built, and why: "vs last period" as a second series (one axis, and
    # the tiles above already say how each figure compares); a chart in the
    # PDF and Excel exports (the table is what goes to the accountant); a
    # chooser of which column to draw.
    state: sealed
    owns:
      - packages/pk_reports/lib/src/report_chart.dart
      - lib/features/reports/report_chart_view.dart
      - lib/features/reports/today_strip.dart

  - id: M43
    title: Bonus and slabs the way the trade runs, 10+1, cheaper by the carton, and a discount past Rs 5,000
    # Opened and sealed 3 Oct 2026 at 1/1. Pakistan's wholesale and
    # pharmacy trade runs on three things done today on a calculator beside
    # the till: the distributor's "das pe aik muft", the board that says a
    # dozen is Rs 46 and a carton Rs 44, and something off the big bill
    # without being asked. Vyapar has a free-quantity column the cashier
    # fills in by hand; Marg works all three out, on a desktop.
    #
    # Bonus: an item's scheme is "buy X, get Y free", of the same item or a
    # named other one, counted in the item's own unit or one of its packs
    # ("10+1 cartons" is 240 pieces and 24 more). Whole sets only -- nine
    # earn nothing, ten one, nineteen one, twenty two -- which is what a
    # salesman means and Marg calls Full; its Half and All modes are not
    # offered. Every paid line of the item counts together, on what leaves
    # the shelf, so a carton line counts 24. The counter works it out from
    # the lines every time and keeps no bonus line of its own, so ten soaps
    # earn the free one as the tenth is rung and nine take it back off;
    # under the line it shows "Bonus / muft: Lux Soap 1 pcs" at Rs 0 with a
    # cross, or "Scheme 10+1" while it earns none yet. Taking it off gives
    # less away, so any cashier may, and puts it back with a tap; what was
    # taken off survives the app being killed (two optional keys in the
    # cart's draft, no new version: a draft without them is a bill with
    # every scheme on, which is what a build before this makes of it).
    #
    # How bonus goods are booked: a line of its own, at no rate, marked
    # free (`is_free_item`, which the schema has carried since v1 and the
    # receipts now print as "(Bonus / muft)"), under the line that earned
    # it. It leaves the shelf and is costed at post time like any line, and
    # the books post that cost as they have posted every free line since
    # M0: Cost of Goods Sold against Inventory. The customer paid for ten
    # and took eleven, so the free soap's cost is a cost of that sale
    # (IFRS 15 spreads the price over all eleven), and the item's and the
    # bill's margins show what the scheme really cost. It takes no share of
    # a bill discount and carries no discount of its own, so Discount Given
    # and both discount reports are untouched by it; the Item-wise discount
    # report now has a Bonus qty column (inside Qty sold), and lists an
    # item given only as a bonus. A bonus-bearing bill taken back (M57)
    # gives back only what was paid: the free soap comes back for nothing
    # and at what it cost, the paid ones at their share of what was charged.
    # Decided: no tax of its own on the free line -- it is on the same
    # invoice as the goods that earned it; the owner's accountant should
    # confirm that is how their registered shop reports a trade bonus.
    #
    # Quantity slabs: "12 and up Rs 46, 24 and up Rs 44", per the item's
    # own unit. A slab sets the line's rate as the quantity crosses it, the
    # way the board on the wall does, and only where it is LOWER than the
    # customer's own price (retail, wholesale or VIP): a VIP on Rs 45 pays
    # Rs 45 for a dozen and Rs 44 for a carton. Counted on what leaves the
    # shelf, and carried into the line's unit exactly (M53's packs), so a
    # carton rung as one carton is Rs 1,056. A price the cashier typed
    # stands whatever the quantity, as a tier price does (setParty), and a
    # shop with no slabs rings exactly as it did.
    #
    # Bill slabs: "Rs 5,000 and up 2%, Rs 20,000 and up 3%", shop-wide, on
    # what the lines come to after their own discounts -- worked out the way
    # the calculator works out what it splits a bill discount over -- and
    # sent down M0's one bill-discount path, split across the lines to the
    # paisa into Discount Given. The payment sheet says it before the money
    # is taken ("Bill par 2% discount (Rs 5,000.00 se upar)") with a way to
    # take it off, or how far the bill is from the first slab ("Rs 200.00 ka
    # aur saman lein to bill par 2% discount"). A discount the cashier typed
    # on the bill is the bill's, and no slab is added to it.
    #
    # Roles: schemes are the owner's word, set in Settings, so a cashier
    # ringing them is applying it, as with a standing discount (M22): the
    # bill slab's discount does not use up the cashier's own ceiling (more
    # than the slab plus their 5% is still refused), and free goods past
    # what the schemes give are refused for every role but the owner, in
    # the sale path itself. Only whoever may change settings changes a
    # scheme; everyone may read them.
    #
    # Schemes received on a delivery: the delivery line takes a "Muft /
    # bonus" quantity in the line's unit. The free goods go on the shelf and
    # into the average with the paid ones in one step, and share their
    # money by quantity to the paisa -- ten cartons of 24 at Rs 9,240 and
    # one free are 264 pieces at Rs 350 -- written as a row of their own
    # beside the paid one, marked free, so the delivery reads like the
    # supplier's paper and a return of the free carton credits nothing and
    # takes its cost with it. What is owed to the supplier is what was
    # billed. A purchase order counts only the paid goods as received, and
    # the supplier's last rate is read off a paid row; a quotation or a
    # challan put on the counter leaves its bonus rows behind, the counter
    # working them out again from the schemes.
    #
    # Storage: no schema change. One `settings` row per item
    # (`scheme.item.<id>`, JSON, integers only) and one for the shop
    # (`scheme.bill_slabs`), written through TxRunner with an audit row and
    # the sync outbox; one row per item so two counters changing different
    # items apart both keep theirs, ids worked out from the item so the
    # same item set twice apart is one row, and a scheme taken off kept as
    # an empty one so it can always go back on. A scheme whose pack no
    # longer converts, or whose free item is gone, is not given (and still
    # listed in Settings to put right).
    #
    # Not built, and why: Marg's Half and All bonus modes; a bonus on an
    # item kept by serial number (a free phone needs its serial chosen) or
    # on a delivery line of serials; slabs per customer tier (one table per
    # item, lower price wins); a free quantity on the delivery sheet of a
    # purchase order's own line (M41's; the free goods are entered on the
    # delivery's picker); the counter's shelf question counts the bonus with
    # the goods, but a bill made from a challan must still match the
    # challan, so a scheme changed between the two is refused there in the
    # challan's words; a bill copied (M36) still notes its old bonus as left
    # out although the counter gives it again.
    state: sealed
    owns:
      - packages/pk_domain/lib/src/pricing/schemes.dart
      - packages/pk_bootstrap/lib/src/scheme_services.dart
      - lib/features/pos/scheme_book.dart
      - lib/features/pos/schemes_at_counter.dart
      - lib/features/items/item_scheme_screen.dart
      - lib/features/settings/schemes_screen.dart

  - id: M45
    title: 2 ctn + 5 pcs, 1 kg 500 g — quantities the way the shop counts them, everywhere
    # Opened and sealed 3 Oct 2026 at 1/1. Vyapar's most-agreed-with review
    # of September 2026, +403 people: a carton shown as "0.4756". A shop
    # counts a shelf the way it is stacked, two cartons and five loose, and
    # now so does every screen that shows an item's quantity: the bill being
    # rung, the search at the counter, the item list, the shelf count, the
    # item's history, low stock, a delivery's lines, and the stock reports.
    # "2 ctn + 5 pcs", "1 bori + 12 kg 500 g", "3 doz + 4 pcs" on a line sold
    # by the dozen; never a decimal of a pack. The packs are the item's own
    # (M53), largest first, the split is integer division of thousandths,
    # and the words add back to exactly what the shelf holds — proved for
    # every count from nought to four hundred, by reading each one's words
    # back. A line sold in a pack now says so: two cartons used to read "2
    # pcs", the figure beside the item's own unit whatever the line was sold
    # in.
    #
    # Typed the same way. The quantity box at the counter, on a delivery and
    # at the shelf count reads "2 ctn 5", "2c 5p", "2 peti 5 adad", "۲ کارٹن
    # ۵", "1 kg 250", "1 mann 5", in English, Roman Urdu or Urdu script, and
    # says back what it understood before anything is saved: "Yani 2 ctn + 5
    # pcs (53 pcs)". A figure alone means what it always meant. A word that
    # names two units ("d": a dozen, a dabba or a dana) is refused rather
    # than guessed, as is half a piece or a fraction of a pack that is not a
    # whole piece. The number pad stays the keypad, letters a tap away; under
    # the box a carton and a piece step up and down. On a carton line "3 ctn"
    # stays three cartons, and "2 ctn 5" moves the line to pieces with the
    # price carried exactly, Rs 960 a carton to Rs 40 a piece, through the
    # converter (M1) — or refused in words where it does not come out even,
    # as Rs 1,000 for 24 does not. 53 pieces of a 24-pack at Rs 960 a carton
    # bill as exactly Rs 2,120.00, and the stock ledger moves 53,000
    # thousandths. Under the price, the carton calculator: "1 ctn = Rs
    # 960.00", "1 pcs = Rs 40.00", with "≈" where a price is only to the
    # paisa. A delivery's cost is said per piece and per carton too.
    #
    # On paper, beside the figure and never instead of it, because the rate
    # is per the line's unit and the customer multiplies the two: "53 pcs (2
    # ctn 5 pc) x 40.00" on 80 mm, the count on a line of its own under the
    # figure on 58 mm, wrapped and never clipped on 32, 42 and 48 columns;
    # under the figure in the PDF's quantity cell in every design; and on
    # the transporter's copy, which is what a driver counts off the lorry. A
    # carton line counts in the carton it was sold at, worked out from the
    # line itself, whatever the item's carton holds today. Weights stay "1.5
    # kg x 300.00" on paper, as M56 decided; "1 kg 500 g" is the screen's.
    #
    # Decided: the shop's dozen and mann are understood when typed but are
    # not shown on an item's stock unless a line is sold in them — forty
    # shampoos are not "3 doz + 4 pcs" to the shop that stocks them. A
    # stock report changes only where an item has a pack and a figure fills
    # one, beside the Unit column it already had; its exports carry the
    # figures, which a spreadsheet can add up. No schema change.
    #
    # Not built: "3 doz + 4 pcs" kept on a bill line after a piece is added
    # to a line sold by the dozen (the line moves to pieces, exactly; the
    # cart has nowhere to keep the dozen it was counted in without a new
    # draft field); a reprint of a line sold by the piece counts in the
    # item's carton as it is on the day of printing (a bill line keeps no
    # pack of its own without a schema change); the delivery line opened
    # from a purchase order (M41) still takes a figure in its own unit; the
    # shelf guard's "Stock sirf 53 pcs hai" is not yet in packs.
    state: sealed
    owns:
      - lib/app/counting.dart
      - lib/design/counted_qty_field.dart
      - lib/features/pos/counted_line.dart
      - lib/features/purchases/counted_purchase.dart

features:
  # ---------------------------------------------------------------------------
  # M0 — the walking skeleton: one real sale
  # ---------------------------------------------------------------------------

  - id: M0-MONEY-01
    milestone: M0
    title: Money is whole paisa and never a float
    status: done
    proof:
      - arithmetic is exact the classic float failure does not occur
      - arithmetic is exact a thousand additions of one paisa make exactly ten rupees
      - arithmetic is exact the reference cart totals to the paisa

  - id: M0-MONEY-02
    milestone: M0
    title: Apportionment never creates or destroys a paisa
    status: done
    proof:
      - allocate and split never create or destroy paisa weighted allocation sums back
      - allocate and split never create or destroy paisa an indivisible split still sums back
      - allocate and split never create or destroy paisa property: 2000 random allocations all sum back exactly

  - id: M0-MONEY-03
    milestone: M0
    title: Quantity carries three decimals and never renders as a whole number
    status: done
    proof:
      - Qty display — the regression that defined this package a fractional weight never renders as a whole number
      - Qty parse rejects a fourth decimal rather than truncating

  - id: M0-MONEY-04
    milestone: M0
    title: Rate times quantity rounds once, half-up, symmetrically
    status: done
    proof:
      - Rate x Qty — the one multiplication in the application the reference line: Rs 150.00/kg x 3.5 kg = Rs 525.00
      - Rate x Qty — the one multiplication in the application rounding is half-up and symmetric about zero
      - Rate x Qty — the one multiplication in the application property: 5000 random lines round to within half a paisa
      - Rate x Qty — the one multiplication in the application the overflow guard throws instead of wrapping silently

  - id: M0-MONEY-05
    milestone: M0
    title: A pro-rata loose sale never exceeds the pack MRP
    status: done
    proof:
      - Rate x Qty — the one multiplication in the application pro-rata loose sale never exceeds the pack MRP

  - id: M0-ID-01
    milestone: M0
    title: ULID keys are monotonic even when the clock goes backwards
    status: done
    proof:
      - ULID sorts lexicographically in creation order
      - ULID is strictly increasing inside a single millisecond
      - ULID does not go backwards when the clock does
      - ULID does not repeat across 20,000 ids

  - id: M0-ID-02
    milestone: M0
    title: HLC string order is causal order
    status: done
    proof:
      - HLC sorts causally as a plain string
      - HLC still moves forward when the wall clock moves backwards
      - HLC two devices converge on the same order after exchanging
      - HLC refuses a peer whose clock is implausibly far ahead

  - id: M0-ID-03
    milestone: M0
    title: Every mutation carries a complete, unforgeable row envelope
    status: done
    proof:
      - the envelope is stamped on every row from the ActorContext
      - the envelope cannot be forged by a caller
      - the envelope an update bumps the revision and re-stamps the clock
      - ActorContext refuses an empty identity, in release as well as in debug

  - id: M0-TIME-01
    milestone: M0
    title: Reports group on the shopkeeper's day and the Pakistani fiscal year
    status: done
    proof:
      - BusinessDate uses the shopkeeper day, not the UTC day
      - BusinessDate derives the Pakistani fiscal year, which starts 1 July

  - id: M0-SCHEMA-01
    milestone: M0
    title: Schema v1 holds all twenty-five tables, every one STRICT
    status: done
    proof:
      - the schema contains exactly the tables this version plans
      - every table is STRICT
      - a STRICT table refuses text in an integer column

  - id: M0-SCHEMA-02
    milestone: M0
    title: Every foreign key is real, indexed, and enforced
    status: done
    proof:
      - every *_id column is a real foreign key
      - every foreign key points at an existing table and column
      - every foreign key has a covering index
