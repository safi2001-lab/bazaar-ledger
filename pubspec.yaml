name: bazaar_ledger
description: >-
  Offline-first billing, khata and stock for Pakistani shops. Everything lives
  on the phone: no server, no account, no network call on the billing path.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  # The wiring point. It depends on pk_data and drift; this package does not,
  # and must not. A widget that imports drift is a resolution error rather
  # than a review comment, and `depend_on_referenced_packages: error` in the
  # shared analysis options closes the transitive loophole.
  pk_bootstrap:
    path: packages/pk_bootstrap
  pk_domain:
    path: packages/pk_domain
  pk_money:
    path: packages/pk_money
  share_plus: ^10.1.4

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
