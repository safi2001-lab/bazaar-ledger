name: bazaar_ledger
description: >-
  Offline-first billing, khata and stock for Pakistani shops. Everything lives
  on the phone: no server, no account, no network call on the billing path.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  # Google sign-in, for one thing only: an access token with scope
  # `drive.appdata`, so the daily backup (M20) can reach the shop's own
  # Drive. Authorization only; the app never asks who the user is. Nothing
  # is called unless the build carries GOOGLE_OAUTH_CLIENT_ID and the owner
  # turns Drive backup on.
  google_sign_in: ^7.2.0
  # The system photo picker, deliberately. On Android 13+ image_picker routes
  # through Android's own Photo Picker, which needs NO permission at all --
  # not READ_MEDIA_IMAGES, which Play now restricts to apps whose core
  # function the system picker cannot serve, and which would put a billing app
  # through a declaration review to let a shopkeeper photograph a tin of oil.
  #
  # Gallery only. Camera capture would pull in CAMERA, and that permission
  # arrives with barcode scanning or not at all.
  image_picker: ^1.1.2
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.3
  intl: ^0.20.2
  # Camera barcode scanning, with ML Kit BUNDLED rather than downloaded.
  #
  # The unbundled variant is ~3 MB smaller and fetches its model through Play
  # Services on first use — which is the exact moment a shop with a patchy
  # connection is standing at the counter with a customer waiting. It fails
  # there, silently, on the first day. Paying the megabytes is the whole
  # offline-first argument applied to a dependency.
  #
  # AGP 9: it builds, on a fuse. The build prints
  #
  #   WARNING: Your app uses the following plugins that apply Kotlin Gradle
  #   Plugin (KGP): mobile_scanner
  #   Future versions of Flutter will fail to build if your app uses plugins
  #   that apply KGP.
  #
  # so it survives today only because android/gradle.properties still carries
  # `android.builtInKotlin=false`, the escape hatch Flutter 3.44 added for
  # exactly this transition. That flag is the single thing standing between
  # this dependency and a broken build, and it will not be there forever.
  #
  # Written down rather than left as a warning nobody reads: when this stops
  # building, the cause is here and the fix is a mobile_scanner that has
  # migrated to Built-in Kotlin, not a change on our side.
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.5
  # The wiring point. It depends on pk_data and drift; this package does not,
  # and must not. A widget that imports drift is a resolution error rather
  # than a review comment, and `depend_on_referenced_packages: error` in the
  # shared analysis options closes the transitive loophole.
  pk_bootstrap:
    path: packages/pk_bootstrap
  pk_domain:
    path: packages/pk_domain
  pk_money:
    path: packages/pk_money
  pk_printer_android:
    path: packages/pk_printer_android
  share_plus: ^13.3.0
  # Opening WhatsApp on a customer's chat with the reminder already typed.
  #
  # An intent, not an API: nothing is sent anywhere by this app, and there is
  # no token, no account and no endpoint. The `whatsapp://` scheme resolves to
  # the app already on the phone, and the <queries> block in the manifest is
  # what lets us ask whether it is there before offering the button.
  #
  # Deliberately never `wa.me`. That URL would open a browser to Meta when
  # WhatsApp is absent — a network call this app does not make — so the
  # fallback is the system share sheet, which also reaches SMS.
  url_launcher: ^6.3.1

dev_dependencies:
  # Test-only: signing a purchase as Google Play would, with a test key.
  crypto: ^3.0.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Test-only. Building a photograph-shaped fixture so the item picture path
  # can be exercised without a camera or a system dialog.
  image: ^4.5.4
  integration_test:
    sdk: flutter
  # The gate runner. From melos 3.0 it must be a dev_dependency beside
  # melos.yaml or every `melos run` refuses with a migration notice — which
  # is what every one of them did, silently, because nothing in this repo had
  # ever invoked one. The whole CI workflow calls melos and would have failed
  # on its first step.
  #
  # Pinned to 6.x deliberately. Melos 7 dropped melos.yaml for pub workspaces,
  # so an unpinned `dart pub global activate melos` in CI resolves to 8.x and
  # cannot read this workspace at all. That is exactly how this broke: the
  # workflow was written when 6 was current and went wrong without anybody
  # editing it.
  melos: ^6.3.2
  # The virtual printer the paper proofs print to (M2).
  pk_platform:
    path: packages/pk_platform
  # Test-only. The share sheet is faked at the platform seam rather than at
  # the method channel, because a host `flutter test` has no Android to talk
  # to: share_plus resolves to its desktop implementation and the Android
  # channel is never called. A test that stubbed the channel would record
  # nothing while asserting it had.
  share_plus_platform_interface: ^7.2.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Carried into shared PDFs, not used for anything on screen: Android's own
    # fonts already render Urdu in the app. A PDF is read on somebody else's
    # phone and has no system fallback, so the face has to travel inside the
    # file. A 178 KB face that deflates to 92 KB in the APK, and the pdf
    # package embeds only the glyphs a given receipt uses — about 2.6 KB per
    # bill, and nothing at all on a bill with no Urdu in it.
    - assets/fonts/NotoNaskhArabic-Regular.ttf

# SQLite3MultipleCiphers in place of plain SQLite, so the books on the phone
# can be encrypted at rest (M14). A database opened with no key is an
# ordinary SQLite file, so tests and a phone whose keystore is unavailable
# work exactly as before.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
