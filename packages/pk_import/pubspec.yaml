name: pk_import
description: >-
  Bringing a shop's existing lists into Bazaar Ledger: items and parties
  read from an Excel workbook or a CSV file, matched to columns by their
  headings, checked row by row. No database and no Flutter.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  archive: ^4.0.0
  pk_money:
    path: ../pk_money
  xml: ^7.0.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
