name: pk_bootstrap
description: >-
  The one wiring point. Opens the database, resumes the clocks, and hands the
  app a set of ports. This is the only package that knows both drift and
  Flutter, and nothing above it may import either.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0
  flutter: ">=3.24.0"

dependencies:
  drift: ^2.35.0
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.5
  pk_application:
    path: ../pk_application
  pk_data:
    path: ../pk_data
  pk_domain:
    path: ../pk_domain
  pk_export:
    path: ../pk_export
  pk_import:
    path: ../pk_import
  pk_money:
    path: ../pk_money
  pk_platform:
    path: ../pk_platform
  pk_reports:
    path: ../pk_reports
  pk_sync:
    path: ../pk_sync
  sqlite3: ">=3.4.0 <3.6.0"

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# SQLite3MultipleCiphers in place of plain SQLite, so the books on the phone
# can be encrypted at rest (M14). A database opened with no key is an
# ordinary SQLite file, so tests and a phone whose keystore is unavailable
# work exactly as before.
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc
