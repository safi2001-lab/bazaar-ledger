name: pk_platform
description: >-
  Device-facing adapters for Bazaar Ledger: receipt rendering, printer
  transports, scanners, secure storage. Implements ports declared in
  pk_domain.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # Pure Dart, zero platform dependencies, and already in the tree via `pdf`.
  # Named directly because the label renderer imports it, and a direct import
  # of a transitive dependency breaks the day the intermediate package drops
  # it.
  barcode: ^2.2.9
  # Already in the tree transitively via `pdf`; named here because the print
  # queue depends on it directly, and a direct import of a transitive
  # dependency breaks the moment the intermediate package drops it.
  crypto: ^3.0.6
  pdf: ^3.11.0
  pk_domain:
    path: ../pk_domain
  pk_money:
    path: ../pk_money

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
