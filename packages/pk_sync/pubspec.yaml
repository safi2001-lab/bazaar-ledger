name: pk_sync
description: >-
  LAN multi-counter sync for Bazaar Ledger: the wire format, the exchange
  between two peers, and a small HTTP host and client for the shop's own
  wi-fi. No database and no Flutter; the books reach it through SyncPeer.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # The wire is sealed (M23): X25519 to join, AES-256-GCM after. Pure Dart,
  # and already the backup's cipher, so nothing new reaches the APK.
  cryptography: ^2.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
