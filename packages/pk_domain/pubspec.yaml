name: pk_domain
description: >-
  Entities, ports and pure posting rules for Bazaar Ledger. Depends on
  pk_money and nothing else — no drift, no Flutter, no platform. Everything
  here is deterministic and testable without a database.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  pk_money:
    path: ../pk_money

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
