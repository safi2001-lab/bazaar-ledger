name: pk_data
description: >-
  Schema, migrations, DAOs and the single transactional write path for
  Bazaar Ledger. Depends on drift, pk_domain and pk_money — never on Flutter,
  so the whole persistence layer is testable headless.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # Content-addressing attachments. Already in the tree transitively; named
  # here because this package imports it directly, and a direct import of a
  # transitive dependency breaks the moment the intermediate package drops it.
  crypto: ^3.0.6
  drift: ^2.28.0
  pk_domain:
    path: ../pk_domain
  pk_money:
    path: ../pk_money
  pk_reports:
    path: ../pk_reports

dev_dependencies:
  build_runner: ^2.4.15
  drift_dev: ^2.28.0
  lints: ^6.0.0
  pk_application:
    path: ../pk_application
  pk_platform:
    path: ../pk_platform
  sqlite3: ^2.4.0
  test: ^1.26.0
