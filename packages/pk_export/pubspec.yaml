name: pk_export
description: >-
  Turns a finished report into a file a shop can hand its accountant. Pure
  Dart: it encodes what pk_reports computed and adds nothing up itself.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  # Pure Dart, and already in the app for receipts and notices.
  pdf: ^3.11.0
  pk_domain:
    path: ../pk_domain
  pk_money:
    path: ../pk_money
  pk_reports:
    path: ../pk_reports

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
