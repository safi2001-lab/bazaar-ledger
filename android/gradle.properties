# 4 GB, not 8, and 1 GB of metaspace, not 4.
#
# The previous values asked for 12.5 GB for a single JVM. Alongside the Kotlin
# daemon, an Android emulator and the Dart VM running the acceptance suite,
# that took a 32 GB machine down to 3.7 GB free and the integration test died
# with `zone.cc: 96: error: Out of memory` inside the Dart compiler -- a crash
# that reads as a Flutter bug and is actually a memory budget.
#
# This project builds comfortably inside 4 GB. It also has to build on a
# 16 GB CI runner that is simultaneously running a Gradle daemon and a Kotlin
# daemon, where the old figure was one dependency away from a flaky OOM that
# nobody would have diagnosed correctly.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
