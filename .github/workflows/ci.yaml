name: ci

# Every gate, failing closed.
#
# Three jobs, in tiers, matching docs/verification_tiers.md:
#
#   gates    Tier A — host only. Arithmetic, schema, the write path, widgets,
#            goldens, and every file-shaped fact.
#   android  Tier B — host plus the Android SDK. The things only an artefact
#            can prove: real signing, the MERGED permission set, 16 KB
#            alignment, size.
#   device   Tier C — an emulator. integration_test/, which is the acceptance
#            gate and had never run anywhere but a bench handset.
#
# The gate lists live in melos.yaml and this file calls them, so the two cannot
# drift apart. test/gate_parity_test.dart fails if they do — because a workflow
# that has quietly stopped running a gate looks exactly like one that runs it.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned exactly, not "stable". A developer on a newer Flutter and a CI on an
  # older one get different diagnostics from the same code, and the difference
  # always surfaces as an argument about whose machine is right.
  FLUTTER_VERSION: 3.44.9

jobs:
  gates:
    name: Tier A — host
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Full history: verify_ledger's R4 and R5 read the commit range, and a
      # shallow clone silently degrades them into rules that always pass.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve every package
        run: |
          set -e
          for dir in packages/*/ .; do
            echo "== pub get $dir"
            (cd "$dir" && flutter pub get)
          done

      - run: dart pub global activate melos

      # The generated string classes are committed AND regenerated here. Without
      # this, a stale checked-in generation is silently overwritten in CI and
      # diverges from what every developer sees locally.
      - name: Localisations are not stale
        run: melos run l10n:check

      # Zero issues, infos included. Most lint diagnostics are info-level, so
      # without --fatal-infos a rule that lights up every IDE passes CI in
      # silence.
      - name: Analyze
        run: melos run analyze

      # Thirteen rules, each naming the defect it exists to prevent, each with
      # fixtures proving it can still fire. A plain script with no dependencies,
      # so no analyzer bump can disable it and leave the tick green.
      - name: Architecture rules
        run: melos run arch

      # The ledger's shape, before anything is run: every milestone declared,
      # every open milestone measured, every changed file owned, every
      # milestone a commit names actually open.
      - name: Feature ledger — shape
        run: melos run ledger

      - name: Package tests
        run: |
          set -e
          for dir in packages/*/; do
            if [ -d "$dir/test" ]; then
              echo "== test $dir"
              (cd "$dir" && flutter test --reporter expanded)
            fi
          done

      # Widget tests drive the real tree against a real SQLite database. Mock
      # databases are banned here on purpose: the build this replaced passed its
      # whole suite while the app wrote nothing at all.
      - name: App tests
        run: flutter test --reporter expanded

      - name: Golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/failures/**
          retention-days: 7
          if-no-files-found: ignore

      # Last, and the only gate that can contradict a commit message.
      - name: Feature ledger — proofs
        run: melos run verify

  android:
    name: Tier B — artefact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gates

    steps:
      - uses: actions/checkout@v4

      # The wrapper jar is committed, so its checksum is checked against
      # Gradle's published list. That is the actual defence against a tampered
      # wrapper — rather than not committing one and building against whatever
      # the runner happens to have.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve every package
        run: |
          set -e
          for dir in packages/*/ .; do
            (cd "$dir" && flutter pub get)
          done

      # A release build without this now FAILS rather than producing an
      # unsigned APK, so a fork PR with no access to the secret cannot quietly
      # produce a green artefact nobody could install.
      - name: Upload key
        id: key
        env:
          KEYSTORE: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No upload keystore secret. The Tier B artefact"\
                 "gates are SKIPPED, not passed — see the summary."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > android/upload.jks
          cat > android/key.properties <<EOF
          storeFile=upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "available=true" >> "$GITHUB_OUTPUT"

      # Says so in the job summary rather than passing quietly. A skipped gate
      # that looks like a passing one is the failure this repository keeps
      # finding in its own history.
      - name: Record that the artefact gates did not run
        if: steps.key.outputs.available != 'true'
        run: |
          {
            echo "### Tier B artefact gates: SKIPPED"
            echo ""
            echo "No \`UPLOAD_KEYSTORE_BASE64\` secret, so signing, the merged"
            echo "permission set, 16 KB alignment and size were NOT checked."
            echo "This is expected on a fork PR and must never be true on main."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefact gates
        if: steps.key.outputs.available == 'true'
        run: dart run tool/android_gates.dart

      - name: Printer plugin unit tests
        run: dart run tool/android_gates.dart --plugin-tests-only

      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.available == 'true'
        with:
          name: apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  device:
    name: Tier C — acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: gates

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve every package
        run: |
          set -e
          for dir in packages/*/ .; do
            (cd "$dir" && flutter pub get)
          done

      # KVM, or the emulator falls back to software rendering and the suite
      # times out rather than failing for a reason anybody can act on.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The first Android build on a fresh runner takes six minutes (Gradle,
      # CMake). Done inside the emulator step, the emulator sat idle that long
      # and once dropped offline just after the install: "Failed to start Dart
      # Development Service" on the first file, which reads as a broken test.
      # Built here first, every build inside the emulator step is the
      # half-minute incremental one.
      - name: Warm the Android build
        run: flutter build apk --debug

      # API 36, matching targetSdk. Running the acceptance suite on an older
      # image would prove the app works under a permission model it does not
      # ship against.
      - name: Acceptance suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # Both lines run while the emulator is up. The ledger check used to
          # be a step of its own after this one — by which point the action
          # had already killed the emulator, so `--device` re-ran
          # integration_test/ against no device at all. It went unnoticed
          # while every row with a device proof was still `wip`; the first
          # row marked done failed on proofs the acceptance suite had just
          # passed on the emulator a minute earlier.
          #
          # verify_ledger --device asserts every `device_proof:` in the ledger
          # actually passed, and fails if no row names one — otherwise it is a
          # flag that reports success for verifying nothing.
          script: |
            flutter test integration_test --reporter expanded
            dart run tool/verify_ledger.dart --device
