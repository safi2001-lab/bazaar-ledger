# The Play Store release: a signed app bundle, built from secrets.
#
# Every credential is a GitHub Actions secret (Settings > Secrets and
# variables > Actions), turned into files by tool/release_env.dart and
# never committed. docs/RELEASE.md says where each one comes from.
#
# Run it from the Actions tab ("release" > Run workflow), or push a tag
# like v1.0.0. It refuses to build unless every secret a store release
# needs is there: an upload key, the Play licensing key (or no plan can be
# bought) and the Google OAuth client (or no Drive backup is offered).
#
# With PLAY_SERVICE_ACCOUNT_JSON set it also uploads the bundle to the
# internal testing track; promoting it to production stays a person's
# decision, in Play Console.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name, like 1.0.0 (blank keeps pubspec.yaml)'
        required: false
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  bundle:
    name: Signed app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve every package
        run: |
          set -e
          for dir in packages/*/ .; do
            (cd "$dir" && flutter pub get)
          done

      - name: Credentials from secrets
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          PLAY_BILLING_PUBLIC_KEY: ${{ secrets.PLAY_BILLING_PUBLIC_KEY }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: dart run tool/release_env.dart --release

      # versionCode must rise with every upload Play accepts; the run number
      # does, and never repeats.
      - name: Version
        id: version
        run: |
          name="${{ github.event.inputs.version }}"
          if [ -z "$name" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          fi
          if [ -z "$name" ]; then
            name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      # The same gates every push runs, so nothing reaches Play that CI on
      # master would have stopped.
      - name: Gates
        run: |
          set -e
          flutter analyze --fatal-infos
          dart run tool/arch_check.dart
          flutter test

      - name: Build
        run: |
          flutter build appbundle --release \
            --dart-define-from-file=config/app_config.json \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --obfuscate --split-debug-info=build/symbols

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release/mapping.txt
            build/symbols/
          retention-days: 90

      - name: Service account
        id: play
        env:
          JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$JSON" ]; then
            echo "upload=false" >> "$GITHUB_OUTPUT"
            echo "### Bundle built; not uploaded" >> "$GITHUB_STEP_SUMMARY"
            echo "No PLAY_SERVICE_ACCOUNT_JSON secret: download the bundle" \
                 "from this run and upload it in Play Console." \
                 >> "$GITHUB_STEP_SUMMARY"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to the internal testing track
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pk.bazaarledger
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          mappingFile: build/app/outputs/mapping/release/mapping.txt
