# An APK to put on your own phone.
#
# Not the release build: `build.gradle.kts` refuses a release without the
# upload key, on purpose, so nothing unpublishable is ever called a release.
# This is `--profile` — compiled ahead of time and as fast as release — signed
# with the development key, which Android installs happily from a file but
# the Play Store would not accept.
#
# Runs on every push to master and whenever it is started by hand from the
# Actions tab. The APKs are attached to the run as "phone-apk".
name: phone apk
on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.9

jobs:
  apk:
    name: Build an installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve every package
        run: |
          set -e
          for dir in packages/*/ .; do
            (cd "$dir" && flutter pub get)
          done
      # One APK per processor type, each a third of the size of one that
      # carries all three. Almost every phone sold in the last eight years
      # wants arm64-v8a.
      - name: Build
        run: flutter build apk --profile --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: phone-apk
          path: build/app/outputs/flutter-apk/*-profile.apk
          retention-days: 30
